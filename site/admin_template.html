<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Vote Helper Responses</title>
<style>
/*__FONTS__*/
:root {
  --bg: #EEF1F0; --surface: #FFFFFF; --surface-2: #F4F6F5; --ink: #121A1F; --ink-2: #4E5A64; --ink-3: #6B7780;
  --line: #D5DCDE; --line-2: #E6EBEC; --wash: #E3EAEC; --bar: #2B6E7E; --bar-soft: rgba(43, 110, 126, 0.14); --danger: #A3261F;
  --shadow: 0 1px 2px rgba(18, 26, 31, 0.05), 0 4px 14px rgba(18, 26, 31, 0.05);
  --f-display: "Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1418; --surface: #161F25; --surface-2: #1C272E; --ink: #E8EEF0; --ink-2: #A9B6BD; --ink-3: #85939B;
    --line: #2A3840; --line-2: #223037; --wash: #22303A; --bar: #6FB3C4; --bar-soft: rgba(111, 179, 196, 0.16); --danger: #FF8A80;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1418; --surface: #161F25; --surface-2: #1C272E; --ink: #E8EEF0; --ink-2: #A9B6BD; --ink-3: #85939B;
  --line: #2A3840; --line-2: #223037; --wash: #22303A; --bar: #6FB3C4; --bar-soft: rgba(111, 179, 196, 0.16); --danger: #FF8A80;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3); color-scheme: dark;
}
* { box-sizing: border-box; }
::selection { background: var(--bar); color: var(--surface); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
main { max-width: 1160px; margin: 0 auto; padding: 0 16px 64px; }
h1 { font: 800 1.55rem/1.15 var(--f-display); font-stretch: 112%; letter-spacing: -0.01em; margin: 0; }
h2 { font: 700 1.05rem/1.3 var(--f-display); font-stretch: 106%; margin: 0 0 12px; }
h3 { font-size: 0.98rem; margin: 0 0 8px; font-weight: 700; }
.muted { color: var(--ink-2); }
.small { font-size: 0.85rem; }
.top { position: relative; z-index: 20; margin: 0 -16px 18px; padding: 14px 16px 12px; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: saturate(1.2) blur(8px); -webkit-backdrop-filter: saturate(1.2) blur(8px); border-bottom: 1px solid var(--line-2); display: grid; gap: 10px; }
@media (min-width: 900px) { .top { position: sticky; top: 0; } .top-title { flex-wrap: nowrap; } .top-title #stamp { flex: 1; min-width: 0; } }
.top-title { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.top-title #stamp { margin: 0; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: end; }
.controls select { width: auto; max-width: 15rem; }
.controls label { display: grid; gap: 3px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); }
.top-title .actions { margin-left: auto; display: flex; gap: 8px; align-self: center; }
select, button, .btn { max-width: 100%; font: inherit; font-size: 0.9rem; letter-spacing: 0; text-transform: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 6px 12px; min-height: 36px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: border-color 0.15s, background-color 0.15s; }
select:hover, button:hover, .btn:hover { border-color: var(--ink-3); background: var(--surface-2); }
select:focus-visible, button:focus-visible, .btn:focus-visible, input:focus-visible { outline: 2px solid var(--bar); outline-offset: 2px; }
button.danger { color: var(--danger); }
.card { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; min-width: 0; box-shadow: var(--shadow); }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.grid > .card { margin-bottom: 0; }
.kpis { display: grid; gap: 1px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 16px; background: var(--line-2); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.kpi { padding: 14px 18px 15px; background: var(--surface); display: grid; gap: 2px; align-content: start; }
.kpi b { display: block; font: 800 1.75rem/1.1 var(--f-display); font-stretch: 108%; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.kpi span { font-size: 0.82rem; color: var(--ink-2); line-height: 1.3; }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 160px) 1fr 64px; gap: 12px; align-items: center; }
.bar-row .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { background: var(--surface-2); border-radius: 999px; height: 10px; overflow: hidden; }
.fill { height: 100%; border-radius: 999px; background: var(--bar); min-width: 3px; }
.val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }
/* Responses per hour */
.rate-head { display: flex; flex-wrap: wrap; gap: 6px 26px; margin: -2px 0 12px; }
.rate-head div { display: grid; }
.rate-head b { font: 800 1.25rem/1.2 var(--f-display); font-variant-numeric: tabular-nums; }
.rate-head span { font-size: 0.78rem; color: var(--ink-2); }
.rate-box { position: relative; }
.rate { display: block; width: 100%; height: 230px; overflow: visible; touch-action: pan-y; }
.rate .grid-l { stroke: var(--line-2); stroke-width: 1; shape-rendering: crispEdges; }
.rate .day-l { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; shape-rendering: crispEdges; }
.rate text { font: 11px var(--f-body); fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.rate .area { fill: var(--bar-soft); }
.rate .line { fill: none; stroke: var(--bar); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.rate .avg { fill: none; stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 5 4; }
.rate .cross { stroke: var(--ink-3); stroke-width: 1; }
.rate .pt { fill: var(--surface); stroke: var(--bar); stroke-width: 2; }
.rate-tip { position: absolute; top: -6px; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 0.8rem; padding: 5px 9px; border-radius: 8px; white-space: nowrap; transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.rate-key { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; }
.rate-key i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--bar); vertical-align: middle; margin-right: 6px; }
.rate-key i.avg { border-top: 2px dashed var(--ink-2); }
.q { border-top: 1px solid var(--line-2); padding: 14px 0; }
.q:first-of-type { border-top: 0; padding-top: 0; }
.opt { display: grid; grid-template-columns: 1fr minmax(80px, 30%) 56px; gap: 10px; align-items: center; margin: 6px 0; }
.chips { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-left: 6px; }
.chip { font-size: 0.72rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; color: #fff; white-space: nowrap; }
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
th { color: var(--ink-3); font-weight: 700; font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase; border-bottom-color: var(--line); }
tbody tr:hover td { background: var(--surface-2); }
.scroll { overflow-x: auto; }
.empty { padding: 30px 0; text-align: center; }
.tag { font-size: 0.75rem; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin-left: 6px; color: var(--ink-2); }
/* Collapsible sections: a card whose heading is the summary */
details.sec > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
details.sec > summary::-webkit-details-marker, details.q > summary::-webkit-details-marker { display: none; }
details.sec > summary h2 { margin: 0; }
details.sec > summary > .small { color: var(--ink-3); }
details.sec[open] > summary { margin-bottom: 14px; }
.caret { display: inline-block; width: 0.8em; color: var(--ink-3); transition: transform 0.15s; }
details[open] > summary .caret { transform: rotate(90deg); }
summary:focus-visible { outline: 2px solid var(--bar); outline-offset: 3px; border-radius: 4px; }
.sec-tools { margin-left: auto; display: flex; gap: 6px; }
.sec-tools button { min-height: 30px; padding: 3px 10px; font-size: 0.85rem; }
details.q > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1.2em minmax(0, 1fr) auto; gap: 8px; align-items: baseline; }
details.q > summary h3 { margin: 0; }
details.q[open] > summary { margin-bottom: 6px; }
.q-sum { font-size: 0.82rem; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.more-rows tr.more { display: none; }
.more-rows.show tr.more { display: table-row; }
.linkish { border: 0; background: none; padding: 4px 0; min-height: 0; color: var(--bar); text-decoration: underline; text-underline-offset: 3px; text-align: left; font-weight: 700; }
.linkish:hover { background: none; border: 0; }
/* Riding map: drawn from /geo/eds.json over /geo/basemap.json, pan and zoom by changing the SVG viewBox */
:root { --water: #CFE0E8; --land: #F4F5F1; --coast: #7F9BA8; --river: #8FB7C9; --label: #24323A; --water-label: #3F6F86; --halo: #FFFFFF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --water: #0D2230; --land: #26333C; --coast: #557584; --river: #2F5A70; --label: #DCE6EA; --water-label: #8DB9CE; --halo: #10171B; } }
:root[data-theme="dark"] { --water: #0D2230; --land: #26333C; --coast: #557584; --river: #2F5A70; --label: #DCE6EA; --water-label: #8DB9CE; --halo: #10171B; }
.map-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; align-items: start; }
.map-box { position: relative; background: var(--water); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
#map-svg .land { fill: var(--land); }
#map-svg .lakes { fill: var(--water); }
#map-svg .coast { fill: none; stroke: var(--coast); stroke-width: 0.6; }
#map-svg .rivers path { fill: none; stroke: var(--river); stroke-linecap: round; stroke-linejoin: round; }
#map-svg .rivers .r1 { stroke-width: 1.4; } #map-svg .rivers .r2 { stroke-width: 1; } #map-svg .rivers .r3 { stroke-width: 0.7; }
#map-svg[data-z="0"] .rivers .r2, #map-svg[data-z="0"] .rivers .r3, #map-svg[data-z="1"] .rivers .r3 { display: none; }
#map-svg .lakes, #map-svg .coast, #map-svg .rivers path, #map-svg #map-labels { pointer-events: none; }
#map-svg .lakes, #map-svg .coast, #map-svg .rivers path { vector-effect: non-scaling-stroke; }
#map-svg text { paint-order: stroke; stroke: var(--halo); stroke-linejoin: round; fill: var(--label); font-family: var(--f-body); }
#map-svg text.water { fill: var(--water-label); font-style: italic; }
#map-svg text.region { fill: var(--ink-2); letter-spacing: 0.08em; text-transform: uppercase; }
#map-svg circle.town { fill: var(--label); stroke: var(--halo); }
.map-credit { font-size: 0.75rem; }
#map-svg { display: block; width: 100%; height: auto; max-height: min(70vh, 620px); touch-action: none; cursor: grab; user-select: none; }
#map-svg.dragging { cursor: grabbing; }
#map-g path { stroke: var(--surface); stroke-width: 0.7; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
#map-g path.nodata { fill: var(--wash); }
#map-g path.hover { stroke: var(--ink-2); stroke-width: 1.5; }
#map-g path.sel { stroke: var(--ink); stroke-width: 2.5; }
.map-zoom { position: absolute; top: 10px; left: 10px; display: grid; gap: 4px; }
.map-zoom button { width: 34px; height: 34px; min-height: 0; padding: 0; justify-content: center; font-size: 1.1rem; line-height: 1; }
.map-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.map-side { display: grid; gap: 12px; min-width: 0; }
.legend { display: grid; gap: 4px; font-size: 0.85rem; }
.legend .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 6px; vertical-align: -2px; border: 1px solid var(--line); }
.legend .row { display: flex; justify-content: space-between; gap: 8px; }
.legend .row span:last-child { font-variant-numeric: tabular-nums; color: var(--ink-2); }
.info { border-top: 1px solid var(--line); padding-top: 10px; min-height: 120px; }
.info h3 { margin-bottom: 2px; }
.info .bar-row { grid-template-columns: minmax(70px, 110px) 1fr 44px; gap: 6px; font-size: 0.85rem; }
/* Patterns: one row per group, a 100% stacked bar of best matches */
.pat-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.pat-tools label { display: grid; gap: 4px; width: min(100%, 36em); }
#pat-by { width: 100%; }
.pat-verdict { margin: 0 0 12px; }
.pat-rows { display: grid; gap: 6px; margin-bottom: 8px; }
.pat-row { display: grid; grid-template-columns: minmax(110px, 200px) minmax(0, 1fr) 52px; gap: 10px; align-items: center; }
.pat-row.few { opacity: 0.5; }
.pat-row .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stack { display: flex; height: 18px; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
.stack span { height: 100%; min-width: 0; }
.stack span + span { box-shadow: inset 1px 0 0 var(--surface); }
.pat-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 4px 0 14px; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.weak, .weak { color: var(--ink-2); }
.vbar { display: inline-block; width: 60px; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; vertical-align: middle; margin-right: 6px; }
.vbar i { display: block; height: 100%; background: var(--bar); }
.pat-sub { margin: 18px 0 8px; }
@media (max-width: 860px) { .map-wrap { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .caret { transition: none; } }
@media (max-width: 560px) {
  .bar-row { grid-template-columns: 90px 1fr 52px; }
  .pat-row { grid-template-columns: 96px minmax(0, 1fr) 44px; gap: 6px; }
  /* question and pair lists: one stacked block per row instead of three narrow columns */
  .pat-list thead { display: none; }
  .pat-list tr, .pat-list.show tr.more { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .pat-list td { border: 0; padding: 0; }
  .pat-list td:last-child { grid-column: 1 / -1; }
  .opt { grid-template-columns: 1fr 70px 46px; }
  details.q > summary { grid-template-columns: 1.2em minmax(0, 1fr); }
  .q-sum { grid-column: 2; text-align: left; white-space: normal; }
}
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="top-title">
      <h1>Vote Helper responses</h1>
      <p class="muted small" id="stamp">Loading...</p>
      <span class="actions"><button type="button" id="refresh">Refresh</button>
      <a class="btn" href="/api/admin/export.csv">Download CSV</a></span>
    </div>
    <div class="controls">
      <label class="small">Period
        <select id="f-period">
          <option value="all">All time</option>
          <option value="7">Last 7 days</option>
          <option value="1">Last 24 hours</option>
        </select>
      </label>
      <label class="small">People
        <select id="f-who">
          <option value="all">Everyone</option>
          <option value="adults">Reading levels 3-5</option>
          <option value="kids">Reading levels 1-2</option>
        </select>
      </label>
      <label class="small">Region
        <select id="f-region"><option value="all">All regions</option></select>
      </label>
      <label class="small">Riding
        <select id="f-riding"><option value="all">All ridings</option></select>
      </label>
      <label class="small">Location
        <select id="f-where">
          <option value="all">All of Canada</option>
          <option value="BC">BC only</option>
        </select>
      </label>
    </div>
  </header>

  <div id="out"></div>
</main>

<script type="application/json" id="spec">/*__SPEC__*/</script>
<script>
(function () {
  "use strict";
  var SPEC = JSON.parse(document.getElementById("spec").textContent);
  var WEIGHTS = { low: 0.5, medium: 1, high: 2 };
  var PARTIES = SPEC.parties, PIDS = PARTIES.map(function (p) { return p.id; });
  var PBY = {}; PARTIES.forEach(function (p) { PBY[p.id] = p; });
  var ISSUE = {}; SPEC.issues.forEach(function (i) { ISSUE[i.id] = i; });
  var REGIONS = SPEC.regions || [], REGBY = {}; REGIONS.forEach(function (r) { REGBY[r.id] = r; });
  var RIDINGS = SPEC.ridings || [], RIDBY = {}; RIDINGS.forEach(function (r) { RIDBY[r.code] = r; });
  /* Which region owns each local question */
  var QREG = {}; REGIONS.forEach(function (r) { (r.local_qids || []).forEach(function (q) { QREG[q] = r.id; }); });
  var NOT_GIVEN = "none";
  /* Page language recorded with each session (NULL before languages were added) */
  var LANG_NAMES = { en: "English", pa: "Punjabi", "zh-Hans": "Chinese (Simplified)", "zh-Hant": "Chinese (Traditional)", tl: "Tagalog", fr: "French", ru: "Russian", ko: "Korean", fa: "Persian (Farsi)" };
  function langLabel(c) { return c ? LANG_NAMES[c] || c : "Not given"; }
  var DATA = null;

  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pct(n, d) { return d ? (100 * n) / d : 0; }
  function fmt(v) { return (Math.round(v * 10) / 10).toFixed(v >= 10 || v === 0 ? 0 : 1) + "%"; }
  function issueLabel(q) { var l = ISSUE[q.issue_id] && ISSUE[q.issue_id].label; return l ? (l["3"] || l[Object.keys(l)[0]]) : q.id; }

  /*
   * Same rule as the quiz: alignment = sum(w*s) / sum(w*4), skips and no-position cells left out.
   * With a riding, only the provincial questions and that region's local questions count (as on the
   * page). Without one (V1 rows, or "parties only"), every stored answer counts, which matches V1.
   */
  function inSet(q, riding) {
    if (!riding || !RIDBY[riding]) return true;
    return q.scope === "provincial" || QREG[q.id] === RIDBY[riding].region;
  }
  function score(answers, local, riding) {
    var t = {}; PIDS.forEach(function (p) { t[p] = { num: 0, den: 0 }; });
    SPEC.questions.forEach(function (q) {
      if (!inSet(q, riding)) return;
      var a = answers && answers[q.id];
      if (!a || !a.c || a.c === "skip") return;
      var opt = q.options.filter(function (o) { return o.id === a.c; })[0];
      if (!opt) return;
      var w = (WEIGHTS[a.w] || 1) * (local && q.scope === "local" ? 2 : 1);
      PIDS.forEach(function (p) {
        if ((q.no_pos || []).indexOf(p) >= 0) return;
        t[p].num += w * Number(opt.scores[p]); t[p].den += w * 4;
      });
    });
    var out = {}; PIDS.forEach(function (p) { out[p] = t[p].den ? (100 * t[p].num) / t[p].den : null; });
    return out;
  }
  function tops(map) {
    var best = -1, ids = [];
    PIDS.forEach(function (p) {
      if (map[p] == null) return;
      var v = Math.round(map[p]);
      if (v > best) { best = v; ids = [p]; } else if (v === best) ids.push(p);
    });
    return ids;
  }

  function load() {
    el("stamp").textContent = "Loading...";
    fetch("/api/admin/data", { credentials: "same-origin", cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (d) {
      var subBy = {}; d.submissions.forEach(function (s) { subBy[s.sid] = s; });
      d.people.forEach(function (p) {
        p.sub = subBy[p.sid] || {};
        p.riding = p.sub.riding && RIDBY[p.sub.riding] ? p.sub.riding : null;
        p.region = p.riding ? RIDBY[p.riding].region : null;
        p.prov = score(p.answers, false, p.riding);
        p.local = score(p.answers, true, p.riding);
        p.top = tops(p.prov);
        p.topLocal = tops(p.local);
      });
      DATA = d;
      render();
    }).catch(function (e) {
      el("stamp").textContent = "Could not load data (" + e.message + "). Your Access session may have expired: reload the page.";
    });
  }

  /* Period, people and location filters only. The map uses this set, so Region and Riding zoom it instead of emptying it. */
  function baseFiltered() {
    var period = el("f-period").value, who = el("f-who").value, where = el("f-where").value;
    var cutoff = period === "all" ? 0 : Date.parse(DATA.generated_at) - Number(period) * 86400000;
    return DATA.people.filter(function (p) {
      if (cutoff && Date.parse(p.sub.created_at) < cutoff) return false;
      if (who === "adults" && p.level < 3) return false;
      if (who === "kids" && p.level > 2) return false;
      if (where === "BC" && p.sub.region_code !== "BC") return false;
      return true;
    });
  }
  function filtered() {

    /* 1. best match per group */
    var t = cramer(big.map(function (x) { return cats.map(function (c) { return x.people.filter(function (p) { return topCat(p) === c; }).length; }); }));
    html += '<h3 class="pat-sub">Best match by ' + esc(g.label.toLowerCase()) + "</h3>";
    html += '<p class="small pat-verdict">' + (t ? verdict(t) : "Not enough variation to test.") + "</p>";
    html += '<div class="pat-rows">' + groups.map(function (x) {
      var n = x.people.length;
      var segs = cats.map(function (c) {
        var m = x.people.filter(function (p) { return topCat(p) === c; }).length;
        if (!m) return "";
        var nm = c === TIE ? "Tie" : PBY[c].short_name || PBY[c].name;
        return '<span style="width:' + (100 * m / n).toFixed(2) + "%;background:" + (c === TIE ? TIE_COLOR : esc(PBY[c].color)) + '" title="' + esc(nm + ": " + fmt(pct(m, n)) + " (" + m + ")") + '"></span>';
      }).join("");
      return '<div class="pat-row' + (n < PAT_MIN ? " few" : "") + '"><span class="lbl small" title="' + esc(x.name) + '">' + esc(x.name) + '</span><div class="stack">' + segs + '</div><span class="val small">' + n + "</span></div>";
    }).join("") + "</div>";
    html += '<div class="pat-legend small">' + cats.map(function (c) {
      return '<span><span class="dot" style="background:' + (c === TIE ? TIE_COLOR : esc(PBY[c].color)) + '"></span>' + esc(c === TIE ? "Tie" : PBY[c].short_name || PBY[c].name) + "</span>";
    }).join("") + '<span class="muted">Parties left to right, as on the results page. Right column: people</span></div>';

    /* 2. average party score per group, with a trend for ordered groupings */
    html += '<h3 class="pat-sub">Average match score</h3><div class="scroll"><table><thead><tr><th>Group</th><th class="num">People</th>' +
      LR.map(function (id) { return '<th class="num">' + esc(PBY[id].short_name || PBY[id].name) + "</th>"; }).join("") +
      '<th class="num">Skipped</th><th class="num">Marked high</th></tr></thead><tbody>';
    groups.forEach(function (x) {
      var n = x.people.length;
      html += "<tr" + (n < PAT_MIN ? ' class="weak"' : "") + "><td>" + esc(x.name) + '</td><td class="num">' + n + "</td>" + LR.map(function (id) {
        var s = 0, m = 0; x.people.forEach(function (p) { if (p.prov[id] != null) { s += p.prov[id]; m += 1; } });
        return '<td class="num">' + (m ? Math.round(s / m) : "-") + "</td>";
      }).join("") +
        '<td class="num">' + (x.people.reduce(function (a, p) { return a + countIf(p, function (v) { return v && v.c === "skip"; }); }, 0) / n).toFixed(1) + "</td>" +
        '<td class="num">' + (x.people.reduce(function (a, p) { return a + countIf(p, function (v) { return v && v.c && v.c !== "skip" && v.w === "high"; }); }, 0) / n).toFixed(1) + "</td></tr>";
    });
    if (g.ordered) {
      /* least-squares slope of score on group position (0, 1, 2...), people in groups of PAT_MIN+ only */
      var pos = {}; big.forEach(function (x) { pos[x.k] = g.keys.indexOf(x.k); });
      var trend = LR.map(function (id) {
        var xs = [], ys = [];
        big.forEach(function (x) { x.people.forEach(function (p) { if (p.prov[id] != null) { xs.push(pos[x.k]); ys.push(p.prov[id]); } }); });
        var n = xs.length, mx = xs.reduce(add, 0) / n, my = ys.reduce(add, 0) / n, sxy = 0, sxx = 0, syy = 0;
        for (var i = 0; i < n; i++) { sxy += (xs[i] - mx) * (ys[i] - my); sxx += (xs[i] - mx) * (xs[i] - mx); syy += (ys[i] - my) * (ys[i] - my); }
        if (!sxx || !syy) return '<td class="num weak">-</td>';
        var r = sxy / Math.sqrt(sxx * syy), p = normP(r * Math.sqrt(n - 1)), slope = sxy / sxx;
        return '<td class="num' + (p < 0.01 ? "" : " weak") + '" title="' + esc("r " + r.toFixed(2) + ", p " + fmtP(p)) + '">' + (slope >= 0 ? "+" : "") + slope.toFixed(1) + "</td>";
      });
      html += '<tr><td colspan="2"><b>Change per step</b></td>' + trend.join("") + "<td></td><td></td></tr>";
    }
    html += "</tbody></table></div>";
    html += '<p class="muted small">Scores 0 to 100, as on the results page.' + (g.ordered ? " Change per step: average points gained or lost from one group to the next. Grey: could be chance (p 0.01 or more)." : "") + "</p>";

    /* 3. questions answered most differently between the groups */
    var rows = [];
    SPEC.questions.forEach(function (q) {
      if (g.q && g.q.id === q.id) return;
      var gs = groups.map(function (x) { return { x: x, ans: x.people.map(function (p) { return choice(p, q); }).filter(Boolean) }; }).filter(function (y) { return y.ans.length >= PAT_MIN; });
      if (gs.length < 2) return;
      var ids = q.options.map(function (o) { return o.id; });
      var tq = cramer(gs.map(function (y) { return ids.map(function (c) { return y.ans.filter(function (a) { return a === c; }).length; }); }));
      if (!tq) return;
      /* the answer whose share differs most between two groups */
      var gap = null;
      ids.forEach(function (c) {
        var sh = gs.map(function (y) { return { y: y, s: y.ans.filter(function (a) { return a === c; }).length / y.ans.length }; });
        sh.sort(function (a, b) { return b.s - a.s; });
        var d = sh[0].s - sh[sh.length - 1].s;
        if (!gap || d > gap.d) gap = { d: d, c: c, hi: sh[0], lo: sh[sh.length - 1] };
      });
      rows.push({ q: q, t: tq, gap: gap });
    });
    rows.sort(byEvidence);
    var SHOWN = 8;
    html += '<h3 class="pat-sub">Questions answered most differently</h3>';
    if (!rows.length) html += '<p class="muted small">No question has two groups with ' + PAT_MIN + " or more answers.</p>";
    else html += moreTable("patq", SHOWN, rows.length, '<thead><tr><th>Question</th><th>Link</th><th>Largest gap</th></tr></thead><tbody>' + rows.map(function (r, i) {
      var o = r.q.options.filter(function (x) { return x.id === r.gap.c; })[0];
      return "<tr" + (i >= SHOWN ? ' class="more"' : "") + '><td><button type="button" class="linkish" data-pat="q:' + esc(r.q.id) + '" title="Compare by this question">' + esc(qName(r.q)) + "</button></td>" +
        '<td class="' + (r.t.p < 0.001 ? "" : "weak") + '" style="white-space:nowrap">' + vbar(r.t.v) + r.t.v.toFixed(2) + " " + esc(evidenceWord(r.t.p)) + "</td>" +
        '<td><span title="' + esc(o ? o.text : "") + '">' + letter(r.q, r.gap.c) + ". " + esc(cut(o && o.text, 50)) + "</span>: " +
        fmt(100 * r.gap.hi.s) + " (" + esc(r.gap.hi.y.x.short) + ") vs " + fmt(100 * r.gap.lo.s) + " (" + esc(r.gap.lo.y.x.short) + ")</td></tr>";
    }).join("") + "</tbody>", "questions", "pat-list");
    html += '<p class="muted small">Clear results first, then the rest; strongest link first within each. With ' + rows.length + " questions tested, one or two can look \"probably real\" by chance; \"clear\" is safer. Click a question to compare by it.</p>";
    return html;
  }

  /* Pairs of questions whose answers go together, over everyone in the current filters */
  var PAIRS_LOCAL = false;
  function pairsSection(P) {
    return section("pairs", "Answers that go together", "pairs of questions",
      '<p class="muted small">Pairs of questions where knowing one answer tells you most about the other (people who answered both, 30 or more). ' +
      "Clear results first, strongest first within each. Click a question to compare by it. Local questions are answered by one region only, so their pairs rest on fewer people.</p>" +
      '<label class="small"><input type="checkbox" id="pairs-local"' + (PAIRS_LOCAL ? " checked" : "") + "> Include local questions</label>" +
      '<div id="pairs-body">' + pairsBody(P) + "</div>");
  }
  function pairsBody(P) {
    var Q = SPEC.questions.filter(function (q) { return PAIRS_LOCAL || q.scope === "provincial"; }), MIN_BOTH = 30, rows = [];
    var ch = P.map(function (p) { return Q.map(function (q) { return choice(p, q); }); });
    for (var i = 0; i < Q.length; i++) {
      for (var j = i + 1; j < Q.length; j++) {
        var a = Q[i].options.map(function (o) { return o.id; }), b = Q[j].options.map(function (o) { return o.id; });
        var tab = a.map(function () { return b.map(function () { return 0; }); }), n = 0;
        for (var k = 0; k < ch.length; k++) {
          var x = ch[k][i], y = ch[k][j];
          if (!x || !y) continue;
          tab[a.indexOf(x)][b.indexOf(y)] += 1; n += 1;
        }
        if (n < MIN_BOTH) continue;
        var t = cramer(tab);
        if (!t) continue;
        /* the pair of answers picked together most often relative to chance, among cells big enough to trust */
        var best = null, minCell = Math.max(5, Math.round(0.03 * n));
        tab.forEach(function (r, ri) {
          var rt = r.reduce(add, 0);
          r.forEach(function (c, ci) {
            if (c < minCell) return;
            var ct = tab.reduce(function (s, rr) { return s + rr[ci]; }, 0), lift = (c / rt) / (ct / n);
            if (!best || lift > best.lift) best = { lift: lift, x: a[ri], y: b[ci], given: c / rt, base: ct / n, m: rt };
          });
        });
        rows.push({ q1: Q[i], q2: Q[j], t: t, best: best });
      }
    }
    rows.sort(byEvidence);
    var SHOWN = 10, html = "";
    if (!rows.length) return '<p class="muted">Not enough answers yet.</p>';
    html += '<p class="small muted">' + rows.length + " pairs.</p>" + moreTable("pairs", SHOWN, rows.length, "<thead><tr><th>Questions</th><th>Link</th><th>Answers most often picked together</th></tr></thead><tbody>" + rows.map(function (r, i) {
      var bt = r.best;
      return "<tr" + (i >= SHOWN ? ' class="more"' : "") + '><td><button type="button" class="linkish" data-pat="q:' + esc(r.q1.id) + '">' + esc(qName(r.q1)) + '</button> and <button type="button" class="linkish" data-pat="q:' + esc(r.q2.id) + '">' + esc(qName(r.q2)) + '</button> <span class="muted small">' + r.t.n + " people</span></td>" +
        '<td class="' + (r.t.p < 0.001 ? "" : "weak") + '" style="white-space:nowrap">' + vbar(r.t.v) + r.t.v.toFixed(2) + " " + esc(evidenceWord(r.t.p)) + "</td><td>" +
        (bt && bt.lift > 1 ? "Of the " + bt.m + " who picked " + letter(r.q1, bt.x) + " on the first, " + fmt(100 * bt.given) + " picked " + letter(r.q2, bt.y) + " on the second (" + fmt(100 * bt.base) + " of everyone)" : "-") + "</td></tr>";
    }).join("") + "</tbody>", "pairs", "pat-list");
    return html;
  }

  function wirePatterns(root) {
    var sel = el("pat-by");
    if (sel && !sel._wired) {
      sel._wired = true;
      sel.addEventListener("change", function () { setPattern(sel.value, false); });
    }
    var box = el("pairs-local");
    if (box && !box._wired) {
      box._wired = true;
      box.addEventListener("change", function () {
        PAIRS_LOCAL = box.checked;
        var body = el("pairs-body");
        body.innerHTML = pairsBody(PAT_P);
        wireMore(body);
        wirePatterns(body);
      });
    }
    Array.prototype.forEach.call(root.querySelectorAll("[data-pat]"), function (b) {
      b.addEventListener("click", function () { setPattern(b.getAttribute("data-pat"), true); });
    });
  }
  function setPattern(id, scroll) {
    PAT_BY = id;
    try { localStorage.setItem("bcvh-admin-pattern", id); } catch (e) { /* storage blocked */ }
    var sel = el("pat-by"), body = el("pat-body");
    if (!sel || !body) return;
    sel.value = patGrouping(id).id;
    body.innerHTML = patBody(PAT_P, patGrouping(id));
    wireMore(body);
    wirePatterns(body);
    if (scroll) {
      var d = sel.closest("details");
      if (d) { d.open = true; d.scrollIntoView({ behavior: "smooth", block: "start" }); }
    }
  }

  var armed = false;
  function delSelected() {
    var sids = Array.prototype.map.call(document.querySelectorAll(".del:checked"), function (c) { return c.value; });
    var msg = el("del-msg"), btn = el("del-btn");
    if (!sids.length) { msg.textContent = "Nothing selected."; return; }
    if (!armed) { armed = true; btn.textContent = "Click again to delete " + sids.length; msg.textContent = ""; return; }
    armed = false; btn.disabled = true;
    fetch("/api/admin/delete", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sids: sids }) })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); load(); })
      .catch(function (e) { msg.textContent = "Delete failed (" + e.message + ")."; btn.disabled = false; btn.textContent = "Delete selected"; });
  }

  el("f-riding").innerHTML = ridingOptions();
  el("f-region").innerHTML = regionOptions();
  /* Picking a riding sets its region; picking a region clears a riding outside it */
  el("f-riding").addEventListener("change", function () {
    var v = el("f-riding").value;
    if (RIDBY[v]) el("f-region").value = RIDBY[v].region;
    else if (v === NOT_GIVEN) el("f-region").value = "all";
  });
  el("f-region").addEventListener("change", function () {
    var v = el("f-riding").value, rg = el("f-region").value;
    if (RIDBY[v] && RIDBY[v].region !== rg) el("f-riding").value = "all";
  });
  ["f-period", "f-who", "f-where", "f-region", "f-riding"].forEach(function (id) { el(id).addEventListener("change", function () { if (DATA) render(); }); });
  el("refresh").addEventListener("click", load);
  load();
})();
</script>
</body>
</html>
