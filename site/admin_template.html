<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Vote Helper Responses</title>
<style>
:root {
  --bg: #ECEFEE; --surface: #FFFFFF; --surface-2: #F5F7F6; --ink: #121A1F; --ink-2: #4A5661;
  --line: #C7CFD2; --wash: #DCE4E6; --bar: #2B6E7E; --danger: #A3261F;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10171B; --surface: #172127; --surface-2: #1D2930; --ink: #E8EEF0; --ink-2: #A9B6BD;
    --line: #2F3E46; --wash: #24323A; --bar: #6FB3C4; --danger: #FF8A80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10171B; --surface: #172127; --surface-2: #1D2930; --ink: #E8EEF0; --ink-2: #A9B6BD;
  --line: #2F3E46; --wash: #24323A; --bar: #6FB3C4; --danger: #FF8A80; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1120px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 1.5rem; margin: 0; }
h2 { font-size: 1.1rem; margin: 0 0 12px; }
h3 { font-size: 0.98rem; margin: 0 0 8px; font-weight: 600; }
.muted { color: var(--ink-2); }
.small { font-size: 0.85rem; }
.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
select, button, .btn { max-width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; min-height: 36px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
button:hover, .btn:hover { background: var(--wash); }
button.danger { color: var(--danger); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; min-width: 0; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.grid > .card { margin-bottom: 0; }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.kpi b { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.bars { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 160px) 1fr 64px; gap: 10px; align-items: center; }
.bar-row .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { background: var(--surface-2); border-radius: 6px; height: 18px; overflow: hidden; }
.fill { height: 100%; border-radius: 6px; background: var(--bar); min-width: 2px; }
.val { text-align: right; font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.days { display: flex; align-items: flex-end; gap: 3px; height: 140px; border-bottom: 1px solid var(--line); padding-top: 8px; }
.day { flex: 1; background: var(--bar); border-radius: 3px 3px 0 0; min-height: 1px; position: relative; }
.days-x { display: flex; justify-content: space-between; margin-top: 4px; }
.q { border-top: 1px solid var(--line); padding: 14px 0; }
.q:first-of-type { border-top: 0; padding-top: 0; }
.opt { display: grid; grid-template-columns: 1fr minmax(80px, 30%) 56px; gap: 10px; align-items: center; margin: 6px 0; }
.chips { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-left: 6px; }
.chip { font-size: 0.72rem; padding: 1px 6px; border-radius: 999px; color: #fff; white-space: nowrap; }
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; }
.scroll { overflow-x: auto; }
.empty { padding: 30px 0; text-align: center; }
.tag { font-size: 0.75rem; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin-left: 6px; color: var(--ink-2); }
/* Collapsible sections: a card whose heading is the summary */
details.sec > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
details.sec > summary::-webkit-details-marker, details.q > summary::-webkit-details-marker { display: none; }
details.sec > summary h2 { margin: 0; }
details.sec[open] > summary { margin-bottom: 12px; }
.caret { display: inline-block; width: 0.8em; color: var(--ink-2); transition: transform 0.15s; }
details[open] > summary .caret { transform: rotate(90deg); }
summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 4px; }
.sec-tools { margin-left: auto; display: flex; gap: 6px; }
.sec-tools button { min-height: 30px; padding: 3px 10px; font-size: 0.85rem; }
details.q > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1.2em minmax(0, 1fr) auto; gap: 8px; align-items: baseline; }
details.q > summary h3 { margin: 0; }
details.q[open] > summary { margin-bottom: 6px; }
.q-sum { font-size: 0.82rem; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.more-rows tr.more { display: none; }
.more-rows.show tr.more { display: table-row; }
.linkish { border: 0; background: none; padding: 4px 0; min-height: 0; color: var(--bar); text-decoration: underline; }
.linkish:hover { background: none; }
/* Riding map: drawn from /geo/eds.json over /geo/basemap.json, pan and zoom by changing the SVG viewBox */
:root { --water: #CFE0E8; --land: #F4F5F1; --coast: #7F9BA8; --river: #8FB7C9; --label: #24323A; --water-label: #3F6F86; --halo: #FFFFFF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --water: #0D2230; --land: #26333C; --coast: #557584; --river: #2F5A70; --label: #DCE6EA; --water-label: #8DB9CE; --halo: #10171B; } }
:root[data-theme="dark"] { --water: #0D2230; --land: #26333C; --coast: #557584; --river: #2F5A70; --label: #DCE6EA; --water-label: #8DB9CE; --halo: #10171B; }
.map-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; align-items: start; }
.map-box { position: relative; background: var(--water); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
#map-svg .land { fill: var(--land); }
#map-svg .lakes { fill: var(--water); }
#map-svg .coast { fill: none; stroke: var(--coast); stroke-width: 0.6; }
#map-svg .rivers path { fill: none; stroke: var(--river); stroke-linecap: round; stroke-linejoin: round; }
#map-svg .rivers .r1 { stroke-width: 1.4; } #map-svg .rivers .r2 { stroke-width: 1; } #map-svg .rivers .r3 { stroke-width: 0.7; }
#map-svg[data-z="0"] .rivers .r2, #map-svg[data-z="0"] .rivers .r3, #map-svg[data-z="1"] .rivers .r3 { display: none; }
#map-svg .lakes, #map-svg .coast, #map-svg .rivers path, #map-svg #map-labels { pointer-events: none; }
#map-svg .lakes, #map-svg .coast, #map-svg .rivers path { vector-effect: non-scaling-stroke; }
#map-svg text { paint-order: stroke; stroke: var(--halo); stroke-linejoin: round; fill: var(--label); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#map-svg text.water { fill: var(--water-label); font-style: italic; }
#map-svg text.region { fill: var(--ink-2); letter-spacing: 0.08em; text-transform: uppercase; }
#map-svg circle.town { fill: var(--label); stroke: var(--halo); }
.map-credit { font-size: 0.75rem; }
#map-svg { display: block; width: 100%; height: auto; max-height: min(70vh, 620px); touch-action: none; cursor: grab; user-select: none; }
#map-svg.dragging { cursor: grabbing; }
#map-g path { stroke: var(--surface); stroke-width: 0.7; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
#map-g path.nodata { fill: var(--wash); }
#map-g path.hover { stroke: var(--ink-2); stroke-width: 1.5; }
#map-g path.sel { stroke: var(--ink); stroke-width: 2.5; }
.map-zoom { position: absolute; top: 10px; left: 10px; display: grid; gap: 4px; }
.map-zoom button { width: 34px; height: 34px; min-height: 0; padding: 0; justify-content: center; font-size: 1.1rem; line-height: 1; }
.map-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.map-side { display: grid; gap: 12px; min-width: 0; }
.legend { display: grid; gap: 4px; font-size: 0.85rem; }
.legend .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 6px; vertical-align: -2px; border: 1px solid var(--line); }
.legend .row { display: flex; justify-content: space-between; gap: 8px; }
.legend .row span:last-child { font-variant-numeric: tabular-nums; color: var(--ink-2); }
.info { border-top: 1px solid var(--line); padding-top: 10px; min-height: 120px; }
.info h3 { margin-bottom: 2px; }
.info .bar-row { grid-template-columns: minmax(70px, 110px) 1fr 44px; gap: 6px; font-size: 0.85rem; }
@media (max-width: 860px) { .map-wrap { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .caret { transition: none; } }
@media (max-width: 560px) {
  .bar-row { grid-template-columns: 90px 1fr 52px; }
  .opt { grid-template-columns: 1fr 70px 46px; }
  details.q > summary { grid-template-columns: 1.2em minmax(0, 1fr); }
  .q-sum { grid-column: 2; text-align: left; white-space: normal; }
}
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>Vote Helper responses</h1>
      <p class="muted small" id="stamp">Loading...</p>
    </div>
    <div class="controls">
      <label class="small">Period
        <select id="f-period">
          <option value="all">All time</option>
          <option value="7">Last 7 days</option>
          <option value="1">Last 24 hours</option>
        </select>
      </label>
      <label class="small">People
        <select id="f-who">
          <option value="all">Everyone</option>
          <option value="adults">Reading levels 3-5</option>
          <option value="kids">Reading levels 1-2</option>
        </select>
      </label>
      <label class="small">Region
        <select id="f-region"><option value="all">All regions</option></select>
      </label>
      <label class="small">Riding
        <select id="f-riding"><option value="all">All ridings</option></select>
      </label>
      <label class="small">Location
        <select id="f-where">
          <option value="all">All of Canada</option>
          <option value="BC">BC only</option>
        </select>
      </label>
      <button type="button" id="refresh">Refresh</button>
      <a class="btn" href="/api/admin/export.csv">Download CSV</a>
    </div>
  </div>

  <div id="out"></div>
</main>

<script type="application/json" id="spec">/*__SPEC__*/</script>
<script>
(function () {
  "use strict";
  var SPEC = JSON.parse(document.getElementById("spec").textContent);
  var WEIGHTS = { low: 0.5, medium: 1, high: 2 };
  var PARTIES = SPEC.parties, PIDS = PARTIES.map(function (p) { return p.id; });
  var PBY = {}; PARTIES.forEach(function (p) { PBY[p.id] = p; });
  var ISSUE = {}; SPEC.issues.forEach(function (i) { ISSUE[i.id] = i; });
  var REGIONS = SPEC.regions || [], REGBY = {}; REGIONS.forEach(function (r) { REGBY[r.id] = r; });
  var RIDINGS = SPEC.ridings || [], RIDBY = {}; RIDINGS.forEach(function (r) { RIDBY[r.code] = r; });
  /* Which region owns each local question */
  var QREG = {}; REGIONS.forEach(function (r) { (r.local_qids || []).forEach(function (q) { QREG[q] = r.id; }); });
  var NOT_GIVEN = "none";
  /* Page language recorded with each session (NULL before languages were added) */
  var LANG_NAMES = { en: "English", pa: "Punjabi", "zh-Hans": "Chinese (Simplified)", "zh-Hant": "Chinese (Traditional)", tl: "Tagalog", fr: "French", ru: "Russian", ko: "Korean", fa: "Persian (Farsi)" };
  function langLabel(c) { return c ? LANG_NAMES[c] || c : "Not given"; }
  var DATA = null;

  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pct(n, d) { return d ? (100 * n) / d : 0; }
  function fmt(v) { return (Math.round(v * 10) / 10).toFixed(v >= 10 || v === 0 ? 0 : 1) + "%"; }
  function issueLabel(q) { var l = ISSUE[q.issue_id] && ISSUE[q.issue_id].label; return l ? (l["3"] || l[Object.keys(l)[0]]) : q.id; }

  /*
   * Same rule as the quiz: alignment = sum(w*s) / sum(w*4), skips and no-position cells left out.
   * With a riding, only the provincial questions and that region's local questions count (as on the
   * page). Without one (V1 rows, or "parties only"), every stored answer counts, which matches V1.
   */
  function inSet(q, riding) {
    if (!riding || !RIDBY[riding]) return true;
    return q.scope === "provincial" || QREG[q.id] === RIDBY[riding].region;
  }
  function score(answers, local, riding) {
    var t = {}; PIDS.forEach(function (p) { t[p] = { num: 0, den: 0 }; });
    SPEC.questions.forEach(function (q) {
      if (!inSet(q, riding)) return;
      var a = answers && answers[q.id];
      if (!a || !a.c || a.c === "skip") return;
      var opt = q.options.filter(function (o) { return o.id === a.c; })[0];
      if (!opt) return;
      var w = (WEIGHTS[a.w] || 1) * (local && q.scope === "local" ? 2 : 1);
      PIDS.forEach(function (p) {
        if ((q.no_pos || []).indexOf(p) >= 0) return;
        t[p].num += w * Number(opt.scores[p]); t[p].den += w * 4;
      });
    });
    var out = {}; PIDS.forEach(function (p) { out[p] = t[p].den ? (100 * t[p].num) / t[p].den : null; });
    return out;
  }
  function tops(map) {
    var best = -1, ids = [];
    PIDS.forEach(function (p) {
      if (map[p] == null) return;
      var v = Math.round(map[p]);
      if (v > best) { best = v; ids = [p]; } else if (v === best) ids.push(p);
    });
    return ids;
  }

  function load() {
    el("stamp").textContent = "Loading...";
    fetch("/api/admin/data", { credentials: "same-origin", cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (d) {
      var subBy = {}; d.submissions.forEach(function (s) { subBy[s.sid] = s; });
      d.people.forEach(function (p) {
        p.sub = subBy[p.sid] || {};
        p.riding = p.sub.riding && RIDBY[p.sub.riding] ? p.sub.riding : null;
        p.region = p.riding ? RIDBY[p.riding].region : null;
        p.prov = score(p.answers, false, p.riding);
        p.local = score(p.answers, true, p.riding);
        p.top = tops(p.prov);
        p.topLocal = tops(p.local);
      });
      DATA = d;
      render();
    }).catch(function (e) {
      el("stamp").textContent = "Could not load data (" + e.message + "). Your Access session may have expired: reload the page.";
    });
  }

  /* Period, people and location filters only. The map uses this set, so Region and Riding zoom it instead of emptying it. */
  function baseFiltered() {
    var period = el("f-period").value, who = el("f-who").value, where = el("f-where").value;
    var cutoff = period === "all" ? 0 : Date.parse(DATA.generated_at) - Number(period) * 86400000;
    return DATA.people.filter(function (p) {
      if (cutoff && Date.parse(p.sub.created_at) < cutoff) return false;
      if (who === "adults" && p.level < 3) return false;
      if (who === "kids" && p.level > 2) return false;
      if (where === "BC" && p.sub.region_code !== "BC") return false;
      return true;
    });
  }
  function filtered() {
    var region = el("f-region").value, riding = el("f-riding").value;
    var people = baseFiltered().filter(function (p) {
      if (region === NOT_GIVEN && p.region) return false;
      if (region !== "all" && region !== NOT_GIVEN && p.region !== region) return false;
      if (riding === NOT_GIVEN && p.riding) return false;
      if (riding !== "all" && riding !== NOT_GIVEN && p.riding !== riding) return false;
      return true;
    });
    var sids = {}; people.forEach(function (p) { sids[p.sid] = true; });
    var subs = DATA.submissions.filter(function (s) { return sids[s.sid]; });
    return { people: people, subs: subs, region: region, riding: riding };
  }
  function ridingOptions() {
    var html = '<option value="all">All ridings</option><option value="' + NOT_GIVEN + '">Not given</option>';
    REGIONS.forEach(function (reg) {
      var list = RIDINGS.filter(function (r) { return r.region === reg.id; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
      if (!list.length) return;
      html += '<optgroup label="' + esc(reg.name) + '">' + list.map(function (r) { return '<option value="' + esc(r.code) + '">' + esc(r.name) + "</option>"; }).join("") + "</optgroup>";
    });
    return html;
  }
  function regionOptions() {
    return '<option value="all">All regions</option><option value="' + NOT_GIVEN + '">Not given</option>' +
      REGIONS.map(function (r) { return '<option value="' + esc(r.id) + '">' + esc(r.name) + "</option>"; }).join("");
  }
  function ridingLabel(code) { return code && RIDBY[code] ? RIDBY[code].name : "Not given"; }

  function barRows(rows, total) {
    var max = Math.max.apply(null, rows.map(function (r) { return r.v; }).concat([1e-9]));
    return '<div class="bars">' + rows.map(function (r) {
      return '<div class="bar-row"><span class="lbl">' + (r.color ? '<span class="dot" style="background:' + r.color + '"></span>' : "") + esc(r.label) + '</span>' +
        '<div class="track"><div class="fill" style="width:' + (100 * r.v / max).toFixed(1) + "%" + (r.color ? ";background:" + r.color : "") + '"></div></div>' +
        '<span class="val">' + (r.text != null ? esc(r.text) : fmt(pct(r.v, total))) + "</span></div>";
    }).join("") + "</div>";
  }

  function render() {
    /* the toggle event arrives a task after a click, so read open/closed straight from the page first */
    Array.prototype.forEach.call(document.querySelectorAll("#out details[data-key]"), function (d) { OPEN[d.getAttribute("data-key")] = d.open; });
    var f = filtered(), P = f.people, n = P.length;
    el("stamp").textContent = "Updated " + new Date(DATA.generated_at).toLocaleString("en-CA", { dateStyle: "medium", timeStyle: "short" }) +
      "; scores use the current quiz data (" + SPEC.meta.data_as_of + "). " + DATA.people.length + " people stored in total.";
    if (!n) { el("out").innerHTML = '<div class="card empty muted">No responses match these filters yet.</div>'; return; }

    var families = f.subs.filter(function (s) { return s.count > 1; }).length;
    var dayAgo = Date.parse(DATA.generated_at) - 86400000;
    var last24 = P.filter(function (p) { return Date.parse(p.sub.created_at) >= dayAgo; }).length;
    var answeredAvg = P.reduce(function (a, p) { return a + p.answered; }, 0) / n;

    /* best match shares (ties split) */
    var share = {}, avg = {}, avgN = {}, shareLocal = {};
    PIDS.forEach(function (p) { share[p] = 0; avg[p] = 0; avgN[p] = 0; shareLocal[p] = 0; });
    P.forEach(function (p) {
      p.top.forEach(function (id) { share[id] += 1 / p.top.length; });
      p.topLocal.forEach(function (id) { shareLocal[id] += 1 / p.topLocal.length; });
      PIDS.forEach(function (id) { if (p.prov[id] != null) { avg[id] += p.prov[id]; avgN[id] += 1; } });
    });
    var byShare = PIDS.slice().sort(function (a, b) { return share[b] - share[a]; });
    var html = "";
    html += '<div class="kpis">' +
      kpi(n, "people") + kpi(f.subs.length, "sessions") + kpi(families, "family sessions (2-4 people)") +
      kpi(last24, "people in the last 24 hours") + kpi(answeredAvg.toFixed(1), "questions answered, average") +
      kpi(f.subs.filter(function (s) { return s.riding && RIDBY[s.riding]; }).length, "sessions with a riding") + "</div>";

    html += '<div class="grid">';
    html += '<div class="card"><h2>Best match</h2><p class="muted small">Share of people whose top match is each party. Ties are split.</p>' +
      barRows(byShare.map(function (id) { return { label: PBY[id].short_name || PBY[id].name, v: share[id], color: PBY[id].color }; }), n) + "</div>";
    html += '<div class="card"><h2>Average match</h2><p class="muted small">Mean alignment score per party, 0 to 100.</p>' +
      barRows(PIDS.slice().sort(function (a, b) { return avg[b] / (avgN[b] || 1) - avg[a] / (avgN[a] || 1); }).map(function (id) {
        var v = avgN[id] ? avg[id] / avgN[id] : 0;
        return { label: PBY[id].short_name || PBY[id].name, v: v, color: PBY[id].color, text: Math.round(v) + "" };
      }), 100) + "</div>";
    html += candidatePanel(f, shareLocal, n);
    html += "</div><div style=\"height:16px\"></div>";
    html += mapSection();
    html += byRidingTable(P, f);

    /* per day */
    var days = {}; P.forEach(function (p) { var d = (p.sub.created_at || "").slice(0, 10); days[d] = (days[d] || 0) + 1; });
    var keys = Object.keys(days).sort();
    if (keys.length) {
      var list = [], d0 = new Date(keys[0] + "T00:00:00Z"), d1 = new Date(keys[keys.length - 1] + "T00:00:00Z");
      for (var d = d0; d <= d1; d = new Date(d.getTime() + 86400000)) { var k = d.toISOString().slice(0, 10); list.push({ k: k, v: days[k] || 0 }); }
      var mx = Math.max.apply(null, list.map(function (x) { return x.v; }));

    var cx = v.x + v.w / 2, cy = v.y + v.h / 2;
    cx = Math.max(f.x, Math.min(f.x + f.w, cx)); cy = Math.max(f.y, Math.min(f.y + f.h, cy));
    MAP.vb = { x: cx - w / 2, y: cy - h / 2, w: w, h: h };
    MAP.svg.setAttribute("viewBox", [MAP.vb.x, MAP.vb.y, MAP.vb.w, MAP.vb.h].map(function (n) { return n.toFixed(3); }).join(" "));
    /* tie stripes keep the same on-screen width at every zoom */
    Array.prototype.forEach.call(MAP.svg.querySelectorAll("pattern"), function (pt) {
      var s = w / 110; pt.setAttribute("width", s); pt.setAttribute("height", s);
      Array.prototype.forEach.call(pt.querySelectorAll("rect"), function (r, i) { r.setAttribute("x", (i * s) / 2); r.setAttribute("width", s / 2); r.setAttribute("height", s); });
    });
    scheduleLabels();
  }
  function zoomAt(cx, cy, factor) {
    var v = MAP.vb, w = v.w / factor, h = v.h / factor;
    setVB({ x: cx - (cx - v.x) / factor, y: cy - (cy - v.y) / factor, w: w, h: h });
  }
  function zoomTo(b, pad) {
    var f = MAP.full, w = Math.max(b[2] - b[0], 1), h = Math.max(b[3] - b[1], 1);
    pad = pad == null ? 0.15 : pad;
    w *= 1 + 2 * pad; h *= 1 + 2 * pad;
    if (h / w > f.h / f.w) w = h * (f.w / f.h);
    var to = { x: (b[0] + b[2]) / 2 - w / 2, y: (b[1] + b[3]) / 2 - w * (f.h / f.w) / 2, w: w, h: w * (f.h / f.w) };
    var from = MAP.vb, t0 = performance.now(), dur = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 320, id = ++MAP.anim;
    (function step(now) {
      if (id !== MAP.anim) return;
      var k = dur ? Math.min(1, (now - t0) / dur) : 1, e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      setVB({ x: from.x + (to.x - from.x) * e, y: from.y + (to.y - from.y) * e, w: from.w + (to.w - from.w) * e, h: from.h + (to.h - from.h) * e });
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }
  function unionBox(codes) {
    var b = [Infinity, Infinity, -Infinity, -Infinity];
    codes.forEach(function (c) { var x = MAP.boxes[c]; if (!x) return; b = [Math.min(b[0], x[0]), Math.min(b[1], x[1]), Math.max(b[2], x[2]), Math.max(b[3], x[3])]; });
    return b[0] === Infinity ? null : b;
  }
  /* Frame a region on its typical ridings: a few huge rural ones (Sea to Sky in Metro) would otherwise shrink the city ones to dots */
  function regionBox(rid) {
    var codes = RIDINGS.filter(function (r) { return r.region === rid && MAP.boxes[r.code]; }).map(function (r) { return r.code; });
    var area = function (c) { var b = MAP.boxes[c]; return (b[2] - b[0]) * (b[3] - b[1]); };
    var sorted = codes.map(area).sort(function (a, b) { return a - b; }), med = sorted[Math.floor(sorted.length / 2)] || 0;
    var core = codes.filter(function (c) { return area(c) <= 4 * med; });
    return unionBox(core.length ? core : codes);
  }
  function svgPoint(cx, cy) {
    var pt = MAP.svg.createSVGPoint(); pt.x = cx; pt.y = cy;
    return pt.matrixTransform(MAP.svg.getScreenCTM().inverse());
  }
  function wireMap() {
    var svg = MAP.svg, ptrs = {}, drag = null, pinch = null;
    svg.addEventListener("wheel", function (e) {
      e.preventDefault(); MAP.anim++;
      var dy = e.deltaY * (e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? 400 : 1), p = svgPoint(e.clientX, e.clientY);
      zoomAt(p.x, p.y, Math.exp(-dy * 0.0018));
    }, { passive: false });
    svg.addEventListener("pointerdown", function (e) {
      svg.setPointerCapture(e.pointerId); MAP.anim++;
      ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(ptrs);
      if (ids.length === 1) drag = { x: e.clientX, y: e.clientY, vb: MAP.vb, moved: false, target: e.target };
      else if (ids.length === 2) {
        var a = ptrs[ids[0]], b = ptrs[ids[1]];
        pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; if (drag) drag.moved = true;
      }
    });
    svg.addEventListener("pointermove", function (e) {
      if (!ptrs[e.pointerId]) { hoverAt(e.target); return; }
      ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(ptrs);
      if (ids.length >= 2 && pinch) {
        var a = ptrs[ids[0]], b = ptrs[ids[1]], d = Math.hypot(a.x - b.x, a.y - b.y);
        var m = svgPoint((a.x + b.x) / 2, (a.y + b.y) / 2);
        if (pinch.d > 0) zoomAt(m.x, m.y, d / pinch.d);
        pinch.d = d;
      } else if (drag) {
        var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        if (!drag.moved && Math.hypot(dx, dy) < 4) return;
        drag.moved = true; svg.classList.add("dragging");
        var s = svg.getScreenCTM().a;
        setVB({ x: drag.vb.x - dx / s, y: drag.vb.y - dy / s, w: drag.vb.w, h: drag.vb.h });
      }
    });
    function end(e) {
      if (!ptrs[e.pointerId]) return;
      delete ptrs[e.pointerId];
      var left = Object.keys(ptrs).length;
      if (left < 2) pinch = null;
      if (!left) {
        if (drag && !drag.moved && e.type === "pointerup") {
          var c = drag.target && drag.target.getAttribute && drag.target.getAttribute("data-c");
          selectRiding(c && c !== MAP.sel ? c : null);
        }
        drag = null; svg.classList.remove("dragging");
      }
    }
    svg.addEventListener("pointerup", end);
    svg.addEventListener("pointercancel", end);
    svg.addEventListener("pointerleave", function () { if (!drag) hoverAt(null); });
    svg.addEventListener("dblclick", function (e) { e.preventDefault(); var p = svgPoint(e.clientX, e.clientY); zoomAt(p.x, p.y, 2); });
    MAP.box.querySelector(".map-zoom").addEventListener("click", function (e) {
      var z = e.target.getAttribute && e.target.getAttribute("data-z");
      if (!z) return;
      var v = MAP.vb;
      if (z === "fit") { var zt = el("map-zoomto"); if (zt) zt.value = "all"; zoomTo([MAP.full.x, MAP.full.y, MAP.full.x + MAP.full.w, MAP.full.y + MAP.full.h], 0); return; }
      MAP.anim++; zoomAt(v.x + v.w / 2, v.y + v.h / 2, z === "in" ? 1.6 : 1 / 1.6);
    });
  }
  function hoverAt(t) {
    var c = t && t.getAttribute ? t.getAttribute("data-c") : null;
    if (c === MAP.hover) return;
    if (MAP.hover && MAP.paths[MAP.hover]) MAP.paths[MAP.hover].classList.remove("hover");
    MAP.hover = c;
    if (c) MAP.paths[c].classList.add("hover");
    showInfo(c || MAP.sel);
  }
  function selectRiding(c) {
    if (MAP.sel && MAP.paths[MAP.sel]) MAP.paths[MAP.sel].classList.remove("sel");
    MAP.sel = c && MAP.paths[c] ? c : null;
    if (MAP.sel) MAP.g.appendChild(MAP.paths[MAP.sel]).classList.add("sel"); /* draw on top so the outline is whole */
    showInfo(MAP.sel);
  }
  function tieFill(ids) {
    var id = "tie-" + ids.join("-"), defs = MAP.svg.querySelector("#map-defs");
    if (!defs.querySelector("#" + id)) {
      var NS = "http://www.w3.org/2000/svg", pt = document.createElementNS(NS, "pattern");
      pt.setAttribute("id", id); pt.setAttribute("patternUnits", "userSpaceOnUse"); pt.setAttribute("patternTransform", "rotate(45)");
      ids.slice(0, 2).forEach(function (pid) { var r = document.createElementNS(NS, "rect"); r.setAttribute("y", "0"); r.setAttribute("fill", PBY[pid].color); pt.appendChild(r); });
      defs.appendChild(pt);
      setVB(MAP.vb);
    }
    return "url(#" + id + ")";
  }
  function colorMap(people) {
    var st = MAP.stats = mapStats(people), lead = {}, ties = 0, low = 0, none = 0;
    Object.keys(MAP.paths).forEach(function (code) {
      var p = MAP.paths[code], s = st[code];
      if (!s || !s.lead.length) { p.setAttribute("class", "nodata" + (code === MAP.sel ? " sel" : "")); p.removeAttribute("fill"); p.removeAttribute("fill-opacity"); none++; return; }
      p.setAttribute("class", code === MAP.sel ? "sel" : "");
      if (s.lead.length === 1) { p.setAttribute("fill", PBY[s.lead[0]].color); lead[s.lead[0]] = (lead[s.lead[0]] || 0) + 1; }
      else { p.setAttribute("fill", tieFill(s.lead)); ties++; }
      p.setAttribute("fill-opacity", s.n < MAP_MIN ? "0.55" : "1");
      if (s.n < MAP_MIN) low++;
    });
    var rows = PIDS.slice().sort(function (a, b) { return (lead[b] || 0) - (lead[a] || 0); }).map(function (id) {
      return '<div class="row"><span><span class="sw" style="background:' + esc(PBY[id].color) + '"></span>' + esc(PBY[id].short_name || PBY[id].name) + "</span><span>" + (lead[id] || 0) + "</span></div>";
    });
    rows.push('<div class="row"><span><span class="sw" style="background:repeating-linear-gradient(45deg,' + esc(PBY[PIDS[0]].color) + " 0 4px," + esc(PBY[PIDS[1]].color) + ' 4px 8px)"></span>Tie (stripes)</span><span>' + ties + "</span></div>");
    rows.push('<div class="row"><span><span class="sw" style="background:var(--wash)"></span>No responses yet</span><span>' + none + "</span></div>");
    el("map-legend").innerHTML = '<div class="small muted">Ridings led</div>' + rows.join("") +
      '<div class="small muted">Faded: fewer than ' + MAP_MIN + " people (" + low + " ridings).</div>";
    showInfo(MAP.hover || MAP.sel);
  }
  function showInfo(code) {
    var box = el("map-info");
    if (!box) return;
    if (!code || !RIDBY[code]) { box.innerHTML = '<p class="small muted">Point at or tap a riding to see its numbers.</p>'; return; }
    var r = RIDBY[code], s = MAP.stats[code], reg = REGBY[r.region];
    var head = "<h3>" + esc(r.name) + '</h3><p class="small muted">' + esc(reg ? reg.name : "") + "</p>";
    var btn = el("f-riding").value === code ? "" : '<button type="button" class="linkish" id="map-filter">Filter the dashboard to this riding</button>';
    if (!s) { box.innerHTML = head + '<p class="small">No responses yet.</p>' + btn; }
    else {
      box.innerHTML = head + '<p class="small">' + s.n + " " + (s.n === 1 ? "person" : "people") + " in " + Object.keys(s.sids).length + " " + (Object.keys(s.sids).length === 1 ? "session" : "sessions") +
        (s.n < MAP_MIN ? ". Too few to read much into." : ".") + "</p>" +
        barRows(PIDS.slice().sort(function (a, b) { return (s.share[b] || 0) - (s.share[a] || 0); }).map(function (id) {
          return { label: PBY[id].short_name || PBY[id].name, v: s.share[id] || 0, color: PBY[id].color };
        }), s.n) + btn;
    }
    var b = el("map-filter");
    if (b) b.addEventListener("click", function () { el("f-riding").value = code; el("f-region").value = r.region; render(); });
  }
  function mountMap(people, f) {
    var slot = el("map-slot");
    if (!slot) return;
    function place() {
      slot.innerHTML = ""; slot.appendChild(MAP.box);
      colorMap(people);
      scheduleLabels();
      el("map-credit").textContent = "Riding boundaries: Elections BC via Represent (Open North). " + (MAP.credit ? MAP.credit + "." : "");
      var zt = el("map-zoomto");
      zt.addEventListener("change", function () {
        var b = zt.value === "all" ? [MAP.full.x, MAP.full.y, MAP.full.x + MAP.full.w, MAP.full.y + MAP.full.h] : regionBox(zt.value);
        if (b) zoomTo(b, zt.value === "all" ? 0 : 0.08);
      });
      /* Follow the Region and Riding filters, but only when they change, so a filter on Period keeps your zoom */
      var focus = f.riding !== "all" && f.riding !== NOT_GIVEN && RIDBY[f.riding] ? "r:" + f.riding : f.region !== "all" && f.region !== NOT_GIVEN ? "g:" + f.region : "";
      if (focus !== MAP.focus) {
        MAP.focus = focus;
        if (focus.slice(0, 2) === "r:") { selectRiding(f.riding); zt.value = RIDBY[f.riding].region; zoomTo(MAP.boxes[f.riding], 0.6); }
        else if (focus) { selectRiding(null); zt.value = f.region; zoomTo(regionBox(f.region), 0.08); }
        else { selectRiding(null); }
      } else if (MAP.zoomRegion) zt.value = MAP.zoomRegion;
      MAP.zoomRegion = zt.value;
      zt.addEventListener("change", function () { MAP.zoomRegion = zt.value; });
    }
    if (MAP) { place(); return; }
    loadGeo().then(function (res) {
      if (!MAP) buildMap(res[0], res[1]);
      if (el("map-slot") === slot) place();
    }).catch(function (e) {
      slot.innerHTML = '<div class="map-box"><p class="empty muted">Could not load the riding shapes (' + esc(e.message) + ").</p></div>";
    });
  }
  function kpi(v, label) { return '<div class="kpi"><b>' + esc(v) + '</b><span class="small muted">' + esc(label) + "</span></div>"; }

  /* Candidate match for one riding: share of people whose top local party (local questions double) is each candidate's party */
  function candidatePanel(f, shareLocal, n) {
    var r = f.riding !== "all" && f.riding !== NOT_GIVEN ? RIDBY[f.riding] : null;
    if (!r) return '<div class="card"><h2>Candidate match</h2><p class="muted small">Pick one riding in the Riding filter to see its candidate match (party score with that region\'s local questions counted double, same method as the page).</p></div>';
    var reg = REGBY[r.region];
    var nLocal = reg ? (reg.local_qids || []).length : 0;
    var note = nLocal ? "Party score with the " + nLocal + " local questions for " + reg.name + " counted double. Ties are split." : "No local questions for " + (reg ? reg.name : "this region") + " yet, so this is the party score.";
    if (!r.candidates.length) return '<div class="card"><h2>' + esc(r.name) + ' candidate match</h2><p class="muted small">Candidate list not loaded yet.</p></div>';
    return '<div class="card"><h2>' + esc(r.name) + ' candidate match</h2><p class="muted small">' + esc(note) + "</p>" +
      barRows(r.candidates.slice().sort(function (a, b) { return shareLocal[b.party_id] - shareLocal[a.party_id]; }).map(function (c) {
        return { label: c.name, v: shareLocal[c.party_id] || 0, color: PBY[c.party_id] && PBY[c.party_id].color };
      }), n) + "</div>";
  }
  /* One row per riding (and "Not given"): sessions, people and the party most often on top */
  function byRidingTable(P, f) {
    var rows = {};
    P.forEach(function (p) {
      var k = p.riding || NOT_GIVEN;
      var r = rows[k] = rows[k] || { code: k, people: 0, sids: {}, share: {} };
      r.people += 1; r.sids[p.sid] = true;
      p.top.forEach(function (id) { r.share[id] = (r.share[id] || 0) + 1 / p.top.length; });
    });
    var list = Object.keys(rows).map(function (k) { return rows[k]; }).sort(function (a, b) { return b.people - a.people || ridingLabel(a.code).localeCompare(ridingLabel(b.code)); });
    var SHOWN = 12;
    return section("riding", "By riding", list.length + " rows",
      '<p class="muted small">Top party is the party most often first for people in that riding (ties split). Old rows and "parties only" sessions count as Not given.</p>' +
      moreTable("riding", SHOWN, list.length, "<thead><tr><th>Riding</th><th>Region</th><th>Sessions</th><th>People</th><th>Top party</th></tr></thead><tbody>" +
      list.map(function (r, i) {
        var best = PIDS.slice().sort(function (a, b) { return (r.share[b] || 0) - (r.share[a] || 0); })[0];
        var reg = r.code !== NOT_GIVEN && RIDBY[r.code] ? REGBY[RIDBY[r.code].region] : null;
        return "<tr" + (i >= SHOWN ? ' class="more"' : "") + "><td>" + esc(ridingLabel(r.code === NOT_GIVEN ? null : r.code)) + "</td><td>" + esc(reg ? reg.name : "-") + "</td><td>" + Object.keys(r.sids).length + "</td><td>" + r.people + "</td><td>" +
          (r.share[best] ? '<span class="dot" style="background:' + esc(PBY[best].color) + '"></span>' + esc(PBY[best].short_name || PBY[best].name) + " " + fmt(pct(r.share[best], r.people)) : "-") + "</td></tr>";
      }).join("") + "</tbody>", "ridings"));
  }

  var armed = false;
  function delSelected() {
    var sids = Array.prototype.map.call(document.querySelectorAll(".del:checked"), function (c) { return c.value; });
    var msg = el("del-msg"), btn = el("del-btn");
    if (!sids.length) { msg.textContent = "Nothing selected."; return; }
    if (!armed) { armed = true; btn.textContent = "Click again to delete " + sids.length; msg.textContent = ""; return; }
    armed = false; btn.disabled = true;
    fetch("/api/admin/delete", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sids: sids }) })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); load(); })
      .catch(function (e) { msg.textContent = "Delete failed (" + e.message + ")."; btn.disabled = false; btn.textContent = "Delete selected"; });
  }

  el("f-riding").innerHTML = ridingOptions();
  el("f-region").innerHTML = regionOptions();
  /* Picking a riding sets its region; picking a region clears a riding outside it */
  el("f-riding").addEventListener("change", function () {
    var v = el("f-riding").value;
    if (RIDBY[v]) el("f-region").value = RIDBY[v].region;
    else if (v === NOT_GIVEN) el("f-region").value = "all";
  });
  el("f-region").addEventListener("change", function () {
    var v = el("f-riding").value, rg = el("f-region").value;
    if (RIDBY[v] && RIDBY[v].region !== rg) el("f-riding").value = "all";
  });
  ["f-period", "f-who", "f-where", "f-region", "f-riding"].forEach(function (id) { el(id).addEventListener("change", function () { if (DATA) render(); }); });
  el("refresh").addEventListener("click", load);
  load();
})();
</script>
