# Copy to wrangler.toml and fill in the values marked CHANGE_ME.
name = "bc-vote-helper"
main = "src/worker.js"
compatibility_date = "2026-03-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "CHANGE_ME.example.ca", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "bcvote"
database_id = "CHANGE_ME"

# 6 submissions per minute per IP or IPv6 /64 (the address is used only as a counter key, never stored)
[[ratelimits]]
name = "SUBMIT_LIMIT"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

# Riding lookups (postal code or location) per minute per IP; same rule, the IP is only a counter key
[[ratelimits]]
name = "LOOKUP_LIMIT"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# Daily retention check (09:17 UTC); deletes all answers once DELETE_AFTER has passed
[triggers]
crons = ["17 9 * * *"]

[observability]
enabled = true

# Invocation logs record full request URLs, which would include ?pc= postal codes. Keep them off.
[observability.logs]
invocation_logs = false

[vars]
# All stored answers are deleted after this time (Nov 23, 2026, midnight Pacific)
DELETE_AFTER = "2026-11-23T08:00:00Z"
ALLOWED_COUNTRIES = "CA"
# Cloudflare Access protects /admin and /api/admin/*. The Worker also verifies the Access JWT.
ACCESS_TEAM = "CHANGE_ME.cloudflareaccess.com"
ACCESS_AUD = "CHANGE_ME"
ADMIN_EMAIL = "CHANGE_ME@example.com"
