<title>BC Vote Helper 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Atkinson+Hyperlegible+Mono:wght@400..700&amp;family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&amp;display=swap">
<style>
/* Layout: one ballot-sheet column on coastal fog (quiz 760px, results 1080px). Chrome is ink on paper with no party hue; party colours appear only to identify parties in results. */
:root {
  --bg: #ECEFEE;
  --surface: #FFFFFF;
  --surface-2: #F5F7F6;
  --ink: #121A1F;
  --ink-2: #4A5661;
  --line: #C7CFD2;
  --line-strong: #85929A;
  --wash: #DCE4E6;
  --sea: #2B6E7E;
  --ridge-far: #CBD7DB;
  --ridge-mid: #A7B9BF;
  --ridge-near: #7D939B;
  --snow: #F7F9F9;
  --on-ink: #FFFFFF;
  --plate: #FFFFFF;
  --plate-line: #D3D9DB;
  --track: #DFE5E7;
  --pip-off: #D2D9DC;
  --shadow: 0 1px 2px rgba(18, 26, 31, 0.06), 0 8px 24px rgba(18, 26, 31, 0.07);
  --scrim: rgba(18, 26, 31, 0.55);
  --p-liberal: #8D989F;

  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Atkinson Hyperlegible Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

  --t-xs: 0.8125rem;
  --t-s: 0.9375rem;
  --t-m: 1.125rem;
  --t-l: 1.375rem;
  --t-xl: clamp(1.5rem, 1.2rem + 1.4vw, 2.125rem);
  --t-xxl: clamp(2rem, 1.4rem + 2.6vw, 3.25rem);

  --r-s: 10px;
  --r-m: 16px;
  --r-l: 22px;
  --gutter: max(16px, 3.5vw);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1215;
    --surface: #151C20;
    --surface-2: #1A2227;
    --ink: #E8EDEF;
    --ink-2: #A3AFB6;
    --line: #2C373E;
    --line-strong: #5D6C75;
    --wash: #22303A;
    --sea: #6DB7C7;
    --ridge-far: #1C262C;
    --ridge-mid: #253239;
    --ridge-near: #31414A;
    --snow: #C9D3D7;
    --on-ink: #0D1215;
    --plate: #FFFFFF;
    --plate-line: #FFFFFF;
    --track: #26323A;
    --pip-off: #33424B;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    --scrim: rgba(0, 0, 0, 0.6);
    --p-liberal: #9AA6AD;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1215;
  --surface: #151C20;
  --surface-2: #1A2227;
  --ink: #E8EDEF;
  --ink-2: #A3AFB6;
  --line: #2C373E;
  --line-strong: #5D6C75;
  --wash: #22303A;
  --sea: #6DB7C7;
  --ridge-far: #1C262C;
  --ridge-mid: #253239;
  --ridge-near: #31414A;
  --snow: #C9D3D7;
  --on-ink: #0D1215;
  --plate: #FFFFFF;
  --plate-line: #FFFFFF;
  --track: #26323A;
  --pip-off: #33424B;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  --scrim: rgba(0, 0, 0, 0.6);
  --p-liberal: #9AA6AD;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
.share-opt { display: flex; gap: 10px; align-items: flex-start; font-size: var(--t-s); color: var(--ink-2); cursor: pointer; }
.share-opt input { width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: var(--ink); }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--t-m);
  line-height: 1.55;
  margin: 0;
  overflow-x: hidden;
}
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.12; margin: 0; text-wrap: balance; font-weight: 800; }
p { margin: 0; }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.page { padding-inline: var(--gutter); }
.wrap { max-width: 1080px; margin-inline: auto; }
.narrow { max-width: 760px; margin-inline: auto; }

/* Masthead */
.mast { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.mast canvas { position: absolute; inset: auto 0 0 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.mast-in { position: relative; padding-block: 28px 30px; display: grid; gap: 10px; }
.kicker { font-family: var(--f-mono); font-size: var(--t-xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.mast-title { font-size: var(--t-xxl); font-stretch: 118%; font-weight: 900; letter-spacing: -0.01em; }
.mast-title .yr { font-weight: 500; font-stretch: 100%; }
.mast-meta { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; font-size: var(--t-s); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1.5px solid var(--ink); font-weight: 700; font-size: var(--t-s); background: var(--surface); }
.chip-soft { border-color: var(--line); font-weight: 600; }
.reset-chip { cursor: pointer; min-height: 36px; padding: 4px 14px; }
.reset-chip:hover { background: var(--wash); }
.mast.compact .reset-chip { min-height: 36px; padding: 4px 12px; font-size: var(--t-s); }
@media (max-width: 480px) {
  .mast canvas { opacity: 0.6; }
  .mast-meta { gap: 6px; }
  #countdown { flex-basis: 100%; border: 0; background: none; padding: 0; color: var(--ink-2); font-weight: 600; }
}
/* Compact masthead outside setup, so results and questions start near the top */
.mast.compact .mast-in { padding-block: 12px 14px; gap: 6px; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 16px; }
.mast.compact .mast-title { font-size: 1.5rem; }
.mast.compact .kicker, .mast.compact #countdown { display: none; }
.mast.compact .mast-meta { justify-content: flex-end; }
.mast.compact .chip { font-size: var(--t-xs); padding: 2px 9px; }
.mast.compact canvas { opacity: 0.45; }
@media (max-width: 560px) {
  .mast.compact .mast-in { grid-template-columns: 1fr; padding-block: 10px 12px; gap: 4px; }
  .mast.compact .mast-title { font-size: 1.375rem; }
  .mast.compact .mast-meta { justify-content: flex-start; }
  .mast.compact .chip-soft { display: none; }
}

main { padding-block: 28px 56px; }
section + section { margin-top: 0; }
.stack { display: grid; gap: 20px; }
.stack-s { display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: clamp(18px, 3vw, 28px); }
.lede { font-size: var(--t-m); max-width: 62ch; }
.muted { color: var(--ink-2); }
.small { font-size: var(--t-s); }
.xs { font-size: var(--t-xs); }
.nowrap { white-space: nowrap; }
.eyebrow { font-family: var(--f-mono); font-size: var(--t-xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.h2 { font-size: var(--t-xl); font-stretch: 112%; }
.h3 { font-size: var(--t-l); font-stretch: 106%; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 22px; border-radius: 999px; border: 2px solid var(--ink); background: var(--surface); color: var(--ink); font-weight: 700; font-size: var(--t-m); cursor: pointer; text-decoration: none; transition: transform 0.12s ease, background-color 0.15s ease; max-width: 100%; min-width: 0; overflow-wrap: anywhere; text-align: center; }
.btn:hover { background: var(--wash); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--ink); color: var(--on-ink); }
.btn-primary:hover { background: var(--ink); opacity: 0.9; }
.btn-quiet { border-color: transparent; background: transparent; text-decoration: underline; text-underline-offset: 4px; min-height: 44px; padding-inline: 10px; }
.btn-quiet:hover { background: var(--wash); }
.btn-s { min-height: 44px; padding: 8px 16px; font-size: var(--t-s); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.row-between { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }

/* Setup */
.how-line { font-weight: 600; max-width: 62ch; }
.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; border: 0; padding: 0; margin: 0; min-width: 0; }
.seg legend { padding: 0; margin-bottom: 10px; font-weight: 700; font-size: var(--t-m); }
.seg-opt { position: relative; }
.seg-opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg-opt label { display: grid; place-items: center; gap: 0; min-height: 84px; border: 2px solid var(--line-strong); border-radius: var(--r-m); background: var(--surface); cursor: pointer; text-align: center; padding: 8px 4px; transition: background-color 0.15s ease; }
.seg-opt label:hover { background: var(--wash); }
.seg-opt .big { font-family: var(--f-display); font-weight: 900; font-stretch: 120%; font-size: 2rem; line-height: 1; }
.seg-opt .sub { font-size: var(--t-xs); color: var(--ink-2); }
.seg-opt input:checked + label { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.seg-opt input:checked + label .sub { color: var(--on-ink); }
.seg-opt input:focus-visible + label { outline: 3px solid var(--ink); outline-offset: 3px; }

.people { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.person { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.person-head { display: flex; gap: 12px; align-items: center; }
.pnum { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--on-ink); font-family: var(--f-display); font-weight: 900; font-size: 1.15rem; }
.field { display: grid; gap: 6px; min-width: 0; flex: 1; }
.field label { font-weight: 700; font-size: var(--t-s); }
.input { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: var(--r-s); border: 2px solid var(--line-strong); background: var(--surface); font-size: var(--t-m); }
.input:focus-visible { outline-offset: 1px; }

.lvl { display: grid; gap: 8px; }
.lvl-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; align-items: baseline; }
.lvl-top label { font-weight: 700; font-size: var(--t-s); }
.lvl-name { font-family: var(--f-display); font-weight: 800; font-stretch: 108%; font-size: var(--t-l); line-height: 1.1; }
.lvl-ages { font-size: var(--t-s); color: var(--ink-2); }
.range { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; cursor: pointer; margin: 0; }
.range::-webkit-slider-runnable-track { height: 10px; border-radius: 999px; background: linear-gradient(to right, var(--ink) 0 var(--fill, 50%), var(--track) var(--fill, 50%) 100%); }
.range::-moz-range-track { height: 10px; border-radius: 999px; background: var(--track); }
.range::-moz-range-progress { height: 10px; border-radius: 999px; background: var(--ink); }
.range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 32px; height: 32px; border-radius: 50%; background: var(--surface); border: 4px solid var(--ink); margin-top: -11px; box-shadow: var(--shadow); }
.range::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 4px solid var(--ink); }
.range:focus-visible { outline: none; }
.range:focus-visible::-webkit-slider-thumb { outline: 3px solid var(--ink); outline-offset: 3px; }
.range:focus-visible::-moz-range-thumb { outline: 3px solid var(--ink); outline-offset: 3px; }
.ticks { display: flex; justify-content: space-between; padding-inline: 12px; font-family: var(--f-mono); font-size: var(--t-xs); color: var(--ink-2); margin-top: -6px; }
.ticks span { width: 8px; text-align: center; display: flex; justify-content: center; }
.sample { background: var(--surface-2); border: 1px dashed var(--line-strong); border-radius: var(--r-m); padding: 12px 14px; display: grid; gap: 4px; }
.sample-q { font-weight: 700; }
/* Riding picker (setup) */
.riding-box { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; min-width: 0; }
.riding-h { font-weight: 700; font-size: var(--t-m); padding: 0; margin: 0 0 2px; }
.riding-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.riding-row .field { flex: 0 1 220px; min-width: 150px; }
.riding-box > .field { max-width: 460px; }
.riding-go { min-height: 48px; }
.pc { text-transform: uppercase; font-family: var(--f-mono); letter-spacing: 0.06em; }
.pc::placeholder { letter-spacing: 0.06em; }
select.input { cursor: pointer; max-width: 100%; }
.riding-found { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 12px 16px; border: 2px solid var(--ink); border-radius: var(--r-m); background: var(--surface); }
.riding-found > div { min-width: 0; }
.riding-name { font-family: var(--f-display); font-weight: 800; font-stretch: 106%; font-size: var(--t-l); line-height: 1.15; overflow-wrap: anywhere; }
.riding-box .status:empty { display: none; }
.linkbtn { background: none; border: 0; padding: 0; min-height: 32px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.lvl-exp { font-family: var(--f-body); font-weight: 500; font-stretch: 100%; color: var(--ink-2); margin-left: 6px; font-size: var(--t-xs); }

/* Quiz */
.quiz-top { display: grid; gap: 12px; margin-bottom: 18px; }
.wholine { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.wholine > * { min-width: 0; }
.who { font-family: var(--f-display); font-weight: 800; font-stretch: 110%; font-size: var(--t-l); overflow-wrap: anywhere; }
.pcard-name, .res-title, .big-name, .hl-name, .pick-who, .cand-name, .drv-who, .who-strip li, .agree th, .close-tbl thead th { overflow-wrap: anywhere; }
.ticks16 { display: grid; grid-template-columns: repeat(var(--n, 16), minmax(0, 1fr)); gap: 4px; }
.ticks16 span { height: 8px; border-radius: 999px; background: var(--track); }
.ticks16 span.done { background: var(--ink); }
.ticks16 span.skip { background: var(--line-strong); }
.ticks16 span.now { background: var(--sea); outline: 2px solid var(--sea); outline-offset: 1px; }
.qcount { font-family: var(--f-mono); font-size: var(--t-s); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.lvl-inline { display: grid; grid-template-columns: auto minmax(120px, 220px); gap: 4px 12px; align-items: center; justify-content: end; }
.lvl-inline label { font-size: var(--t-s); font-weight: 700; }
.lvl-inline .range { height: 44px; }
.lvl-inline .lvl-now { grid-column: 1 / -1; text-align: right; font-size: var(--t-xs); color: var(--ink-2); }
@media (max-width: 560px) { .lvl-inline { flex: 1 1 100%; justify-content: stretch; grid-template-columns: auto minmax(0, 1fr); } .lvl-inline .lvl-now { text-align: left; } }
details.lvl-fold { min-width: 0; }
details.lvl-fold > summary { list-style: none; cursor: pointer; font-size: var(--t-s); font-weight: 700; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1.5px solid var(--line-strong); border-radius: 999px; background: var(--surface); }
details.lvl-fold > summary::-webkit-details-marker { display: none; }
details.lvl-fold[open] { flex: 1 1 100%; }
details.lvl-fold[open] > summary { margin-bottom: 6px; }
details.lvl-fold .lvl-inline { justify-content: stretch; grid-template-columns: auto minmax(0, 1fr); }
details.lvl-fold .lvl-inline .lvl-now { text-align: left; }

.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: clamp(18px, 3.4vw, 32px); display: grid; gap: 18px; box-shadow: var(--shadow); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-mono); font-size: var(--t-xs); letter-spacing: 0.04em; text-transform: none; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line-strong); color: var(--ink); background: var(--surface); white-space: nowrap; font-weight: 600; }
.tag-solid { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.tag-dash { border-style: dashed; }
.prompt { font-size: var(--t-xl); font-stretch: 104%; font-weight: 800; outline: none; }
.prompt:focus-visible { outline: 3px solid var(--ink); }
.prompt.long { font-size: var(--t-l); font-stretch: 100%; line-height: 1.25; }
.context { color: var(--ink-2); max-width: 70ch; }
details.bg > summary { cursor: pointer; font-weight: 700; color: var(--ink); width: fit-content; list-style: none; display: inline-flex; gap: 8px; align-items: center; min-height: 40px; }
details.bg > summary::-webkit-details-marker { display: none; }
details.bg > summary::before { content: "+"; font-family: var(--f-mono); width: 22px; height: 22px; border: 1.5px solid var(--ink); border-radius: 50%; display: grid; place-items: center; line-height: 1; font-size: 0.95rem; }
details.bg[open] > summary::before { content: "-"; }
details.bg > p { margin-top: 6px; }

.opts { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; min-width: 0; }
.opt { position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: center; padding: 16px 18px; border: 2px solid var(--line); border-radius: var(--r-m); background: var(--surface); cursor: pointer; transition: border-color 0.15s ease, background-color 0.15s ease; min-height: 64px; }
.opt:hover { border-color: var(--line-strong); background: var(--surface-2); }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
/* The mark is a ballot box that fills with a check when chosen */
.opt .mark { width: 40px; height: 40px; border-radius: 9px; border: 2.5px solid var(--ink); display: grid; place-items: center; background: var(--surface); transition: background-color 0.15s ease; }
.opt .mark svg { width: 26px; height: 26px; overflow: visible; }
.opt .mark path { fill: none; stroke: var(--ink); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; }
.opt input:checked ~ .mark { background: var(--ink); border-color: var(--ink); }
.opt input:checked ~ .mark path { stroke: var(--on-ink); }
.opt input:checked ~ .mark path.x1 { stroke-dashoffset: 0; transition: stroke-dashoffset 0.12s ease-out; }
.opt input:checked ~ .mark path.x2 { stroke-dashoffset: 0; transition: stroke-dashoffset 0.16s ease-out 0.1s; }
.opt:has(input:checked) { border-color: var(--ink); background: var(--surface); box-shadow: 0 0 0 2px var(--ink); }
.opt:has(input:checked) .opt-text::after { content: "Your pick"; display: block; margin-top: 6px; font: 700 var(--t-xs)/1 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; }
.opt-skip:has(input:checked) .opt-text::after { content: none; }
.opt:has(input:focus-visible) { outline: 3px solid var(--ink); outline-offset: 3px; }
.opt input:focus-visible ~ .mark { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--ink); }
.opt-text { font-size: var(--t-m); line-height: 1.45; }
@media (max-width: 480px) {
  .opt { grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 14px 14px; }
  .opt .mark { width: 34px; height: 34px; border-radius: 8px; }
  .opt .mark svg { width: 22px; height: 22px; }
  .opt-text { font-size: 1.0625rem; }
}
/* Early readers get bigger answer text */
[data-level="1"] .opt-text, [data-level="2"] .opt-text { font-size: 1.25rem; line-height: 1.4; }
.opt-skip { border-style: dashed; background: var(--surface-2); }
.opt-skip:has(input:checked) { background: var(--surface-2); }
.opt-skip .opt-text { font-weight: 700; }
.opt-skip .mark { border-style: dashed; }

.imp { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; min-width: 0; }
.imp legend { font-weight: 700; padding: 0; margin-bottom: 8px; }
.imp-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.imp-opt { position: relative; }
.imp-opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.imp-opt label { display: grid; place-items: center; gap: 4px; min-height: 60px; border: 2px solid var(--line-strong); border-radius: var(--r-m); cursor: pointer; padding: 8px 6px; text-align: center; font-weight: 700; background: var(--surface); }
.imp-opt label:hover { background: var(--wash); }
.imp-opt .w { display: flex; gap: 3px; }
.imp-opt .w i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: 0.22; display: block; }

        '<label for="mode-' + m[0] + '"><span class="mode-t">' + m[1] + '</span><span class="sub">' + m[2] + "</span></label></div>";
    }).join("") + "</fieldset>" : "";
    var N = QUESTIONS.length;
    var lede = hasCands() ? "Answer " + N + " short questions. See which party and which local candidate match your answers." :
      "Answer " + N + " short questions. See which party matches your answers" + (S.riding ? "." : ". Pick your riding to add local questions and candidates.");
    app.className = "wrap";
    app.innerHTML =
      '<section class="stack" aria-labelledby="setup-title">' +
      '<div class="stack-s"><h2 class="h2" id="setup-title" tabindex="-1">See which party is closest to your views</h2>' +
      '<p class="lede" id="setup-lede">' + esc(lede) + "</p>" +
      '<p class="how-line">Up to 4 people can answer: take turns, or all together on one screen.</p></div>' +
      '<div class="card stack">' +
      ridingPickerHtml() +
      '<fieldset class="seg"><legend>How many people are answering?</legend>' + seg + "</fieldset>" +
      modeSeg +
      '<div class="people">' + persons + "</div>" +
      (COLLECT ? '<label class="share-opt"><input type="checkbox" id="share-chk"' + (S.share ? " checked" : "") + '> <span>Add my answers to the anonymous totals. Names are never sent; only answers, reading level, your riding and rough location (city).</span></label>' : "") +
      '<div class="row"><button type="button" class="btn btn-primary" id="start-btn">' + esc(startLabel()) + "</button>" +
      '<span class="small muted">' + (tog ? "About 10 minutes. Skip anything." : "About 5 minutes each. Skip anything.") + "</span></div>" +
      "</div>" +
      '<p class="small muted">' + esc(pick(SPEC.meta.disclaimer, 3)) + "</p>" +
      "</section>";

    bindRidingPicker();
    app.querySelectorAll('input[name="count"]').forEach(function (r) {
      r.addEventListener("change", function () { S.count = Number(r.value); S.groupLevel = null; save(); renderSetup(); var c = el("count-" + S.count); if (c) c.focus(); });
    });
    app.querySelectorAll('input[name="mode"]').forEach(function (r) {
      r.addEventListener("change", function () { S.mode = r.value === "together" ? "together" : "solo"; save(); renderSetup(); var c = el("mode-" + S.mode); if (c) c.focus(); });
    });
    app.querySelectorAll('input[type="text"][id^="name-"]').forEach(function (inp) {
      inp.addEventListener("input", function () {
        var i = Number(inp.getAttribute("data-i"));
        S.people[i].name = inp.value.slice(0, 24);
        save();
        if (i === 0) el("start-btn").textContent = startLabel();
      });
    });
    app.querySelectorAll('input[type="range"][id^="level-"]').forEach(function (inp) {
      rangeFill(inp);
      inp.addEventListener("input", function () {
        var i = Number(inp.getAttribute("data-i"));
        var lv = Number(inp.value);
        S.people[i].level = lv;
        S.groupLevel = null;
        var L = levelInfo(lv);
        el("lvl-name-" + i).textContent = L.label;
        el("lvl-exp-" + i).textContent = expText(L);
        el("lvl-hint-" + i).textContent = L.hint;
        el("lvl-sample-" + i).textContent = pick(q1.prompt, lv);
        inp.setAttribute("aria-valuetext", levelLong(L));
        rangeFill(inp);
        save();
      });
    });
    var sc = el("share-chk");
    if (sc) sc.addEventListener("change", function () { S.share = sc.checked; save(); });
    el("start-btn").addEventListener("click", function () {
      if (isTogether()) {
        var allDone = S.people.slice(0, S.count).every(function (pp) { return pp.done; });
        S.phase = "together"; S.cur = 0;
        if (S.groupLevel == null) S.groupLevel = groupStartLevel();
        S.qi = allDone ? 0 : firstOpenGroup();
        save(); render("q-title");
        return;
      }
      S.phase = "quiz"; S.cur = 0;
      var p = S.people[0];
      S.qi = p.done ? 0 : firstOpen(p);
      save(); render("q-title");
    });
  }
  /** Local question tag: the region's name ("Surrey", "Metro Vancouver"). */
  function localTag(q) { return q.scope !== "provincial" ? '<span class="tag">' + esc(regionName() || "Local") + "</span>" : ""; }
  function firstOpen(p) {
    for (var k = 0; k < QUESTIONS.length; k++) if (!p.answers[QUESTIONS[k].id]) return k;
    return 0;
  }

  /* ------------------------------------------------------------------ */
  /* Rendering: quiz                                                     */
  /* ------------------------------------------------------------------ */
  var lvlFoldOpen = false;
  function renderQuiz() {
    var p = S.people[S.cur];
    var q = QUESTIONS[S.qi];
    var L = p.level;
    var kid = isKid(L);
    var a = p.answers[q.id] || {};
    var imp = a.importance || "medium";
    var N = QUESTIONS.length;
    var ticks = QUESTIONS.map(function (qq, k) {
      var aa = p.answers[qq.id];
      var cls = k === S.qi ? "now" : aa && aa.choice && aa.choice !== "skip" ? "done" : aa && aa.choice === "skip" ? "skip" : "";
      return '<span class="' + cls + '"></span>';
    }).join("");
    var ctx = pick(q.context, L);
    /* Background starts folded so each screen is just the question and the answers */
    var ctxOpen = false;
    var opts = p.order[q.id].map(function (oid) {
      var o = optionOf(q, oid);
      var id = "opt-" + q.id + "-" + oid;
      return '<label class="opt" for="' + id + '"><input type="radio" name="choice" id="' + id + '" value="' + oid + '"' + (a.choice === oid ? " checked" : "") + ">" +
        '<span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path class="x1" d="M5 12.5 L10 17.5"></path><path class="x2" d="M10 17.5 L19 6.5"></path></svg></span>' +
        '<span class="opt-text">' + esc(pick(o.text, L)) + "</span></label>";
    }).join("");
    var skipId = "opt-" + q.id + "-skip";
    opts += '<label class="opt opt-skip" for="' + skipId + '"><input type="radio" name="choice" id="' + skipId + '" value="skip"' + (a.choice === "skip" ? " checked" : "") + ">" +
      '<span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path class="x1" d="M5 12.5 L10 17.5"></path><path class="x2" d="M10 17.5 L19 6.5"></path></svg></span>' +
      '<span class="opt-text">' + (kid ? "I'm not sure" : "I'm not sure / skip") + "</span></label>";
    var il = impLabels(L);
    var impHtml = ["low", "medium", "high"].map(function (k, idx) {
      var id = "imp-" + k;
      var pips = '<span class="w" aria-hidden="true">' + [0, 1, 2].map(function (z) { return "<i" + (z <= idx ? ' class="on"' : "") + "></i>"; }).join("") + "</span>";
      return '<div class="imp-opt"><input type="radio" name="importance" id="' + id + '" value="' + k + '"' + (imp === k ? " checked" : "") + '><label for="' + id + '">' + pips + "<span>" + il[k] + "</span></label></div>";
    }).join("");
    var lvl = levelInfo(L);
    var isLast = S.qi === N - 1;
    var nextPerson = S.cur + 1 < S.count;
    var slider = '<div class="lvl-inline lvl-c"><label for="quiz-level">Reading level</label><input class="range" type="range" id="quiz-level" min="1" max="5" step="1" value="' + L + '" aria-valuetext="' + esc(levelLong(lvl)) + '"><span class="lvl-now" id="quiz-level-now">' + lvlNow(lvl) + "</span></div>";
    /* Early readers get the slider behind a button, so it is not changed by accident */
    if (kid) slider = '<details class="lvl-fold" id="lvl-fold"' + (lvlFoldOpen ? " open" : "") + '><summary>Change reading level</summary>' + slider + "</details>";
    app.className = "qwrap qwrap-solo";
    app.innerHTML =
      '<section class="qscreen solo" aria-labelledby="q-title" data-level="' + L + '">' +
      '<div class="quiz-top qhead">' +
      '<p class="who">' + (S.count > 1 ? esc(nameOf(S, S.cur)) + (kid ? "'s turn" : "'s answers") : "Your answers") + "</p>" +
      '<p class="qcount">Question ' + (S.qi + 1) + " of " + N + "</p>" +
      '<div class="ticks16" style="--n:' + N + '" aria-hidden="true">' + ticks + "</div>" +
      slider +
      "</div>" +
      '<div class="qcard">' +
      '<p class="eyebrow"><span>' + esc(issueLabel(q, L)) + "</span>" + localTag(q) + "</p>" +
      '<h2 class="prompt' + (longPrompt(pick(q.prompt, L)) ? " long" : "") + '" id="q-title" tabindex="-1">' + esc(pick(q.prompt, L)) + "</h2>" +
      (ctx ? '<details class="bg"' + (ctxOpen ? " open" : "") + '><summary>Background</summary><p class="context">' + esc(ctx) + "</p></details>" : "") +
      '<fieldset class="opts"><legend class="sr">' + (kid ? "Pick the answer you like best" : "Choose the answer closest to your view") + "</legend>" + opts + "</fieldset>" +
      "</div>" +
      '<fieldset class="imp"><legend class="sr">' + (kid ? "How much do you care about this?" : "How much does this issue matter to you?") + '</legend><span class="imp-l" aria-hidden="true">' + (kid ? "How much do you care?" : "How much does this matter to you?") + '</span><div class="imp-row">' + impHtml + "</div></fieldset>" +
      '<div class="quiz-nav"><button type="button" class="btn" id="back-btn">Back</button>' +
      '<button type="button" class="btn btn-primary" id="next-btn"></button></div>' +
      "</section>";

    function nextLabel() {
      var cur = p.answers[q.id];
      var chosen = cur && cur.choice;
      if (isLast) return nextPerson ? "Done, pass it on" : "See results";
      return chosen ? "Next" : "Skip";
    }
    var nb = el("next-btn");
    nb.textContent = nextLabel();
    app.querySelectorAll('input[name="choice"]').forEach(function (r) {
      r.addEventListener("change", function () { setAnswer(p, q, { choice: r.value }); save(); nb.textContent = nextLabel(); });
    });
    app.querySelectorAll('input[name="importance"]').forEach(function (r) {
      r.addEventListener("change", function () {
        var cur = p.answers[q.id];
        setAnswer(p, q, { importance: r.value, choice: cur ? cur.choice : null });
        save();
      });
    });
    var ql = el("quiz-level");
    rangeFill(ql);
    var lf = el("lvl-fold");
    if (lf) lf.addEventListener("toggle", function () { lvlFoldOpen = lf.open; });
    ql.addEventListener("change", function () { p.level = Number(ql.value); if (isKid(p.level)) lvlFoldOpen = true; save(); render(null); var x = el("quiz-level"); if (x) x.focus(); });
    ql.addEventListener("input", function () { var info = levelInfo(Number(ql.value)); el("quiz-level-now").innerHTML = lvlNow(info); ql.setAttribute("aria-valuetext", levelLong(info)); rangeFill(ql); });
    el("back-btn").addEventListener("click", function () {
      if (S.qi > 0) { S.qi -= 1; save(); render("q-title"); return; }
      if (S.cur === 0) { S.phase = "setup"; save(); render("setup-title"); return; }
      S.phase = "handoff"; save(); render("handoff-title");
    });
    nb.addEventListener("click", function () {
      if (!p.answers[q.id] || !p.answers[q.id].choice) setAnswer(p, q, { choice: "skip" });
      lvlFoldOpen = false;
      if (!isLast) { S.qi += 1; save(); render("q-title"); return; }
      p.done = true;
      if (nextPerson) { S.cur += 1; S.qi = 0; S.phase = "handoff"; save(); render("handoff-title"); return; }
      S.phase = "results"; S.finishedAt = new Date().toISOString(); S.resultsLevel = null; save(); render("res-title");
      submitResponses();
    });
  }

  /* ------------------------------------------------------------------ */
  /* Rendering: together (one question, everyone answers on one screen)  */
  /* ------------------------------------------------------------------ */
  var LETTERS = "ABCDEFGH";
  var tgCtxOpen = false;
  function renderTogether() {
    var q = QUESTIONS[S.qi];
    var N = QUESTIONS.length;
    if (S.groupLevel == null) S.groupLevel = groupStartLevel();
    var L = S.groupLevel;
    var kid = isKid(L);
    var order = groupOrder(q);
    var lvl = levelInfo(L);
    var isLast = S.qi === N - 1;
    var ppl = S.people.slice(0, S.count);
    var ticks = QUESTIONS.map(function (qq, k) {
      var as = ppl.map(function (p) { return p.answers[qq.id]; });
      var cls = k === S.qi ? "now" : as.some(function (a) { return a && a.choice && a.choice !== "skip"; }) ? "done" : as.every(function (a) { return a && a.choice === "skip"; }) ? "skip" : "";
      return '<span class="' + cls + '"></span>';
    }).join("");
    var ctx = pick(q.context, L);
    var opts = order.map(function (oid, k) {
      return '<li class="tg-opt" id="tg-opt-' + oid + '"><span class="tg-letter">' + LETTERS[k] + '</span><div class="tg-body"><p class="tg-who" id="tg-who-' + oid + '"></p><p class="tg-text" id="tg-txt-' + oid + '">' + esc(pick(optionOf(q, oid).text, L)) + "</p></div></li>";
    }).join("");
    function peopleHead(k2) { return k2 ? "Everyone picks a letter, then how much they care." : "Everyone picks a letter, then how much it matters."; }
    var il = impLabels(L);
    var rows = ppl.map(function (p, i) {
      var a = p.answers[q.id] || {};
      var imp = a.importance || "medium";
      var nm = esc(nameOf(S, i));
      var picks = order.map(function (oid, k) {
        var id = "tg-c-" + i + "-" + oid;
        return '<span class="tg-r"><input type="radio" name="tg-c-' + i + '" id="' + id + '" value="' + oid + '" data-i="' + i + '"' + (a.choice === oid ? " checked" : "") + '><label for="' + id + '">' + LETTERS[k] + "</label></span>";
      }).join("") +
        '<span class="tg-r skip"><input type="radio" name="tg-c-' + i + '" id="tg-c-' + i + '-skip" value="skip" data-i="' + i + '"' + (a.choice === "skip" ? " checked" : "") + '><label for="tg-c-' + i + '-skip" class="tg-skip-l">' + (kid ? "Not sure" : "Skip") + "</label></span>";
      var imps = ["low", "medium", "high"].map(function (k, idx) {
        var id = "tg-i-" + i + "-" + k;
        var pips = '<span class="w" aria-hidden="true">' + [0, 1, 2].map(function (z) { return "<i" + (z <= idx ? ' class="on"' : "") + "></i>"; }).join("") + "</span>";
        return '<span class="tg-r"><input type="radio" name="tg-i-' + i + '" id="' + id + '" value="' + k + '" data-i="' + i + '"' + (imp === k ? " checked" : "") + '><label for="' + id + '">' + pips + '<span class="tg-imp-t" data-k="' + k + '">' + il[k] + "</span></label></span>";
      }).join("");
      return '<div class="tg-person">' +
        '<p class="tg-name" id="tg-name-' + i + '"><span class="pnum" aria-hidden="true">' + (i + 1) + '</span><span title="' + nm + '">' + nm + "</span></p>" +
        '<fieldset class="tg-pick"><legend class="sr">' + nm + "'s answer</legend>" + picks + "</fieldset>" +
        '<fieldset class="tg-imp"><legend class="sr">How much it matters to ' + nm + '</legend><span class="tg-imp-l" aria-hidden="true">' + (kid ? "Care" : "Matters") + "</span>" + imps + "</fieldset>" +
        "</div>";
    }).join("");
    app.className = "qwrap qwrap-tg";
    app.innerHTML =
      '<section class="qscreen tg' + (order.length >= 6 ? " tg-many" : "") + '" aria-labelledby="q-title" data-level="' + L + '">' +
      '<div class="quiz-top qhead tg-head">' +
      '<p class="who">Question ' + (S.qi + 1) + " of " + N + "</p>" +
      '<p class="qcount">Together, ' + S.count + " people</p>" +
      '<div class="ticks16" style="--n:' + N + '" aria-hidden="true">' + ticks + "</div>" +
      '<div class="lvl-c tg-lvl"><label for="tg-level">Reading level</label>' +
      '<input class="range" type="range" id="tg-level" min="1" max="5" step="1" value="' + L + '" aria-valuetext="' + esc(levelLong(lvl)) + '">' +
      '<span class="lvl-now" id="tg-level-now">' + lvlNow(lvl) + "</span></div>" +
      "</div>" +
      '<div class="qcard tg-q">' +
      '<p class="eyebrow"><span id="tg-issue">' + esc(issueLabel(q, L)) + "</span>" + localTag(q) + "</p>" +
      '<h2 class="prompt' + (longPrompt(pick(q.prompt, L)) ? " long" : "") + '" id="q-title" tabindex="-1">' + esc(pick(q.prompt, L)) + "</h2>" +
      (ctx ? '<details class="bg" id="tg-bg"' + (tgCtxOpen ? " open" : "") + '><summary>Background</summary><p class="context" id="tg-ctx">' + esc(ctx) + "</p></details>" : "") +
      '<ol class="tg-opts" aria-label="Answers">' + opts + "</ol>" +
      "</div>" +
      '<div class="tg-people"><p class="tg-people-h" id="tg-people-h">' + esc(peopleHead(kid)) + "</p>" + rows + "</div>" +
      '<div class="quiz-nav"><button type="button" class="btn" id="back-btn">Back</button>' +
      '<button type="button" class="btn btn-primary" id="next-btn">' + (isLast ? "See results" : "Next") + "</button></div>" +
      "</section>";

    /* Show who picked each answer, right under it */
    function paintPicks() {
      order.forEach(function (oid) {
        var who = [];
        ppl.forEach(function (p, i) { var a = p.answers[q.id]; if (a && a.choice === oid) who.push(nameOf(S, i)); });
        el("tg-who-" + oid).innerHTML = who.map(function (n) { return '<span class="tg-chip">' + esc(n) + "</span>"; }).join("");
        el("tg-opt-" + oid).classList.toggle("picked", who.length > 0);
      });
    }
    /* Reword the question in place, so the slider keeps focus while it moves */
    function paintText(lv) {
      var k2 = isKid(lv);
      var pr = el("q-title");
      pr.textContent = pick(q.prompt, lv);
      pr.classList.toggle("long", longPrompt(pick(q.prompt, lv)));
      el("tg-issue").textContent = issueLabel(q, lv);
      var c = el("tg-ctx");
      if (c) c.textContent = pick(q.context, lv);
      order.forEach(function (oid) { el("tg-txt-" + oid).textContent = pick(optionOf(q, oid).text, lv); });
      var labs = impLabels(lv);
      app.querySelectorAll(".tg-imp-t").forEach(function (s2) { s2.textContent = labs[s2.getAttribute("data-k")]; });
      app.querySelectorAll(".tg-skip-l").forEach(function (s2) { s2.textContent = k2 ? "Not sure" : "Skip"; });
      app.querySelectorAll(".tg-imp-l").forEach(function (s2) { s2.textContent = k2 ? "Care" : "Matters"; });
      el("tg-people-h").textContent = peopleHead(k2);
      app.querySelector("section.tg").setAttribute("data-level", lv);
    }
    paintPicks();
    var bg = el("tg-bg");
    if (bg) bg.addEventListener("toggle", function () { tgCtxOpen = bg.open; });
    var rg = el("tg-level");
    rangeFill(rg);
    rg.addEventListener("input", function () {
      var lv = Number(rg.value);
      var info = levelInfo(lv);
      S.groupLevel = lv;
      el("tg-level-now").innerHTML = lvlNow(info);
      rg.setAttribute("aria-valuetext", levelLong(info));
      rangeFill(rg);
      paintText(lv);
      save();
    });
    app.querySelectorAll('.tg-pick input[type="radio"]').forEach(function (r) {
      r.addEventListener("change", function () {
        var p = S.people[Number(r.getAttribute("data-i"))];
        setAnswer(p, q, { choice: r.value }, order);
        save(); paintPicks();
      });
    });
    app.querySelectorAll('.tg-imp input[type="radio"]').forEach(function (r) {
      r.addEventListener("change", function () {
        var p = S.people[Number(r.getAttribute("data-i"))];
        var cur = p.answers[q.id];
        setAnswer(p, q, { importance: r.value, choice: cur ? cur.choice : null }, order);
        save();
      });
    });
    el("back-btn").addEventListener("click", function () {
      if (S.qi > 0) { S.qi -= 1; save(); render("q-title"); return; }
      S.phase = "setup"; save(); render("setup-title");
    });
    el("next-btn").addEventListener("click", function () {
      /* Anyone who did not pick counts as a skip, same as one at a time */
      ppl.forEach(function (p) { if (!p.answers[q.id] || !p.answers[q.id].choice) setAnswer(p, q, { choice: "skip" }, order); });
      if (!isLast) { S.qi += 1; save(); render("q-title"); return; }
      ppl.forEach(function (p) { p.done = true; });
      S.phase = "results"; S.finishedAt = new Date().toISOString(); S.resultsLevel = null; save(); render("res-title");
      submitResponses();
    });
  }

  /* ------------------------------------------------------------------ */
  /* Rendering: hand-off                                                 */
  /* ------------------------------------------------------------------ */
  function renderHandoff() {
    var i = S.cur, p = S.people[i], prev = nameOf(S, i - 1), name = nameOf(S, i);
    var L = levelInfo(p.level);
    var prevAnswered = answeredCount(S.people[i - 1]);
    app.className = "narrow";
    app.innerHTML =
      '<section class="card handoff" aria-labelledby="handoff-title">' +
      '<p class="eyebrow">Person ' + (i + 1) + " of " + S.count + "</p>" +
      '<h2 class="handoff-title" id="handoff-title" tabindex="-1"><span class="handoff-pass">Pass the device to</span> <span class="big-name">' + esc(name) + "</span></h2>" +
      '<p class="done-row"><svg viewBox="0 0 26 26" aria-hidden="true"><rect x="1.5" y="1.5" width="23" height="23" rx="6" fill="currentColor"></rect><path d="M7 13.5 L11 17.5 L19 8.5" fill="none" stroke="var(--on-ink)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>' + esc(prev) + ": done, answered " + prevAnswered + " of " + QUESTIONS.length + "</span></p>" +
      '<div class="shield"><svg viewBox="0 0 56 56" aria-hidden="true"><rect x="6" y="10" width="44" height="36" rx="6" fill="none" stroke="currentColor" stroke-width="3"></rect><path d="M6 20 H50" stroke="currentColor" stroke-width="3"></path><path d="M18 33 L38 33" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path></svg>' +
      "<p>" + esc(prev) + "'s answers are saved and hidden. Nobody sees anyone's answers until everyone is done.</p></div>" +
      '<div class="lvl"><div class="lvl-top"><label for="handoff-level">Reading level for ' + esc(name) + '</label></div>' +
      '<p class="lvl-name" id="handoff-level-name">' + esc(L.label) + ' <span class="lvl-ages">' + esc(expText(L)) + "</span></p>" +
      '<input class="range" type="range" id="handoff-level" min="1" max="5" step="1" value="' + p.level + '" aria-valuetext="' + esc(levelLong(L)) + '">' +
      '<div class="ticks" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div></div>' +
      '<div class="row"><button type="button" class="btn btn-primary" id="handoff-go">Start ' + esc(name) + "'s questions</button></div>" +
      "</section>";
    var r = el("handoff-level");
    rangeFill(r);
    r.addEventListener("input", function () {
      p.level = Number(r.value);
      var info = levelInfo(p.level);
      el("handoff-level-name").innerHTML = esc(info.label) + ' <span class="lvl-ages">' + esc(expText(info)) + "</span>";
      r.setAttribute("aria-valuetext", levelLong(info));
      rangeFill(r);
      save();
    });
    el("handoff-go").addEventListener("click", function () { S.phase = "quiz"; S.qi = 0; save(); render("q-title"); });
  }

  /* ------------------------------------------------------------------ */
  /* Rendering: results                                                  */
  /* ------------------------------------------------------------------ */
  /** scoredNote(n, answered, kid): "scored on 13 of your 16 answers" when a party has no published position on some. */
  function scoredNote(n, answered, kid) {
    if (n == null || !answered || n >= answered) return "";
    return kid ? "used " + n + " of your " + answered + " answers" : "scored on " + n + " of your " + answered + " answers";
  }
  function barLabel(id, isCand) {
    var pid = isCand ? CBY[id].party_id : id;
    var p = PBY[pid];
    return isCand ? esc(CBY[id].name) + ' <span class="muted">' + esc(p.short_name) + (CBY[id].incumbent ? ", incumbent" : "") + "</span>" : esc(p.short_name) + ' <span class="muted">' + esc(p.leader) + "</span>";
  }
  function barRow(id, pct, isCand, note) {
    var pid = isCand ? CBY[id].party_id : id;
    var p = PBY[pid];
    var w = pct == null ? 0 : Math.max(0, Math.min(100, pct));
    return '<div class="bar-row' + (pct == null ? " na" : "") + '" style="' + partyVars(pid) + '">' + plate(pid, "s") +
      '<div class="bar-main"><span class="bar-label">' + barLabel(id, isCand) + "</span>" +
      '<div class="bar-track" role="img" aria-label="' + esc((isCand ? CBY[id].name : p.short_name) + ": " + (pct == null ? "no score" : Math.round(pct) + " percent")) + '"><div class="bar-fill" style="width:' + w.toFixed(1) + '%"></div></div>' +
      (note ? '<span class="bar-note">' + esc(note) + "</span>" : "") + "</div>" +
      '<span class="bar-pct">' + (pct == null ? "no score" : fmtPct(pct) + "%") + "</span></div>";
  }
  /** bars(ranked, isCand, member?, kid?): with a member, each row notes when a party was scored on fewer of their answers. */
  function bars(ranked, isCand, m, kid) {
    return '<div class="bars">' + ranked.map(function (r) {
      var pid = isCand ? CBY[r.id].party_id : r.id;
      return barRow(r.id, r.pct, isCand, m ? scoredNote(m.n[pid], m.answered, kid) : "");
    }).join("") + "</div>";
  }
  /** Family list: ordered by the all-members mean, with the adults-only mean beside it as a second labelled column. */
  function famBars(ranked, adultsMap, isCand, adultsCount) {
    var head = '<div class="bars-head" aria-hidden="true"><span></span><span>All</span><span>L3-5</span></div>';
    return '<div class="bars fam">' + head + ranked.map(function (r) {
      var pid = isCand ? CBY[r.id].party_id : r.id;
      var p = PBY[pid];
      var a = adultsMap ? adultsMap[r.id] : null;
      var w = r.pct == null ? 0 : Math.max(0, Math.min(100, r.pct));
      var nm = isCand ? CBY[r.id].name : p.short_name;
      return '<div class="bar-row' + (r.pct == null ? " na" : "") + '" style="' + partyVars(pid) + '">' + plate(pid, "s") +
        '<div class="bar-main"><span class="bar-label">' + barLabel(r.id, isCand) + "</span>" +
        '<div class="bar-track" role="img" aria-label="' + esc(nm + ": all members " + (r.pct == null ? "no score" : Math.round(r.pct) + " percent")) + '"><div class="bar-fill" style="width:' + w.toFixed(1) + '%"></div></div></div>' +
        '<span class="bar-pct"><span class="sr">All members </span>' + (r.pct == null ? "-" : fmtPct(r.pct) + "%") + "</span>" +
        '<span class="bar-pct2"><span class="sr">Reading levels 3 to 5 </span>' + (!adultsCount || a == null ? "-" : fmtPct(a) + "%") + "</span></div>";
    }).join("") + "</div>";
  }

  var PLACES = ["1st", "2nd", "3rd", "4th", "5th"];
  function joinAnd(list) { return list.length <= 2 ? list.join(" and ") : list.slice(0, -1).join(", ") + " and " + list[list.length - 1]; }
  function headlineCard(entry, isCand, group, level, place, next, opts) {
    opts = opts || {};
    var multi = group.length > 1;
    var pid = isCand ? CBY[entry.id].party_id : entry.id;
    var p = PBY[pid];
    var kid = isKid(level);
    var name = isCand ? CBY[entry.id].name : p.name;
    var sub = isCand ? p.short_name + (CBY[entry.id].incumbent ? ", incumbent MLA" : "") : "Leader: " + p.leader;
    var tied = multi && group.filter(function (g) { return Math.round(g.pct) === Math.round(entry.pct); }).length > 1 && Math.round(entry.pct) === Math.round(group[0].pct);
    var eyebrow = tied ? (kid ? "Tied" : "Tied for first") : multi ? PLACES[place] + (kid ? ", almost tied" : " place, close result") : isCand ? (kid ? "Closest on your local ballot" : "Closest local candidate") : (kid ? "Closest to your answers" : "Closest party");
    var nextLine = !multi && next && next.pct != null ? '<p class="hl-next">Next: ' + esc(isCand ? CBY[next.id].name + " (" + PBY[CBY[next.id].party_id].short_name + ")" : PBY[next.id].short_name) + ", " + fmtPct(next.pct) + "%</p>" : "";
    var note = opts.member ? scoredNote(opts.member.n[pid], opts.member.answered, kid) : "";
    var noteLine = note ? '<p class="hl-next">' + esc(note.charAt(0).toUpperCase() + note.slice(1)) + (kid ? "." : ". This party has no published position on the others.") + "</p>" : "";
    return '<article class="hl-card' + (isCand ? " hl-local" : "") + (opts.soft ? " soft" : "") + '" style="' + partyVars(pid) + '">' +
      '<div class="hl-band">' + plate(pid, isCand || multi || opts.soft ? "m" : "") + '<p class="hl-pct">' + fmtPct(entry.pct) + '<small>%</small><span class="hl-unit">match</span></p></div>' +
      '<div class="hl-body"><p class="eyebrow">' + esc(eyebrow) + "</p>" +
      '<h3 class="hl-name">' + esc(name) + "</h3><p class=\"hl-sub\">" + esc(sub) + "</p>" + nextLine + noteLine + "</div></article>";
  }
  function headlineSet(group, isCand, level, who, ranked, opts) {
    var multi = group.length > 1;
    var kid = isKid(level);
    var names = group.map(function (g) { return isCand ? CBY[g.id].name : PBY[g.id].short_name; });
    var banner = multi ? '<div class="close-banner"><span class="tag tag-solid">Close result</span><span>' +
      (kid ? esc(joinAnd(names)) + " are almost tied." : esc(joinAnd(names)) + " are within " + CLOSE_POINTS + " points of each other, so there is no clear single match.") + "</span></div>" : "";
    return '<div class="hl-set"><p class="eyebrow">' + esc(who) + "</p>" + banner + '<div class="hl-cards' + (multi ? " multi" : "") + '">' +
      group.map(function (g, k) { return headlineCard(g, isCand, group, level, k, ranked && ranked[1], opts); }).join("") + "</div></div>";
  }
  /** One line per person: their own closest party (or close group), plus how often the family gave the same answer. */
  function whoStrip(R) {
    var items = R.members.map(function (m) {
      if (!m.answered) return '<li><span class="who-n">' + esc(m.name) + '</span><span class="muted">skipped every question</span></li>';
      return '<li><span class="who-n">' + esc(m.name) + "</span>" + m.close.map(function (c) {
        return plate(c.id, "xs") + "<span>" + esc(PBY[c.id].short_name) + " " + fmtPct(c.pct) + "%</span>";
      }).join('<span class="muted">and</span>') + (m.close.length > 1 ? '<span class="tag">Close</span>' : "") + "</li>";
    }).join("");
    var same = R.agreeCounts.agree;
    items += '<li class="who-agree">Same answer on ' + same + " of " + QUESTIONS.length + " questions</li>";
    return '<ul class="who-strip" aria-label="Each person\'s closest party">' + items + "</ul>";
  }

  function pickText(q, oid, level) {
    if (!oid || oid === "skip") return null;
    var o = optionOf(q, oid);
    return o ? pick(o.text, level) : null;
  }
  function chipFor(q, m, level, isFamily) {
    var a = m.answers[q.id];
    var who = isFamily ? m.name + ": " : "";
    if (!a || !a.choice || a.choice === "skip") return '<span class="pick-chip skip">' + esc(isFamily ? m.name + ": skipped" : "Skipped") + "</span>";
    var al = alignedParties(q, a.choice);
    var dots = '<span class="pick-dots">' + al.map(function (pid) { return '<span class="dot" style="' + partyVars(pid) + '"></span>'; }).join("") + "</span>";
    var names = al.map(function (pid) { return PBY[pid].short_name; }).join(" / ");
    return '<span class="pick-chip" title="' + esc(pickText(q, a.choice, level)) + '">' + dots + esc(who + (isFamily ? "closest to " : "Closest: ") + names) + "</span>";
  }

  function issueDetails(q, R, order, level, openSet) {
    var kid = isKid(level);
    var il = impLabels(level);
    var ms = R.members;
    var picks = ms.map(function (m) {
      var a = m.answers[q.id];
      var txt = a ? pickText(q, a.choice, level) : null;
      return '<div class="pick"><p class="pick-who">' + esc(m.name) + (txt && a.importance !== "medium" ? ' <span class="tag">' + esc(il[a.importance]) + (kid ? "" : " importance") + "</span>" : "") + "</p>" +
        "<p>" + (txt ? esc(txt) : '<span class="muted">' + (kid ? "Not sure" : "Not sure or skipped") + "</span>") + "</p></div>";
    }).join("");
    var head = "<tr><th scope=\"col\">Party</th>" + ms.map(function (m) { return '<th scope="col">' + esc(R.isFamily ? m.name : "Your answer") + "</th>"; }).join("") + "</tr>";
    var rows = order.map(function (pid) {
      var p = PBY[pid];
      var np = noPos(q, pid);
      var cells = ms.map(function (m) {
        if (np) return "";
        var a = m.answers[q.id];
        if (!a || !a.choice || a.choice === "skip") return '<td class="muted xs">skipped</td>';
        var s = Number(optionOf(q, a.choice).scores[pid]);
        var pips = '<span class="pips" role="img" aria-label="' + s + ' of 4">' + [1, 2, 3, 4].map(function (k) { return "<i" + (k <= s ? ' class="on"' : "") + "></i>"; }).join("") + "</span>";
        return "<td>" + pips + '<span class="pips-n">' + s + "/4</span></td>";
      }).join("");
      if (np) cells = '<td colspan="' + ms.length + '"><span class="tag tag-dash">No published position</span> <span class="xs muted">left out of this party\'s score</span></td>';
      return '<tr style="' + partyVars(pid) + '"><th scope="row"><span class="th-party">' + plate(pid, "xs") + '<span class="th-name">' + esc(p.short_name) + "</span></span></th>" + cells + "</tr>";
    }).join("");
    var positions = order.map(function (pid) {
      var p = PBY[pid];
      var pp = q.party_positions[pid] || {};
      var np = pp.no_position === true;
      var tags = "";
      if (np) tags += '<span class="tag tag-dash">No published position</span>';
      if (!np && pp.basis === "inferred") tags += '<span class="tag tag-dash">' + esc(BASIS.inferred) + "</span>";
      if (!np && pp.basis && pp.basis !== "inferred") tags += '<span class="tag">' + esc(BASIS[pp.basis] || pp.basis) + "</span>";
      if (!np && pp.confidence) tags += '<span class="tag">' + esc(CONF[pp.confidence] || pp.confidence) + "</span>";
      var src = (pp.sources || []).map(function (s) { return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.label) + "</a>"; }).join("");
      return '<div class="pos' + (np ? " nopos" : "") + '">' +
        '<div class="pos-head">' + plate(pid, "xs") + '<span class="pos-name">' + esc(p.short_name) + "</span>" + tags + "</div>" +
        "<p>" + esc(pick(pp.text, level)) + "</p>" +
        (src ? '<div class="pos-src"><span class="muted">Sources:</span>' + src + "</div>" : "") + "</div>";
    }).join("");
    var chips = ms.map(function (m) { return chipFor(q, m, level, R.isFamily); }).join("");
    var npList = order.filter(function (pid) { return noPos(q, pid); }).map(function (pid) { return PBY[pid].short_name; });
    var infList = order.filter(function (pid) { var pp = q.party_positions[pid]; return pp && !pp.no_position && pp.basis === "inferred"; }).map(function (pid) { return PBY[pid].short_name; });
    var sumTags = (npList.length ? '<span class="tag tag-dash">No published position: ' + esc(npList.join(", ")) + "</span>" : "") +
      (infList.length ? '<span class="tag tag-dash">Inferred: ' + esc(infList.join(", ")) + "</span>" : "");
    var ag = R.isFamily ? agreement(q, ms.map(function (m) { return m.answers[q.id] || {}; })) : null;
    return '<details class="issue" id="issue-' + q.id + '"' + (openSet[q.id] ? " open" : "") + ">" +
      '<summary><span class="sum-main"><span class="sum-title">' + esc(issueLabel(q, level)) + localTag(q) +
      (ag ? '<span class="agree-label' + (ag.kind === "na" ? " na" : "") + '">' + esc(agreeLabel(ag, level)) + "</span>" : "") + "</span>" +
      '<span class="sum-picks">' + chips + sumTags + "</span></span>" +
      '<span class="sum-toggle" aria-hidden="true"><span class="plus">+</span><span class="minus">-</span></span></summary>' +
      '<div class="issue-body">' +
      '<div class="stack-s"><p class="eyebrow">The question</p><p><strong>' + esc(pick(q.prompt, level)) + "</strong></p></div>" +
      '<div class="stack-s"><p class="eyebrow">' + (R.isFamily ? "What each person chose" : "What you chose") + '</p><div class="picks">' + picks + "</div></div>" +
      '<div class="stack-s"><p class="eyebrow">How close each party is on this issue (0 to 4)</p><div class="close-tbl"><table><thead>' + head + "</thead><tbody>" + rows + "</tbody></table></div></div>" +
      '<div class="stack-s"><p class="eyebrow">What each party says and has done</p><div class="positions">' + positions + "</div></div>" +
      "</div></details>";
  }

  /** Agreement label at the reader's level. Every label is outlined, so no outcome gets more visual weight. */
  function agreeLabel(ag, level) {
    if (!isKid(level)) return ag.label;
    return { agree: "Same answer", close: "Same closest party", mostly: "Most agree", split: "Different picks", na: "Not enough answers" }[ag.kind] || ag.label;
  }
  function agreementTable(R, level) {
    var ms = R.members;
    var kid = isKid(level);
    var head = '<tr><th scope="col">Issue</th>' + ms.map(function (m) { return '<th scope="col">' + esc(m.name) + "</th>"; }).join("") + '<th scope="col">Together</th></tr>';
    var counts = { agree: 0, close: 0, mostly: 0, split: 0, na: 0 };
    var rows = QUESTIONS.map(function (q) {
      var ag = agreement(q, ms.map(function (m) { return m.answers[q.id] || {}; }));
      counts[ag.kind] += 1;
      var cells = ms.map(function (m) {
        var a = m.answers[q.id];
        if (!a || !a.choice || a.choice === "skip") return '<td data-label="' + esc(m.name) + '"><span class="pick-chip skip">skipped</span></td>';
        var al = alignedParties(q, a.choice);
        return '<td data-label="' + esc(m.name) + '"><span class="pick-chip" title="' + esc(pickText(q, a.choice, level)) + '"><span class="pick-dots">' + al.map(function (pid) { return '<span class="dot" style="' + partyVars(pid) + '"></span>'; }).join("") + "</span>" +
          esc(al.map(function (pid) { return PBY[pid].short_name; }).join(" / ")) + "</span></td>";
      }).join("");
      return '<tr><th scope="row"><a href="#issue-' + q.id + '" data-open="' + q.id + '">' + esc(issueLabel(q, level)) + "</a></th>" + cells +
        '<td class="tog" data-label="Together"><span class="agree-label' + (ag.kind === "na" ? " na" : "") + '">' + esc(agreeLabel(ag, level)) + "</span></td></tr>";
    }).join("");
    var total = QUESTIONS.length;
    function n(k) { return counts[k] + (counts[k] === 1 ? " question" : " questions"); }
    var summary;
    if (counts.split === total) summary = "You picked different answers on all " + total + " questions.";
    else if (counts.agree === total) summary = "You picked the same answer on all " + total + " questions.";
    else {
      var parts = [];
      if (counts.agree) parts.push("same answer on " + n("agree"));
      if (counts.close) parts.push("different answers but the same closest party on " + n("close"));
      if (counts.mostly) parts.push("most agree on " + n("mostly"));
      if (counts.split) parts.push((kid ? "different picks on " : "split on ") + n("split"));
      if (counts.na) parts.push("not enough answers on " + n("na"));
      summary = parts.join(", ") + ".";
      summary = summary.charAt(0).toUpperCase() + summary.slice(1);
    }
    return '<p class="small">' + esc(summary) + ' Each chip shows the party whose position is closest to that person\'s answer.</p><div class="agree"><table><thead>' + head + "</thead><tbody>" + rows + "</tbody></table></div>";
  }

  /** "the three local questions for Surrey counted double" style sentence for method notes. */
  function localWeightText() {
    var n = localCount();
    if (!RIDING) return "Local candidate scores need a riding; none was picked.";
    if (!n) return "Local candidate scores use the party scores as they are, because " + regionName() + " has no local questions yet.";
    return "Local candidate scores count the " + numWord(n) + " local " + (n === 1 ? "question" : "questions") + " for " + regionName() + " double.";
  }
  /** Note under the candidate list heading. */
  function candNote() {
    var n = localCount();
    return n ? "Candidates use their party's positions, with the " + numWord(n) + " local " + (n === 1 ? "question" : "questions") + " for " + regionName() + " counted double." : "Candidates use their party's positions.";
  }
  /** Simple-language summary of the last result (levels 1 and 2). */
  function lastTimeSimple(res) {
    if (!res) return "The last result for this riding is not loaded yet. Nobody knows who will win this time.";
    return "In 2024, " + partyShort(res.party) + " won here by " + res.margin_pct + " points. Nobody knows who will win this time.";
  }
  var LIST_STATUS = {
    official: "Official candidate list from Elections BC.",
    partial: "Partial list. More candidates may be added.",
    pending: "Candidate list not loaded yet."
  };
  function srcLinks(list) {
    return (list || []).map(function (s) { return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.label) + "</a>"; }).join("");
  }
  function byLastName(a, b) {
    var la = a.name.split(" ").slice(-1)[0], lb = b.name.split(" ").slice(-1)[0];
    return la === lb ? a.name.localeCompare(b.name) : la.localeCompare(lb);
  }
  /** Independents and smaller parties: listed, not scored. */
  function othersHtml(level) {
    var list = (SPEC.local.others || []).slice().sort(byLastName);
    if (!list.length) return "";
    return '<div class="block-head" style="margin-top:6px"><h3 class="h3">Also running, not scored</h3><p class="small muted">Independents and smaller parties have not published platforms we can compare, so they have no match score.</p></div>' +
      '<div class="cands">' + list.map(function (c) {
        var src = srcLinks(c.sources);
        var bio = pick(c.bio, level);
        return '<article class="cand cand-other"><div><h4 class="cand-name">' + esc(c.name) + '</h4><p class="small muted">' + esc((c.party_label || "Independent") + (c.incumbent ? ", incumbent MLA" : "")) + "</p></div>" +
          (bio ? "<p>" + esc(bio) + "</p>" : "") +
          (src ? '<div class="pos-src"><span class="muted">Sources:</span>' + src + "</div>" : "") + "</article>";
      }).join("") + "</div>";
  }
  function candCards(level) {
    return CANDS.slice().sort(byLastName).map(function (c) {
      var p = PBY[c.party_id];
      var src = srcLinks(c.sources);
      return '<article class="cand" style="' + partyVars(c.party_id) + '"><div class="cand-head">' + plate(c.party_id, "s") + '<div><h4 class="cand-name">' + esc(c.name) + '</h4><p class="small muted">' + esc(p.short_name) + (c.incumbent ? ", incumbent MLA" : "") + "</p></div></div>" +
        (pick(c.bio, level) ? "<p>" + esc(pick(c.bio, level)) + "</p>" : "") +
        (c.record_note ? '<p class="small"><strong>Record: </strong>' + esc(pick(c.record_note, level)) + "</p>" : "") +
        (src ? '<div class="pos-src"><span class="muted">Sources:</span>' + src + "</div>" : "") + "</article>";
    }).join("");
  }
  /** One election result as a stacked bar with a legend. */
  function resultRow(r, level) {
    var keys = Object.keys(r.shares || {});
    var segs = keys.map(function (k) {
      var style = PBY[k] ? partyVars(k) : "--pf:var(--p-" + k + ", var(--p-liberal))";
      return '<span style="' + style + ";width:" + r.shares[k] + '%" title="' + esc(partyShort(k) + " " + r.shares[k] + "%") + '"></span>';
    }).join("");
    var legend = keys.map(function (k) {
      var style = PBY[k] ? partyVars(k) : "--pf:var(--p-liberal)";
      return '<span style="' + style + '"><i></i>' + esc(partyShort(k)) + " " + r.shares[k] + "%</span>";
    }).join("");
    return '<div class="hist-row"><span class="hist-year">' + esc(r.year || 2024) + "</span><div>" +
      '<div class="stackbar" role="img" aria-label="' + esc((r.year || 2024) + " vote shares: " + keys.map(function (k) { return partyShort(k) + " " + r.shares[k] + "%"; }).join(", ")) + '">' + segs + "</div>" +
      '<div class="hist-legend">' + legend + "</div>" +
      '<p class="small" style="margin-top:6px"><strong>' + esc(r.winner) + " (" + esc(partyShort(r.party)) + ") won by " + Number(r.margin_votes).toLocaleString("en-CA") + " votes, " + esc(r.margin_pct) + " points.</strong>" + (level >= 4 && r.note ? " " + esc(r.note) : "") + "</p></div></div>";
  }
  /** Bold first line of the candidate notice. */
  function candNoticeLead(kid) {
    var L = SPEC.local;
    if (L.rich) {
      var inc = CANDS.filter(function (c) { return c.incumbent; })[0];
      if (kid) return "No candidate here has said anything different from their party." + (inc ? " The current MLA, " + inc.name + ", voted with his party every time." : "");
      return "No " + L.riding + " candidate has published a position that differs from their party" + (inc ? ", and the incumbent, " + inc.name + ", voted with his party on all 105 recorded divisions." : ".");
    }
    return "Candidates are scored on their party's positions, with the local questions for your region counted double.";
  }
  function ridingSection(level, order) {
    var L = SPEC.local;
    var kid = isKid(level);
    if (!RIDING) {
      return '<section class="block" id="riding" aria-labelledby="riding-title"><div class="block-head"><p class="eyebrow">Your riding</p><h2 class="h2" id="riding-title">No riding picked</h2></div>' +
        '<div class="notice"><strong>Pick your riding to see your local candidates.</strong> Your riding adds local questions and shows the candidates on your ballot.</div>' +
        '<div class="row"><button type="button" class="btn" id="pick-riding-btn">Pick your riding</button></div></section>';
    }
    var cands = candCards(level);
    var status = LIST_STATUS[L.list_status] || LIST_STATUS.pending;
    var candHead = '<div class="block-head"><h3 class="h3">' + (hasCands() ? "The " + numWord(CANDS.length) + (CANDS.length === 1 ? " candidate" : " candidates") + " we score" : "Candidates") + '</h3><p class="small muted">' + esc((hasCands() ? "Listed by last name. " : "") + status) + "</p></div>";
    var notice;
    if (L.rich) {
      notice = '<div class="notice"><strong>' + esc(candNoticeLead(kid)) + "</strong> " +
        esc(kid ? "So each candidate's score is the same as their party's." : pick(L.scoring_method, Math.max(3, level))) + "</div>";
    } else {
      notice = '<div class="notice">Candidates are scored on their party\'s positions, with the local questions for your region counted double. Independents and smaller parties are listed but not scored because they have not published platforms we can compare.</div>';
    }
    var candBlock = candHead + (hasCands() ? notice + '<div class="cands">' + cands + "</div>" : (L.others && L.others.length ? "" : '<p class="notice">Candidate list not loaded yet. Check back closer to voting day, or see the list at elections.bc.ca.</p>')) + othersHtml(level);
    var body;
    if (L.rich && L.context) {
      var ctx = L.context;

      var src = (ctx.sources || []).map(function (s) { return '<li><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.label) + "</a></li>"; }).join("");
      /* Neutral framing: past margins and published projections only. Simple levels get a plain summary instead of odds and poll spreads. */
      var racePanel = kid ?
        '<div class="panel"><h3 class="panel-title">Last time</h3><p>' + esc(lastTimeSimple(L.result_2024 || (ctx.results_history || [])[0])) + "</p></div>" :
        '<div class="panel"><h3 class="panel-title">Past margins and projections</h3><div class="prose"><p>' + esc(pick(ctx.competitiveness, level)) + "</p><p>" + esc(pick(ctx.polls_projection, level)) + "</p>" +
        '<p class="small muted">This section reports past results and published projections only. It is not advice on how to vote, and projections do not say who will win.</p></div></div>';
      body = '<p class="lede">' + esc(pick(L.riding_note, level)) + "</p>" +
        '<div class="two-col"><div class="panel"><h3 class="panel-title">Past results</h3><div class="history">' + hist + "</div></div>" + racePanel + "</div>" +
        '<div class="two-col"><div class="panel"><h3 class="panel-title">Who lives here</h3><p>' + esc(pick(ctx.demographics, level)) + "</p></div>" +
        '<div class="panel"><h3 class="panel-title">Candidates forum</h3><p>' + esc(pick(ctx.forum_note, level)) + "</p></div></div>" +
        candBlock +
        (src ? '<details class="more"><summary>Riding sources</summary><ul class="srclist">' + src + "</ul></details>" : "");
    } else {
      var res = L.result_2024;
      var resPanel = '<div class="panel"><h3 class="panel-title">2024 result</h3>' + (res ? '<div class="history">' + resultRow({ year: 2024, winner: res.winner, party: res.party, margin_votes: res.margin_votes, margin_pct: res.margin_pct, shares: res.shares || {} }, level) + "</div>" : '<p class="muted">The 2024 result for this riding is not loaded yet.</p>') +
        (L.mla_change ? '<p class="small"><strong>Since 2024: </strong>' + esc(L.mla_change) + "</p>" : "") + "</div>";
      var locPanel = '<div class="panel"><h3 class="panel-title">Where it is</h3><p>' + esc(RIDING.communities ? RIDING.communities + "." : "Part of " + regionName() + ".") + "</p>" +
        '<p class="small muted">' + esc(localCount() ? "Local questions for " + regionName() + ": " + localCount() + "." : regionName() + " has no local questions yet, so this riding uses the provincial questions only.") + "</p></div>";
      body = '<p class="lede">' + esc(pick(L.riding_note, level)) + "</p>" +
        '<div class="two-col">' + resPanel + locPanel + "</div>" + candBlock;
    }
    return foldSection("riding", "riding-title", "Your riding", L.riding, body);
  }
  /** A results section that folds on phones (open by default on wider screens). */
  function foldSection(id, titleId, eyebrow, title, body) {
    return '<section class="block" id="' + id + '" aria-labelledby="' + titleId + '"><details class="fold" data-fold="' + id + '" open>' +
      '<summary><span class="block-head"><span class="eyebrow">' + esc(eyebrow) + '</span><h2 class="h2" id="' + titleId + '">' + esc(title) + "</h2></span>" +
      '<span class="sum-toggle" aria-hidden="true"><span class="plus">+</span><span class="minus">-</span></span></summary>' +
      '<div class="fold-body">' + body + "</div></details></section>";

  function howToVoteSection(level) {

    var kidNote = "";
    return '<section class="block" id="how-to-vote" aria-labelledby="htv-title"><div class="block-head"><p class="eyebrow">Elections BC</p><h2 class="h2" id="htv-title">How to vote</h2></div>' + kidNote +
      '<dl class="facts">' + items.map(function (it) { return '<div class="fact"><dt>' + esc(it[0]) + "</dt><dd>" + esc(it[1]) + "</dd></div>"; }).join("") + "</dl>" +
      '<div class="links">' + h.links.map(function (l) { return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + "</a>"; }).join("") + "</div></section>";
  }

  function partiesSection(level, order) {
    return foldSection("parties", "parties-title", "Listed in your result order", "The " + numWord(PARTIES.length) + " parties", '<div class="party-list">' +
      order.map(function (pid) {
        var p = PBY[pid];
        var rec = level >= 3 ? pick(p.record_summary, level) : "";
        var src = (p.sources || []).map(function (s) { return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.label) + "</a>"; }).join("");
        return '<article class="party-item" style="' + partyVars(pid) + '"><div class="party-item-head">' + plate(pid, "s") + '<div><h3 class="h3">' + esc(p.name) + '</h3><p class="small muted">Leader: ' + esc(p.leader) + ". " + esc(p.candidates_running) + " candidates. " + esc(p.seats_at_dissolution) + " seats at dissolution.</p></div></div>" +
          "<p>" + esc(pick(p.one_liner, level)) + "</p>" + (rec ? '<p class="small"><strong>Record: </strong>' + esc(rec) + "</p>" : "") +
          (level >= 4 && p.leader_note ? '<p class="small muted">' + esc(p.leader_note) + "</p>" : "") +
          (src ? '<div class="pos-src"><span class="muted">Sources:</span>' + src + "</div>" : "") + "</article>";
      }).join("") + '</div><p class="small">' + esc(pick(SPEC.other_parties_note, level)) + "</p>");
  }

  function methodSection(level) {
    var src = SPEC.sources.map(function (s) { return '<li><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.label) + "</a>" + (s.used_for ? ' <span class="muted">' + esc(s.used_for) + "</span>" : "") + "</li>"; }).join("");
    /* The disclaimer stays outside the fold so it is always visible */
    return foldSection("method", "method-title", "How this works", "Method",
      '<div class="prose"><p>' + esc(pick(SPEC.meta.method_summary, level)) + "</p>" +
      (level >= 3 ? "<p>Importance weights: low counts half, medium counts once, high counts twice. " + esc(localWeightText()) + " " + (isTogether() ? "Answer options were shown in one random order for the group" : "Answer options were shown in a different random order for each person") + " so no party's answer always came first.</p>" : "<p>Answers were shown in a mixed-up order" + (isTogether() ? "" : " for each person") + ", so no party's answer always came first.</p>") + "</div>" +
      '<details class="more"><summary>All ' + SPEC.sources.length + " sources</summary><ol class=\"srclist\">" + src + "</ol></details>").replace(/<\/section>$/, "") +
      '<p class="notice" id="disclaimer">' + esc(pick(SPEC.meta.disclaimer, level)) + "</p></section>";
  }

  function shareSection() {
    return '<section class="block" id="share" aria-labelledby="share-title"><div class="block-head"><p class="eyebrow">Keep a copy</p><h2 class="h2" id="share-title">Save or share your results</h2></div>' +
      '<div class="panel share"><div class="row">' +
      '<button type="button" class="btn btn-primary" id="pdf-btn" hidden>Save results as PDF</button>' +
      '<button type="button" class="btn" id="copy-btn">Copy results as text</button>' +
      '<button type="button" class="btn btn-quiet" id="reset-btn">Clear all and restart</button></div>' +
      '<p class="status" id="share-status" role="status" aria-live="polite"></p>' +
      '<p class="small muted" id="pdf-note">' + (downloadsState === "none" ? "Saving a PDF is not available in this view. Copy the results as text instead." : downloadsState === "pending" ? "Checking whether this view can save files." : "") + "</p>" +
      '<div id="copy-fallback" hidden><label for="copy-text" class="small"><strong>Select all and copy this text:</strong></label><textarea id="copy-text" class="copybox" readonly></textarea></div>' +
