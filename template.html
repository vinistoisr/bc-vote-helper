  /** Second headline column when there is no candidate match to show. */
  function noCandsHeadline() {
    var msg = RIDING ? "Candidate list not loaded yet." : "Pick your riding to see your local candidates.";
    var sub = RIDING ? "Once the candidates for " + ridingName() + " are added, this shows which one is closest to your answers." : "Your riding adds local questions and a candidate match.";
    return '<div class="hl-set"><p class="eyebrow">' + esc(RIDING ? ridingName() : "Your riding") + '</p><div class="panel hl-empty"><p><strong>' + esc(msg) + '</strong></p><p class="small muted">' + esc(sub) + "</p>" +
      (RIDING ? "" : '<div class="row"><button type="button" class="btn btn-s" id="pick-riding-hl">Pick your riding</button></div>') + "</div></div>";
  }
  /** From results back to the start screen with the riding picker open. */
  function goPickRiding() {
    S.phase = "setup"; ridingUi.open = true; ridingUi.status = ""; save(); render("pc-input");
  }
  var foldState = {};
  function renderResults() {
    var R = computeResults(S);
    var level = R.level;
    var kid = isKid(level);
    var openSet = {};
    app.querySelectorAll("details.issue[open]").forEach(function (d) { openSet[d.id.replace("issue-", "")] = true; });
    app.className = "wrap";
    if (!R.hasAnswers) {
      app.innerHTML = '<section class="card stack" aria-labelledby="res-title"><h2 class="h2" id="res-title" tabindex="-1">No answers to compare yet</h2>' +
        "<p>Every question was skipped, so there is nothing to score. Go back and answer a few questions, or start over.</p>" +
        '<div class="row"><button type="button" class="btn btn-primary" id="redo-btn">Answer questions</button><button type="button" class="btn" id="reset-btn">Start over</button></div></section>';
      el("redo-btn").addEventListener("click", function () { S.phase = isTogether() ? "together" : "quiz"; S.cur = 0; S.qi = 0; save(); render("q-title"); });
      el("reset-btn").addEventListener("click", confirmReset);
      return;
    }
    var order = R.rankedP.map(function (r) { return r.id; });
    var who = R.isFamily ? "Family average of " + R.counted.length + (R.counted.length === 1 ? " person" : " people") : "Your result";
    var solo = R.isFamily ? null : R.members[0];
    var rl = '<div class="rl" role="radiogroup" aria-labelledby="rl-label"><span class="rl-label" id="rl-label">Reading level</span><div class="rl-row">' + LEVELS.map(function (l) {
      return '<div class="rl-opt"><input type="radio" name="rl" id="rl-' + l.id + '" value="' + l.id + '" aria-label="' + esc(l.id + ", " + levelLong(l)) + '"' + (level === l.id ? " checked" : "") + '><label for="rl-' + l.id + '" title="' + esc(levelLong(l)) + '">' + l.id + ' <span class="rl-word">' + esc(l.label) + "</span></label></div>";
    }).join("") + "</div></div>";
    var famNote = "";
    if (R.isFamily) {
      var skipped = R.members.filter(function (m) { return R.counted.indexOf(m) < 0; });
      if (skipped.length) famNote = '<p class="small muted" style="margin-top:10px">' + esc(skipped.map(function (m) { return m.name; }).join(", ")) + (skipped.length === 1 ? " skipped every question and is" : " skipped every question and are") + " not in the average.</p>";
    }

    /* Heading carries the finding, so focus lands on it and a screen reader hears the result */
    var resTitle;
    if (R.split) resTitle = kid ? "Your family picked different things" : "Your family's answers point different ways";
    else if (R.closeP.length > 1) resTitle = "Close result" + (R.isFamily ? " for your family" : "") + ": " + joinAnd(R.closeP.map(function (g) { return PBY[g.id].short_name; }));
    else resTitle = "Closest to " + (R.isFamily ? "your family's answers" : (S.people[0].name.trim() ? poss(nameOf(S, 0)) + " answers" : "your answers")) + ": " + PBY[R.rankedP[0].id].short_name;

    var splitBanner = R.split ? '<div class="close-banner split-banner"><span class="tag tag-solid">Different results</span><span>' +
      (kid ? "Your family picked different things. Here is what each person got." : "Your family's answers point in different directions. The average below blends everyone and may not match anyone's own result.") + "</span></div>" : "";
    var strip = R.isFamily ? whoStrip(R) : "";
    var hlOpts = { member: solo, soft: R.split };
    var hlNote = '<p class="hl-note">' + (kid ?
      "A starting point, not advice on how to vote. Talk it over with people you trust." :
      "<strong>A starting point, not a recommendation.</strong> Based on party positions published by " + esc(dateLong(SPEC.meta.data_as_of)) + ". <a href=\"#method\">How this works</a>") + "</p>";

    var perPerson = "";
    if (R.isFamily) {
      perPerson = '<section class="block" id="people" aria-labelledby="people-title"><div class="block-head"><p class="eyebrow">Each person</p><h2 class="h2" id="people-title">' + (kid ? "What each person got" : "Results for each person") + '</h2></div><div class="persons">' +
        R.members.map(function (m) {
          var L = levelInfo(m.level);
          if (!m.answered) return '<article class="pcard"><div class="pcard-head"><h3 class="pcard-name">' + esc(m.name) + '</h3><span class="tag">' + esc(L.label) + '</span></div><p class="muted">Skipped every question.</p></article>';
          var top = m.close;
          var topHtml = top.map(function (t) { return '<span class="row" style="gap:8px">' + plate(t.id, "xs") + "<strong>" + esc(PBY[t.id].short_name) + " " + fmtPct(t.pct) + "%</strong></span>"; }).join("");
          return '<article class="pcard"><div class="pcard-head"><h3 class="pcard-name">' + esc(m.name) + '</h3><span class="tag">' + esc(L.label) + "</span></div>" +
            '<div class="pcard-top">' + (top.length > 1 ? '<span class="tag tag-solid">Close</span>' : '<span class="small muted">Closest</span>') + topHtml + "</div>" +
            bars(m.ranked, false, m, kid) +
            '<p class="small muted">' + (hasCands() ? "Local: " + esc(m.rankedLocal[0] && m.rankedLocal[0].pct != null ? CBY[m.rankedLocal[0].id].name + " " + fmtPct(m.rankedLocal[0].pct) + "%" : "no score") + ". " : "") + "Answered " + m.answered + " of " + QUESTIONS.length + ".</p></article>";
        }).join("") + "</div></section>";
    }

    /* Ranked lists. Family: one list ordered by the all-members mean, adults-only mean in a second column. */
    var nAd = R.fam.adultsCounted.length;
    var famKey = R.isFamily ? '<p class="small muted"><strong>All</strong> is the mean of ' + R.counted.length + (R.counted.length === 1 ? " person" : " people") + " (the headline). <strong>L3-5</strong> is the mean of members who answered at reading levels 3 to 5" + (nAd ? " (" + nAd + (nAd === 1 ? " person" : " people") + ")." : ". Nobody did, so there is no mean for those levels.") + "</p>" : "";
    function adultsTop(rankedAd, isCand) {
      if (!rankedAd || !rankedAd.length || rankedAd[0].pct == null) return "";
      var t = rankedAd[0];
      return '<p class="small">Closest for members at reading levels 3 to 5: <strong>' + esc(isCand ? CBY[t.id].name + " (" + PBY[CBY[t.id].party_id].short_name + ")" : PBY[t.id].short_name) + " " + fmtPct(t.pct) + "%</strong></p>";
    }
    var rankedParties = R.isFamily ? '<div class="panel">' + famKey + famBars(R.rankedP, R.fam.adults, false, nAd) + adultsTop(R.rankedPAdults, false) + "</div>" : '<div class="panel">' + bars(R.rankedP, false, solo, kid) + "</div>";
    var rankedCands = !hasCands() ? "" : R.isFamily ? '<div class="panel">' + famBars(R.rankedC, R.fam.localAdults, true, nAd) + adultsTop(R.rankedCAdults, true) + "</div>" : '<div class="panel">' + bars(R.rankedC, true, solo, kid) + "</div>";

    /* What drove the match */
    var top = R.rankedP[0], second = R.rankedP[1];
    var topN = PBY[top.id].short_name, secN = PBY[second.id].short_name;
    var isClose = R.closeP.length > 1;
    var maxC = Math.max.apply(null, R.drivers.map(function (d) { return Math.max(d.top, d.second); }).concat([1e-6]));
    var drvHtml = R.drivers.length ? '<div class="drivers">' + R.drivers.map(function (d, k) {
      var q = QBY[d.qid];
      var picks = R.members.map(function (m) {
        var a = m.answers[q.id];
        var t = a ? pickText(q, a.choice, level) : null;
        if (!t) return R.isFamily ? '<p><span class="drv-who">' + esc(m.name) + '</span><span class="muted">' + (kid ? "Not sure" : "Not sure or skipped") + "</span></p>" : "";
        return "<p>" + (R.isFamily ? '<span class="drv-who">' + esc(m.name) + "</span>" : "") + esc(t) + "</p>";
      }).join("");
      var mini = '<div class="drv-bars" aria-hidden="true">' + [[top.id, d.top], [second.id, d.second]].map(function (x) {
        return '<div class="drv-bar" style="' + partyVars(x[0]) + '"><span>' + esc(PBY[x[0]].short_name) + '</span><span class="drv-track"><i style="width:' + Math.max(0, (x[1] / maxC) * 100).toFixed(1) + '%"></i></span></div>';
      }).join("") + "</div>";
      var line = kid ? (k === 0 ? "This answer moved you the most toward " + topN + " and away from " + secN + "." : "This one also moved you closer to " + topN + " than to " + secN + ".") :
        "Added " + d.top.toFixed(1) + " points to " + topN + " and " + d.second.toFixed(1) + " to " + secN + ".";
      return '<div class="driver"><span class="driver-n" aria-hidden="true">' + (k + 1) + '</span><div class="driver-main"><p class="driver-issue">' + esc(issueLabel(q, level)) + "</p>" +
        (picks ? '<div class="drv-picks">' + picks + "</div>" : "") + mini + '<p class="driver-pts">' + esc(line) + "</p></div>" +
        (kid ? "" : '<p class="driver-lead"><b>+' + d.lead.toFixed(1) + "</b><span>points</span></p>") + "</div>";
    }).join("") + "</div>" : '<p class="muted">No single question gave ' + esc(topN) + " a lead.</p>";
    var famAvg = R.isFamily ? ", averaged across the family" : "";
    var drvTitle = isClose ? "What separates the top two" : kid ? "Answers that mattered most" : "What drove your match";
    var drvIntro = isClose ? topN + " and " + secN + " are within " + CLOSE_POINTS + " points. These three questions moved them furthest apart" + famAvg + "." :
      kid ? "These answers moved you closer to " + topN + " than to " + secN + "." :
      "The three questions that added the most to " + poss(topN) + " lead over " + secN + ", in percentage points" + famAvg + ".";

    app.innerHTML =
      '<div class="toolbar"><div class="toolbar-in">' + rl + '<button type="button" class="btn btn-s" id="tb-reset">Clear all and restart</button></div></div>' +
      '<section class="block" aria-labelledby="res-title" style="padding-top:20px">' +
      '<div class="res-head"><p class="eyebrow">' + esc(ridingName() || "All of BC") + " | Data as of " + '<span class="nowrap">' + esc(dateLong(SPEC.meta.data_as_of)) + "</span></p>" +
      '<h2 class="res-title" id="res-title" tabindex="-1">' + esc(resTitle) + "</h2></div>" +
      (R.split ? splitBanner + strip.replace('class="who-strip"', 'class="who-strip" style="margin:0 0 16px"') : "") +
      '<div class="hl-grid' + (R.closeP.length > 1 || R.closeC.length > 1 ? " stacked" : "") + '">' + headlineSet(R.closeP, false, level, who + ", province-wide", R.rankedP, hlOpts) + (hasCands() ? headlineSet(R.closeC, true, level, who + ", " + ridingName(), R.rankedC, hlOpts) : noCandsHeadline()) + "</div>" +
      (R.isFamily && !R.split ? strip : "") +
      hlNote + famNote +
      '<nav class="jump" aria-label="On this page"><a href="#ranked">All parties</a><a href="#drivers">What drove it</a>' + (R.isFamily ? '<a href="#agreement">Agree and split</a>' : "") + '<a href="#breakdown">Issue by issue</a><a href="#riding">' + esc(ridingName() || "Your riding") + '</a><a href="#how-to-vote">How to vote</a><a href="#share">Save or share</a></nav>' +
      "</section>" +
      '<section class="block" id="ranked" aria-labelledby="ranked-title"><div class="block-head"><p class="eyebrow">' + esc(who) + '</p><h2 class="h2" id="ranked-title">' + (kid ? "How close each party is" : "All " + numWord(PARTIES.length) + " parties") + "</h2></div>" +
      rankedParties +
      (hasCands() ? '<div class="block-head" style="margin-top:8px"><h3 class="h3">' + (kid ? "How close each local candidate is" : esc(ridingName()) + " candidates") + '</h3><p class="small muted">' + esc(candNote()) + "</p></div>" + rankedCands :
        '<p class="notice" style="margin-top:8px">' + esc(RIDING ? "Candidate list for " + ridingName() + " not loaded yet, so there is no candidate match." : "Pick your riding to see your local candidates.") + "</p>") +
      "</section>" +
      perPerson +
      '<section class="block" id="drivers" aria-labelledby="drivers-title"><div class="block-head"><p class="eyebrow">Behind the result</p><h2 class="h2" id="drivers-title">' + esc(drvTitle) + "</h2>" +
      '<p class="small muted">' + esc(drvIntro) + "</p></div>" + drvHtml + "</section>" +
      (R.isFamily ? '<section class="block" id="agreement" aria-labelledby="agree-title"><div class="block-head"><p class="eyebrow">Family</p><h2 class="h2" id="agree-title">' + (kid ? "Where you agree and where you think differently" : "Where you agree and where you split") + "</h2></div>" + agreementTable(R, level) + "</section>" : "") +
      '<section class="block" id="breakdown" aria-labelledby="breakdown-title"><div class="block-head"><p class="eyebrow">All ' + QUESTIONS.length + ' questions</p><h2 class="h2" id="breakdown-title">Issue by issue</h2>' +
      '<div class="row-between"><p class="small muted">Parties are listed in your result order. Tap an issue to see each party\'s position and sources.</p><button type="button" class="btn btn-s" id="toggle-all">Open all</button></div></div>' +
      '<div class="issues">' + QUESTIONS.map(function (q) { return issueDetails(q, R, order, level, openSet); }).join("") + "</div></section>" +
      ridingSection(level, order) +
      howToVoteSection(level) +
      partiesSection(level, order) +
      methodSection(level) +
      shareSection();

    app.querySelectorAll('input[name="rl"]').forEach(function (r) {
      r.addEventListener("change", function () {
        var anchor = el("rl-" + r.value);
        var before = anchor ? anchor.getBoundingClientRect().top : 0;
        S.resultsLevel = Number(r.value);
        save();
        renderResults();
        var a2 = el("rl-" + S.resultsLevel);

        }
      });
    });
    var tog = el("toggle-all");
    tog.addEventListener("click", function () {
      var ds = app.querySelectorAll("details.issue");
      var anyClosed = Array.prototype.some.call(ds, function (d) { return !d.open; });

    });
    /* In-page links open whatever folded section or issue they point into */
    app.querySelectorAll('a[href^="#"]').forEach(function (a) {

    ["pick-riding-btn", "pick-riding-hl"].forEach(function (id) { var b = el(id); if (b) b.addEventListener("click", goPickRiding); });
    el("copy-btn").addEventListener("click", copyResults);
    el("reset-btn").addEventListener("click", confirmReset);
    el("tb-reset").addEventListener("click", confirmReset);
    el("pdf-btn").addEventListener("click", savePdf);

  }

  /* ------------------------------------------------------------------ */
  /* Plain-text results                                                  */
  /* ------------------------------------------------------------------ */
  function resultsText(st) {
    var R = computeResults(st || S);
    var lv = Math.max(3, R.level);
    var out = [];
    out.push("BC Vote Helper 2026 results");
    out.push((ridingName() || "No riding picked") + " | " + todayLong() + " | data as of " + dateLong(SPEC.meta.data_as_of));
    out.push("");
    if (!R.hasAnswers) { out.push("No answers yet."); return out.join("\n"); }
    var who = R.isFamily ? "Family average (" + R.counted.length + " people)" : "Result";
    if (R.split) out.push("Different results: each person's own closest party differs (" + R.counted.map(function (m) { return m.name + ": " + m.close.map(function (c) { return PBY[c.id].short_name + " " + fmtPct(c.pct) + "%"; }).join(" and "); }).join("; ") + "). The family average below blends everyone.");
    if (R.closeP.length > 1) out.push(who + ": close result between " + R.closeP.map(function (c) { return PBY[c.id].short_name + " " + fmtPct(c.pct) + "%"; }).join(" and ") + " (within " + CLOSE_POINTS + " points).");
    else out.push(who + ": closest party is " + PBY[R.rankedP[0].id].name + " (" + PBY[R.rankedP[0].id].leader + "), " + fmtPct(R.rankedP[0].pct) + "%.");
    if (!hasCands()) out.push(RIDING ? ridingName() + ": candidate list not loaded yet." : "Pick your riding to see your local candidates.");
    else if (R.closeC.length > 1) out.push(ridingName() + ": close result between " + R.closeC.map(function (c) { return CBY[c.id].name + " (" + PBY[CBY[c.id].party_id].short_name + ") " + fmtPct(c.pct) + "%"; }).join(" and ") + ".");
    else if (R.rankedC[0] && R.rankedC[0].pct != null) out.push(ridingName() + ": closest candidate is " + CBY[R.rankedC[0].id].name + " (" + PBY[CBY[R.rankedC[0].id].party_id].short_name + "), " + fmtPct(R.rankedC[0].pct) + "%.");
    out.push("");
    out.push("All parties" + (R.isFamily ? " (all members)" : "") + ":");
    R.rankedP.forEach(function (r, k) { out.push("  " + (k + 1) + ". " + PBY[r.id].short_name + " " + fmtPct(r.pct) + "%"); });
    if (R.isFamily) {
      out.push("Reading levels 3 to 5 only:");
      if (R.rankedPAdults) R.rankedPAdults.forEach(function (r, k) { out.push("  " + (k + 1) + ". " + PBY[r.id].short_name + " " + fmtPct(r.pct) + "%"); });
      else out.push("  Nobody answered at levels 3 to 5.");
    }
    if (hasCands()) {
      out.push("Candidates in " + ridingName() + " (" + candNote().replace(/\.$/, "").replace(/^Candidates use/, "using") + "):");
      R.rankedC.forEach(function (r, k) { var c = CBY[r.id]; out.push("  " + (k + 1) + ". " + c.name + " (" + PBY[c.party_id].short_name + ") " + fmtPct(r.pct) + "%"); });
    }
    if (RIDING && (SPEC.local.others || []).length) out.push("Also running, not scored: " + SPEC.local.others.map(function (o) { return o.name + " (" + (o.party_label || "Independent") + ")"; }).join(", ") + ".");
    if (R.isFamily) {
      out.push("");
      out.push("Each person:");
      R.members.forEach(function (m) {
        if (!m.answered) { out.push("  " + m.name + ": skipped every question"); return; }
        out.push("  " + m.name + " (" + levelInfo(m.level).label + "): " + m.ranked.map(function (r) { return PBY[r.id].short_name + " " + fmtPct(r.pct) + "%"; }).join(", "));
      });
    }
    if (R.drivers.length) {
      out.push("");
      out.push((R.closeP.length > 1 ? "What separates the top two (" : "What drove the match (") + PBY[R.rankedP[0].id].short_name + " over " + PBY[R.rankedP[1].id].short_name + "):");
      R.drivers.forEach(function (d, k) { out.push("  " + (k + 1) + ". " + issueLabel(QBY[d.qid], lv) + " (+" + d.lead.toFixed(1) + " points)"); });
    }
    out.push("");
    out.push("Answers:");
    QUESTIONS.forEach(function (q) {
      out.push("- " + issueLabel(q, lv));
      R.members.forEach(function (m) {
        var a = m.answers[q.id];
        var t = a ? pickText(q, a.choice, lv) : null;
        out.push("    " + (R.isFamily ? m.name + ": " : "") + (t ? t + (a.importance !== "medium" ? " [" + a.importance + " importance]" : "") : "not sure or skipped"));
      });
    });
    out.push("");
    out.push(pick(SPEC.meta.disclaimer, 3));
    return out.join("\n");
  }

  function setStatus(msg) { var s = el("share-status"); if (s) s.textContent = msg; }
  function copyResults() {
    var text = resultsText(S);
    function fallback() {
      var box = el("copy-fallback"), ta = el("copy-text");
      if (!box || !ta) return;
      box.hidden = false;
      ta.value = text;
      ta.focus();
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      setStatus(ok ? "Results copied." : "Copying is blocked here. The text is selected below; copy it with your device's copy command.");
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { setStatus("Results copied. Paste them into a message or note."); }, fallback);
      } else fallback();
    } catch (e) { fallback(); }
  }

  /* ------------------------------------------------------------------ */
  /* PDF (pure builder + downloads capability delivery)                  */
  /* ------------------------------------------------------------------ */
  function pdfSafe(s) {
    var t = String(s == null ? "" : s);
    try { t = t.normalize("NFKD").replace(new RegExp("[" + String.fromCharCode(0x300) + "-" + String.fromCharCode(0x36f) + "]", "g"), ""); } catch (e) { /* old engine */ }
    return t.replace(new RegExp("[" + String.fromCharCode(0x2018, 0x2019) + "]", "g"), "'").replace(new RegExp("[" + String.fromCharCode(0x201C, 0x201D) + "]", "g"), '"').replace(new RegExp("[" + String.fromCharCode(0x2013, 0x2014) + "]", "g"), "-").replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g, "?");
  }
  /*
   * PDF names. The built-in PDF fonts cover Latin-1 only. A name with other scripts (Gurmukhi, Chinese)
   * would print as question marks, so the PDF shows "Person N", keeping any Latin part beside it.
   */
  function pdfName(m) {
    var raw = String(m.name || "");
    var t = raw;
    try { t = t.normalize("NFKD").replace(new RegExp("[" + String.fromCharCode(0x300) + "-" + String.fromCharCode(0x36f) + "]", "g"), ""); } catch (e) { /* old engine */ }
    if (!/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/.test(t)) return raw;
    var latin = t.replace(/[^\x20-\x7E\xA0-\xFF]/g, "").replace(/\s+/g, " ").trim();
    var label = "Person " + (m.i + 1);
    return latin && latin !== label ? latin + " (" + label + ")" : label;
  }
  function hexRgb(hex) {
    var h = String(hex || "#000000").replace("#", "");
    if (h.length === 3) h = h.split("").map(function (c) { return c + c; }).join("");
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }

  /** buildResultsPdf(state) -> Blob (application/pdf). Needs the jsPDF UMD global; no capability required. */
  function buildResultsPdf(state) {
    var st = state || S;
    var JS = window.jspdf && window.jspdf.jsPDF;
    if (!JS) throw new Error("jsPDF is not loaded");
    var R = computeResults(st);
    var lv = R.level;
    R.members.forEach(function (m) { m.pname = pdfName(m); });
    var doc = new JS({ unit: "pt", format: "letter", compress: true });
    var PW = 612, PH = 792, M = 44, CW = PW - 2 * M, FOOT = 46;
    var y = M;
    var INK = [18, 26, 31], MUTED = [74, 86, 97], LINE = [199, 207, 210], TRACK = [223, 229, 231], FOG = [236, 239, 238];
    function color(c) { doc.setTextColor(c[0], c[1], c[2]); }
    function fill(c) { doc.setFillColor(c[0], c[1], c[2]); }
    function draw(c) { doc.setDrawColor(c[0], c[1], c[2]); }
    function font(style, size) { doc.setFont("helvetica", style); doc.setFontSize(size); }
    function newPage() { doc.addPage(); y = M; }
    function ensure(h) { if (y + h > PH - FOOT - 10) newPage(); }
    function para(text, size, style, c, width, x, lh) {
      font(style || "normal", size);
      color(c || INK);
      var lines = doc.splitTextToSize(pdfSafe(text), width || CW);
      var step = (lh || 1.32) * size;
      lines.forEach(function (ln) { ensure(step); doc.text(ln, x == null ? M : x, y + size * 0.8); y += step; });
    }
    function heading(text, size) { ensure(size * 2.4); y += 8; para(text, size || 15, "bold", INK); y += 4; }
    /* Logos use the same equal-area sizing as the page */
    function logo(pid, x, yy, maxW, maxH) {
      var l = LOGOS[pid];
      if (!l) return 0;
      var f = logoFit(pid, maxW, maxH);
      try { doc.addImage(l.src, "PNG", x + (maxW - f.w) / 2, yy + (maxH - f.h) / 2, f.w, f.h, "logo-" + pid, "FAST"); } catch (e) { /* skip */ }
      return f.w;
    }
    function plateAt(pid, x, yy, w, h) {
      fill([255, 255, 255]); draw(LINE); doc.setLineWidth(0.6);
      doc.roundedRect(x, yy, w, h, 6, 6, "FD");
      logo(pid, x + 6, yy + 4, w - 12, h - 8);
    }
    /* Score chip: white, ink text, the same for every party (matches the page) */
    function pctChip(txt, size, x, yy, alignRight) {
      font("bold", size);
      var tw = doc.getTextWidth(txt), cw = tw + 16, ch = size * 0.9 + 10;
      var cx = alignRight ? x - cw : x;
      fill([255, 255, 255]); doc.roundedRect(cx, yy, cw, ch, 7, 7, "F");
      color(INK); doc.text(txt, cx + 8, yy + 5 + size * 0.78);
      return { w: cw, h: ch };
    }
    /* narrow = three or more cards in a row: logo on top, score under it, text wrapped to the card */
    function headlineBlock(entry, isCand, x, yy, w, h, narrow) {
      var pid = isCand ? CBY[entry.id].party_id : entry.id;
      var p = PBY[pid];
      var rgb = hexRgb(p.color), on = hexRgb(p.text_on_color || "#111111");
      var pad = 14, inner = w - 2 * pad;
      fill(rgb); doc.roundedRect(x, yy, w, h, 10, 10, "F");
      var pw = narrow ? inner : Math.min(150, w * 0.42), ph = narrow ? 34 : Math.min(48, h * 0.4);
      plateAt(pid, x + pad, yy + pad, pw, ph);
      var size = narrow ? 26 : w > 300 ? 40 : 30;
      var chip = narrow ? pctChip(fmtPct(entry.pct) + "%", size, x + pad, yy + pad + ph + 8, false) : pctChip(fmtPct(entry.pct) + "%", size, x + w - pad, yy + pad, true);
      var name = isCand ? CBY[entry.id].name : p.name;
      var sub = isCand ? p.short_name + (CBY[entry.id].incumbent ? ", incumbent MLA" : "") : "Leader: " + p.leader;
      var nsz = narrow ? 12 : w > 300 ? 17 : 13, nlh = nsz * 1.15;
      font("bold", nsz); color(on);
      var nl = doc.splitTextToSize(pdfSafe(name), inner).slice(0, 2);
      var ny = (narrow ? yy + pad + ph + 8 + chip.h : yy + pad + Math.max(ph, chip.h)) + 8 + nsz * 0.8;
      nl.forEach(function (ln, k) { doc.text(ln, x + pad, ny + k * nlh); });
      var ssz = narrow ? 9 : 11;
      font("normal", ssz);
      var sl = doc.splitTextToSize(pdfSafe(sub), inner).slice(0, 2);
      var sy = ny + nl.length * nlh + 2;
      sl.forEach(function (ln, k) { doc.text(ln, x + pad, sy + k * ssz * 1.2); });
    }
    function headlineGroup(group, isCand, label) {
      var multi = group.length > 1;
      var n = group.length, narrow = n >= 3;
      var h = narrow ? 168 : isCand ? 124 : 138;
      ensure(h + 60);
      font("bold", 9); color(MUTED);
      doc.text(pdfSafe(label.toUpperCase()), M, y + 8);
      y += 14;
      if (multi) {
        font("bold", 11); color(INK);
        var names = group.map(function (g) { return isCand ? CBY[g.id].name : PBY[g.id].short_name; });
        var bl = doc.splitTextToSize(pdfSafe("Close result: " + joinAnd(names) + " are within " + CLOSE_POINTS + " points, so there is no clear single match."), CW);
        bl.forEach(function (ln) { doc.text(ln, M, y + 10); y += 14; });
        y += 4;
      }
      var gap = 10, w = (CW - gap * (n - 1)) / n;
      group.forEach(function (g, k) { headlineBlock(g, isCand, M + k * (w + gap), y, w, h, narrow); });
      y += h + 14;
    }
    function barList(ranked, isCand, x, width) {
      var rowH = 24;
      ranked.forEach(function (r) {
        ensure(rowH + 4);
        var pid = isCand ? CBY[r.id].party_id : r.id;
        var p = PBY[pid];
        plateAt(pid, x, y, 62, 20);
        var label = isCand ? CBY[r.id].name + " (" + p.short_name + ")" : p.short_name;
        font("bold", 9.5); color(INK);
        doc.text(pdfSafe(label), x + 70, y + 7);
        var bx = x + 70, bw = width - 70 - 40, by = y + 11;
        fill(TRACK); doc.roundedRect(bx, by, bw, 7, 3.5, 3.5, "F");
        if (r.pct != null && r.pct > 0) { fill(hexRgb(p.color)); doc.roundedRect(bx, by, Math.max(4, bw * r.pct / 100), 7, 3.5, 3.5, "F"); }
        font("bold", 11); color(INK);
        doc.text(r.pct == null ? "-" : fmtPct(r.pct) + "%", x + width, y + 16, { align: "right" });
        y += rowH;
      });
    }

    /* Page 1 header */
    fill(FOG); doc.rect(0, 0, PW, 70, "F");
    font("bold", 22); color(INK); doc.text("BC Vote Helper 2026", M, 38);
    font("normal", 10); color(MUTED);
    doc.text(pdfSafe("Results | " + (ridingName() || "No riding picked") + " | " + todayLong() + " | data as of " + dateLong(SPEC.meta.data_as_of)), M, 56);
    y = 88;
    para((R.isFamily ? "Participants: " : "Participant: ") + R.members.map(function (m) { return m.pname + " (" + levelLong(levelInfo(m.level)) + ", " + m.answered + " of " + QUESTIONS.length + " answered)"; }).join("; "), 10, "normal", MUTED);
    y += 8;
    if (!R.hasAnswers) {
      para("No answers to compare yet.", 14, "bold");
    } else {
      var who = R.isFamily ? "Family average of " + R.counted.length + " people" : "Your result";
      if (R.split) {
        para("Different results: each person's own closest party differs. " + R.counted.map(function (m) { return m.pname + ": " + m.close.map(function (c) { return PBY[c.id].short_name + " " + fmtPct(c.pct) + "%"; }).join(" and "); }).join("; ") + ". The family average below blends everyone and may not match anyone's own result.", 10.5, "bold", INK);
        y += 8;
      }
      headlineGroup(R.closeP, false, who + ", province-wide");
      if (hasCands()) headlineGroup(R.closeC, true, who + ", " + ridingName());

      ensure(5 * 24 + 60);
      var allP = "All " + numWord(PARTIES.length) + " parties";
      heading(R.isFamily ? allP + " (all members)" : allP, 14);
      if (R.isFamily && R.rankedPAdults) {
        var colW = (CW - 20) / 2;
        font("bold", 9); color(MUTED); doc.text("ALL MEMBERS", M, y + 6); doc.text("READING LEVELS 3 TO 5 ONLY", M + colW + 20, y + 6);
        y += 14; var yStart = y;
        barList(R.rankedP, false, M, colW);
        var yEnd = y; y = yStart;
        barList(R.rankedPAdults, false, M + colW + 20, colW);
        y = Math.max(yEnd, y);
      } else {
        barList(R.rankedP, false, M, CW);
        if (R.isFamily) para("Reading levels 3 to 5: nobody answered at those levels.", 9, "normal", MUTED);
      }
      ensure(Math.max(1, CANDS.length) * 24 + 70);
      heading(RIDING ? ridingName() + " candidates" : "Local candidates", 14);
      if (hasCands()) {
        para(candNote(), 9, "normal", MUTED);
        y += 4;
        barList(R.rankedC, true, M, CW);
      } else {
        para(RIDING ? "Candidate list not loaded yet." : "Pick your riding to see your local candidates.", 10, "normal", INK);
      }
      var others = RIDING ? (SPEC.local.others || []) : [];
      if (others.length) {
        y += 4;
        para("Also running, not scored (no published platform to compare): " + others.map(function (o) { return o.name + " (" + (o.party_label || "Independent") + ")"; }).join(", ") + ".", 9, "normal", MUTED);
      }

      if (R.isFamily) {
        ensure(R.members.length * 22 + 60);
        heading("Each person", 14);
        var colX = [M, M + 150];
        var colw = (CW - 150) / PARTY_IDS.length;
        font("bold", 7.5); color(MUTED);
        doc.text("PERSON", colX[0], y + 8);
        PARTY_IDS.forEach(function (pid, k) {
          var lab = PBY[pid].short_name.replace(/^BC /, "").toUpperCase();
          if (doc.getTextWidth(lab) > colw - 6) lab = lab.slice(0, Math.max(4, Math.floor(lab.length * (colw - 6) / doc.getTextWidth(lab)) - 1)) + ".";
          doc.text(pdfSafe(lab), colX[1] + k * colw, y + 8);

        R.members.forEach(function (m) {

          doc.text(nmLines[0], colX[0], y + 14);
          font("normal", 8); color(MUTED);
          doc.text(pdfSafe(levelInfo(m.level).label), colX[0] + 80, y + 14);

          para(pTop + " and " + pSec + " are within " + CLOSE_POINTS + " points. These three questions moved them furthest apart, in percentage points" + (R.isFamily ? ", averaged across the family." : "."), 9.5, "normal", MUTED);
        } else {
          heading("What drove the match", 14);
          para("The three questions that added the most to " + poss(pTop) + " lead over " + pSec + ", in percentage points" + (R.isFamily ? ", averaged across the family." : "."), 9.5, "normal", MUTED);
        }
        y += 2;
        R.drivers.forEach(function (d, k) {
          para((k + 1) + ". " + issueLabel(QBY[d.qid], lv) + "  (+" + d.lead.toFixed(1) + " points)", 11, "bold");
        });
      }

      /* Per-issue summary */
      ensure(160);
      y += 10;
      heading("Issue by issue", 16);
      para("Each line shows the answer chosen and the party whose position is closest to it. 'No published position' cells are left out of that party's score.", 9.5, "normal", MUTED);
      y += 6;
      var il = impLabels(lv);
      QUESTIONS.forEach(function (q) {
        ensure(48);
        draw(LINE); doc.setLineWidth(0.5); doc.line(M, y, M + CW, y); y += 6;

        R.members.forEach(function (m) {
          var a = m.answers[q.id];
          var t = a ? pickText(q, a.choice, lv) : null;
          var al = t ? alignedParties(q, a.choice) : [];

          para("Closest: " + al.map(function (pid) { return PBY[pid].short_name; }).join(" / "), 8.5, "bold", MUTED, CW - 12, M + 12);
        });

        y += 4;

    }

    newPage();
    heading("Method", 14);
    para(pick(SPEC.meta.method_summary, Math.max(3, lv)), 9.5, "normal", INK);
    y += 6;
    heading("Disclaimer", 14);
    para(pick(SPEC.meta.disclaimer, Math.max(3, lv)), 9.5, "normal", INK);
    y += 6;
    heading("How to vote", 14);
    var h = SPEC.how_to_vote;
    [["Voting day", h.voting_day], ["Advance voting", h.advance_voting], ["Vote by mail", h.mail_in], ["Who can vote", h.eligibility], ["ID", h.id_rules]].forEach(function (it) {
      para(it[0] + ": " + it[1], 9.5, "normal", INK);
      y += 2;
    });
    para("Sources for every party position are listed in the online helper. Elections BC: elections.bc.ca", 9, "normal", MUTED);

    var pages = doc.getNumberOfPages();
    for (var i = 1; i <= pages; i++) {
      doc.setPage(i);
      draw(LINE); doc.setLineWidth(0.5); doc.line(M, PH - FOOT + 6, PW - M, PH - FOOT + 6);
      font("normal", 7.5); color(MUTED);
      var foot = doc.splitTextToSize(pdfSafe("A starting point, not a recommendation. Independent tool, not connected to any party. Not an endorsement. Scores reflect published 2026 commitments and records as of " + dateLong(SPEC.meta.data_as_of) + ". Party names and logos belong to the parties."), CW - 60);
      foot.slice(0, 3).forEach(function (ln, k) { doc.text(ln, M, PH - FOOT + 18 + k * 9); });
      doc.text("Page " + i + " of " + pages, PW - M, PH - FOOT + 18, { align: "right" });
    }
    return doc.output("blob");
  }

  var downloads = null;
  var downloadsState = "pending";
  function updatePdfUi() {
    var b = el("pdf-btn"), note = el("pdf-note");
    if (!b) return;
    b.hidden = downloadsState !== "ready";
    if (note) note.textContent = downloadsState === "none" ? "Saving a PDF is not available in this view. Copy the results as text instead." : downloadsState === "pending" ? "Checking whether this view can save files." : "";
  }
  (function initDownloads() {
    if (SITE) {
      /* Plain browser: hand the Blob to a temporary download link */
      downloads = {
        save: function (o) {
          var url = URL.createObjectURL(o.data);
          var a = document.createElement("a");
          a.href = url; a.download = o.filename; a.rel = "noopener";
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
          return Promise.resolve({ status: "delivered" });
        }
      };
      downloadsState = "ready";
      return;
    }
    var c = window.claude;
    var p;
    try { p = c && typeof c.use === "function" ? c.use("downloads") : Promise.resolve(null); } catch (e) { p = Promise.resolve(null); }
    Promise.resolve(p).then(function (d) {
      downloads = d || null;
      downloadsState = downloads ? "ready" : "none";
      updatePdfUi();
    }, function () { downloadsState = "none"; updatePdfUi(); });
  })();
  var saving = false;
  function savePdf() {
    if (saving || !downloads) return;
    var b = el("pdf-btn");
    var blob;
    try { blob = buildResultsPdf(S); } catch (e) {
      setStatus(window.jspdf ? "Could not build the PDF. Copy the results as text instead." : "The PDF tool did not load. Check your connection and reload, or copy the results as text.");
      return;
    }
    saving = true;
    if (b) b.disabled = true;
    setStatus(SITE ? "" : "Confirm the save in the prompt.");
    var d = new Date();
    var stamp = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    downloads.save({ filename: "bc-vote-helper-results-" + stamp + ".pdf", data: blob }).then(function (res) {
      setStatus(res && res.status === "delivered" ? "" : "PDF saved. Check your downloads.");
    }, function (err) {
      var code = err && err.code;
      if (code === "declined") setStatus("Save cancelled. Nothing was saved.");
      else if (code === "rate_limited") setStatus("A save prompt is already open, or there were several in a row. Wait a moment, then try again.");
      else if (code === "too_large") setStatus("The PDF is too large to save here. Copy the results as text instead.");
      else if (code === "bad_request" || code === "transform_error" || code === "rejected_extension") setStatus("The PDF could not be saved because of a problem in this page. Copy the results as text instead.");
      else if (code === "extension_not_enabled") setStatus("PDF files cannot be saved in this view. Copy the results as text instead.");
      else { downloadsState = "none"; setStatus("Saving files is not available in this view. Copy the results as text instead."); updatePdfUi(); }
    }).then(function () { saving = false; var bb = el("pdf-btn"); if (bb) bb.disabled = false; });
  }

  /* ------------------------------------------------------------------ */
  /* Anonymous totals (website only, opt-out on the start screen)        */
  /* ------------------------------------------------------------------ */
  function submitResponses() {
    if (!COLLECT || !S.share) return;
    var people = [];
    for (var i = 0; i < S.count; i++) {
      var p = S.people[i], ans = {};
      QUESTIONS.forEach(function (q) {
        var a = p.answers[q.id];
        if (a && a.choice) ans[q.id] = { c: a.choice, w: a.importance || "medium" };
      });
      people.push({ level: p.level, answers: ans });
    }
    var body = JSON.stringify({ v: 1, sid: S.sid, data_as_of: SPEC.meta.data_as_of, count: S.count, riding: S.riding || null, people: people });
    var key = String(hashStr(body));
    if (S.sentKey === key) return;
    try {
      fetch("/api/response", { method: "POST", headers: { "Content-Type": "application/json" }, body: body, keepalive: true })
        .then(function (r) { if (r.ok) { S.sentKey = key; save(); } }, function () { /* offline: totals are optional */ });
    } catch (e) { /* fetch unavailable */ }
  }

  /* ------------------------------------------------------------------ */
  /* Start over (in-page confirmation)                                   */
  /* ------------------------------------------------------------------ */
  function confirmReset() {
    var root = el("overlay-root");
    var opener = document.activeElement;
    root.innerHTML = '<div class="overlay" id="reset-overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="reset-title" aria-describedby="reset-desc">' +
      '<h2 class="h3" id="reset-title">Clear all answers and start over?</h2>' +
      '<p id="reset-desc">This removes everyone\'s names, reading levels and answers from this device and goes back to the start screen. It cannot be undone.</p>' +
      '<div class="row"><button type="button" class="btn btn-primary" id="reset-yes">Clear all and restart</button><button type="button" class="btn" id="reset-no">Keep my answers</button></div></div></div>';
    var yes = el("reset-yes"), no = el("reset-no"), ov = el("reset-overlay");
    function close() { root.innerHTML = ""; document.removeEventListener("keydown", onKey, true); if (opener && opener.focus && document.body.contains(opener)) opener.focus(); }
    function onKey(e) {
      if (e.key === "Escape") { e.preventDefault(); close(); }
      if (e.key === "Tab") {
        var f = [yes, no];
        var idx = f.indexOf(document.activeElement);
        e.preventDefault();
        f[(idx + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
      }
    }
    document.addEventListener("keydown", onKey, true);
    ov.addEventListener("click", function (e) { if (e.target === ov) close(); });
    no.addEventListener("click", close);
    yes.addEventListener("click", function () {
      root.innerHTML = "";
      document.removeEventListener("keydown", onKey, true);
      lsClear();
      S = freshState();
      applyRiding(null);
      ridingUi = { open: false, alts: [], choices: [], busy: false, status: "" };
      foldState = {};
      lvlFoldOpen = false;
      tgCtxOpen = false;
      render("setup-title");
      scrollTop();
    });
    no.focus();
  }
  el("foot-reset").addEventListener("click", confirmReset);
  el("mast-reset").addEventListener("click", confirmReset);

  /* ------------------------------------------------------------------ */
  /* Router                                                              */
  /* ------------------------------------------------------------------ */
  function render(focusId) {
    var mast = el("top");
    if (mast) mast.classList.toggle("compact", S.phase !== "setup");
    document.documentElement.classList.toggle("quiz-mode", S.phase === "quiz" || S.phase === "together");
    var mr = el("mast-reset");
    if (mr) mr.hidden = S.phase === "setup";
    if (S.phase === "quiz") renderQuiz();
    else if (S.phase === "handoff") renderHandoff();
    else if (S.phase === "together") renderTogether();
    else if (S.phase === "results") renderResults();
    else renderSetup();
    if (focusId) { scrollTop(); focusHeading(focusId); }
  }
  render(null);

  /* Public, testable surface */
  window.BCVH = {
    spec: SPEC,
    weights: WEIGHTS,
    pick: pick,
    scoreParties: scoreParties,
    scoreLocal: scoreLocal,
    contributions: contributions,
    familyScores: familyScores,
    rankMap: rankMap,
    closeGroup: closeGroup,
    logoFit: logoFit,
    expText: expText,
    applyRiding: function (code) { applyRiding(code); },
    questionsFor: function (code) { return questionsFor(code).map(function (q) { return q.id; }); },
    parseRepresent: parseRepresent,
    normPostal: normPostal,
    drivers: drivers,
    alignedParties: alignedParties,
    agreement: agreement,
    shuffleOrder: shuffleOrder,
    computeResults: function (st) { return computeResults(st || S); },
    resultsText: function (st) { return resultsText(st || S); },
    buildResultsPdf: buildResultsPdf,
    getState: function () { return JSON.parse(JSON.stringify(S)); },
    setState: function (st) { var s = sanitizeState(st); if (s) { S = s; applyRiding(S.riding); save(); render(null); } return !!s; },
    render: function () { render(null); }
  };
})();
</script>
