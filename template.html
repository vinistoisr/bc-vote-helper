<title>BC Vote Helper 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Atkinson+Hyperlegible+Mono:wght@400..700&amp;family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&amp;display=swap">
<style>
/* Layout: one ballot-sheet column on coastal fog (quiz 760px, results 1080px). Chrome is ink on paper with no party hue; party colours appear only to identify parties in results. */
:root {
  --bg: #ECEFEE;
  --surface: #FFFFFF;
  --surface-2: #F5F7F6;
  --ink: #121A1F;
  --ink-2: #4A5661;
  --line: #C7CFD2;
  --line-strong: #85929A;
  --wash: #DCE4E6;
  --sea: #2B6E7E;
  --ridge-far: #CBD7DB;
  --ridge-mid: #A7B9BF;
  --ridge-near: #7D939B;
  --snow: #F7F9F9;
  --on-ink: #FFFFFF;
  --plate: #FFFFFF;
  --plate-line: #D3D9DB;
  --track: #DFE5E7;
  --pip-off: #D2D9DC;
  --shadow: 0 1px 2px rgba(18, 26, 31, 0.06), 0 8px 24px rgba(18, 26, 31, 0.07);
  --scrim: rgba(18, 26, 31, 0.55);
  --p-liberal: #8D989F;

  /* --f-script: system fonts for the page language's script (set per <html lang> below); the self-hosted fonts are Latin only */
  --f-script: system-ui;
  --f-display: "Archivo", "Helvetica Neue", Arial, var(--f-script), sans-serif;
  --f-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", var(--f-script), system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Atkinson Hyperlegible Mono", ui-monospace, "Cascadia Mono", Consolas, var(--f-script), monospace;

  --t-xs: 0.8125rem;
  --t-s: 0.9375rem;
  --t-m: 1.125rem;
  --t-l: 1.375rem;
  --t-xl: clamp(1.5rem, 1.2rem + 1.4vw, 2.125rem);
  --t-xxl: clamp(2rem, 1.4rem + 2.6vw, 3.25rem);

  --r-s: 10px;
  --r-m: 16px;
  --r-l: 22px;
  --gutter: max(16px, 3.5vw);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1215;
    --surface: #151C20;
    --surface-2: #1A2227;
    --ink: #E8EDEF;
    --ink-2: #A3AFB6;
    --line: #2C373E;
    --line-strong: #5D6C75;
    --wash: #22303A;
    --sea: #6DB7C7;
    --ridge-far: #1C262C;
    --ridge-mid: #253239;
    --ridge-near: #31414A;
    --snow: #C9D3D7;
    --on-ink: #0D1215;
    --plate: #FFFFFF;
    --plate-line: #FFFFFF;
    --track: #26323A;
    --pip-off: #33424B;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    --scrim: rgba(0, 0, 0, 0.6);
    --p-liberal: #9AA6AD;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1215;
  --surface: #151C20;
  --surface-2: #1A2227;
  --ink: #E8EDEF;
  --ink-2: #A3AFB6;
  --line: #2C373E;
  --line-strong: #5D6C75;
  --wash: #22303A;
  --sea: #6DB7C7;
  --ridge-far: #1C262C;
  --ridge-mid: #253239;
  --ridge-near: #31414A;
  --snow: #C9D3D7;
  --on-ink: #0D1215;
  --plate: #FFFFFF;
  --plate-line: #FFFFFF;
  --track: #26323A;
  --pip-off: #33424B;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  --scrim: rgba(0, 0, 0, 0.6);
  --p-liberal: #9AA6AD;
  color-scheme: dark;
}

/* Other scripts: Gurmukhi and Chinese use system fonts and need more line height; Cyrillic falls back to the system sans */
html[lang="pa"] { --f-script: "Noto Sans Gurmukhi", "Nirmala UI", Raavi, "Gurmukhi Sangam MN", "Gurmukhi MN", "Mukta Mahee"; }
html[lang="zh-Hans"] { --f-script: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Noto Sans CJK SC", "Source Han Sans SC"; }
html[lang="zh-Hant"] { --f-script: "PingFang HK", "PingFang TC", "Microsoft JhengHei", "Noto Sans HK", "Noto Sans TC", "Noto Sans CJK TC"; }
html[lang="ru"] { --f-script: "Segoe UI", Roboto, "Helvetica Neue", Arial; }
html[lang="ko"] { --f-script: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR"; }
html[lang="fa"] { --f-script: "Segoe UI", -apple-system, "SF Arabic", "Noto Sans Arabic", "Noto Naskh Arabic", "Vazirmatn", Tahoma, "Geeza Pro"; }
/* Arial has Arabic letters on Windows, so Farsi headings would mix Arial and Segoe UI: the script font comes first after Archivo */
html[lang="fa"] { --f-display: "Archivo", var(--f-script), sans-serif; }
/* Labels set in the monospace font: Latin-only monospace fonts give these scripts very wide word spaces, so they use the body font */
html[lang="pa"], html[lang^="zh"], html[lang="ko"], html[lang="fa"] { --f-mono: var(--f-body); }
html[lang^="zh"] body { line-break: strict; }
html[lang="ko"] body { line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere; }
html[lang="fa"] body { line-height: 1.8; }
html[lang="fa"] :is(h1, h2, h3, h4, .prompt, .prompt.long, .lvl-name, .riding-name, .mode-t, .tg-lvl-now, .bar-label, .who, .sum-title, .hl-unit, .opt-text, .tg-text) { line-height: 1.5; }
/* Right to left (Farsi): logical properties mirror most of the layout; these are the physical leftovers */
[dir="rtl"] .range::-webkit-slider-runnable-track { background: linear-gradient(to left, var(--ink) 0 var(--fill, 50%), var(--track) var(--fill, 50%) 100%); }
[dir="rtl"] .stackbar span { box-shadow: inset 1px 0 0 var(--surface); }
/* Names, party abbreviations and scores keep their own direction inside translated sentences */
:is(bdi, .who-n, .tg-chip, .pick-chip, .pos-name, .th-name, .drv-who, .hl-pct, .bar-pct, .bar-pct2, .pips-n, .cand-name, .hl-name, .riding-name, .nowrap) { unicode-bidi: isolate; }
.pc { direction: ltr; }
[dir="rtl"] .pc { text-align: right; }
html[lang="pa"] body { line-height: 1.75; }
html[lang^="zh"] body { line-height: 1.7; }
html[lang="pa"] :is(h1, h2, h3, h4, .prompt, .prompt.long, .lvl-name, .riding-name, .mode-t, .tg-lvl-now, .bar-label, .who, .sum-title, .hl-unit, .tg-text, .opt-text, .chip, .tag, .btn) { line-height: 1.5; }
html[lang^="zh"] :is(h1, h2, h3, h4, .prompt, .prompt.long, .lvl-name, .riding-name, .mode-t, .tg-lvl-now, .hl-unit) { line-height: 1.35; }
html[lang="pa"] .opt:has(input:checked) .opt-text::after, html[lang^="zh"] .opt:has(input:checked) .opt-text::after { line-height: 1.4; }
/* Letter spacing breaks up Gurmukhi and Chinese; uppercase does nothing there */
html[lang="pa"] body *, html[lang^="zh"] body *, html[lang="fa"] body *, html[lang="ko"] body * { letter-spacing: normal !important; }
/* Translated labels can be longer than the English: let the small radio labels wrap instead of pushing the row wider */
html:not([lang^="en"]) .tg-r label { white-space: normal; overflow-wrap: anywhere; line-height: 1.15; text-align: center; }
/* First visit in another language: the text stays hidden until that language is applied (a script before the masthead sets the class; 2.5 s at most) */
html.lang-wait .mast-in, html.lang-wait #lang-note, html.lang-wait #app, html.lang-wait footer.foot { visibility: hidden; }
/* Offer of the browser's language on an English page: globe and the language's own name */
.lang-offer { display: inline-flex; align-items: center; gap: 6px; }
.lang-offer svg { width: 16px; height: 16px; flex: none; }
.lang-offer span { text-decoration: underline; text-underline-offset: 3px; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
.share-opt { display: flex; gap: 10px; align-items: flex-start; font-size: var(--t-s); color: var(--ink-2); cursor: pointer; }
.share-opt input { width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: var(--ink); }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--t-m);
  line-height: 1.55;
  margin: 0;
  overflow-x: hidden;
}
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.12; margin: 0; text-wrap: balance; font-weight: 800; }
p { margin: 0; }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.page { padding-inline: var(--gutter); }
.wrap { max-width: 1080px; margin-inline: auto; }
.narrow { max-width: 760px; margin-inline: auto; }

/* Masthead */
.mast { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.mast canvas { position: absolute; inset: auto 0 0 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.mast-in { position: relative; padding-block: 28px 30px; display: grid; gap: 10px; }
.kicker { font-family: var(--f-mono); font-size: var(--t-xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.mast-title { font-size: var(--t-xxl); font-stretch: 118%; font-weight: 900; letter-spacing: -0.01em; }
.mast-title .yr { font-weight: 500; font-stretch: 100%; }
.mast-meta { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; font-size: var(--t-s); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1.5px solid var(--ink); font-weight: 700; font-size: var(--t-s); background: var(--surface); }
.chip-soft { border-color: var(--line); font-weight: 600; }
.reset-chip { cursor: pointer; min-height: 36px; padding: 4px 14px; }
.reset-chip:hover { background: var(--wash); }
.mast.compact .reset-chip { min-height: 36px; padding: 4px 12px; font-size: var(--t-s); }
/* Language picker: a chip holding a native <select>, first in the masthead row on every screen */
.chip.lang-chip { position: relative; padding: 0; min-height: 36px; cursor: pointer; }
.lang-chip:hover { background: var(--wash); }
.lang-chip:focus-within { outline: 3px solid var(--ink); outline-offset: 3px; }
.lang-chip .lang-globe { position: absolute; inset-inline-start: 10px; top: 50%; width: 16px; height: 16px; margin-top: -8px; pointer-events: none; }
.lang-chip .lang-caret { position: absolute; inset-inline-end: 10px; top: 50%; width: 10px; height: 10px; margin-top: -5px; pointer-events: none; }
.lang-chip select { -webkit-appearance: none; appearance: none; border: 0; background: transparent; font: inherit; font-weight: 700; color: inherit; height: 33px; line-height: 1.2; max-width: 13em; padding-block: 0; padding-inline: 32px 28px; border-radius: 999px; cursor: pointer; text-overflow: ellipsis; }
.lang-chip select:focus-visible { outline: none; }
.lang-chip option { color: #121A1F; background: #FFFFFF; }
.mast.compact .chip.lang-chip { font-size: var(--t-xs); padding: 0; }
.mast.compact .lang-chip select { height: 33px; }
/* One line under the masthead in translated views */
.lang-note-bar { background: var(--surface); border-bottom: 1px solid var(--line); }
.lang-note { padding-block: 8px; font-size: var(--t-s); color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.lang-note .linkbtn { color: var(--ink); min-height: 32px; }
@media (max-width: 480px) {
  .mast canvas { opacity: 0.6; }
  .mast-meta { gap: 6px; }
  #countdown { flex-basis: 100%; border: 0; background: none; padding: 0; color: var(--ink-2); font-weight: 600; }
}
/* Compact masthead outside setup, so results and questions start near the top */
.mast.compact .mast-in { padding-block: 12px 14px; gap: 6px; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 16px; }
.mast.compact .mast-title { font-size: 1.5rem; }
.mast.compact .kicker, .mast.compact #countdown { display: none; }
.mast.compact .mast-meta { justify-content: flex-end; }
.mast.compact .chip { font-size: var(--t-xs); padding: 2px 9px; }
.mast.compact canvas { opacity: 0.45; }
@media (max-width: 560px) {
  .mast.compact .mast-in { grid-template-columns: 1fr; padding-block: 10px 12px; gap: 4px; }
  .mast.compact .mast-title { font-size: 1.375rem; }
  .mast.compact .mast-meta { justify-content: flex-start; }
  .mast.compact .chip-soft { display: none; }
}

main { padding-block: 28px 56px; }
section + section { margin-top: 0; }
.stack { display: grid; gap: 20px; }
.stack-s { display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: clamp(18px, 3vw, 28px); }
.lede { font-size: var(--t-m); max-width: 62ch; }
.muted { color: var(--ink-2); }
.small { font-size: var(--t-s); }
.xs { font-size: var(--t-xs); }
.nowrap { white-space: nowrap; }
.eyebrow { font-family: var(--f-mono); font-size: var(--t-xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.h2 { font-size: var(--t-xl); font-stretch: 112%; }
.h3 { font-size: var(--t-l); font-stretch: 106%; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 22px; border-radius: 999px; border: 2px solid var(--ink); background: var(--surface); color: var(--ink); font-weight: 700; font-size: var(--t-m); cursor: pointer; text-decoration: none; transition: transform 0.12s ease, background-color 0.15s ease; max-width: 100%; min-width: 0; overflow-wrap: anywhere; text-align: center; }
.btn:hover { background: var(--wash); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--ink); color: var(--on-ink); }
.btn-primary:hover { background: var(--ink); opacity: 0.9; }
.btn-quiet { border-color: transparent; background: transparent; text-decoration: underline; text-underline-offset: 4px; min-height: 44px; padding-inline: 10px; }
.btn-quiet:hover { background: var(--wash); }
.btn-s { min-height: 44px; padding: 8px 16px; font-size: var(--t-s); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.row-between { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }

/* Setup */
.how-line { font-weight: 600; max-width: 62ch; }
.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; border: 0; padding: 0; margin: 0; min-width: 0; }
.seg legend { padding: 0; margin-bottom: 10px; font-weight: 700; font-size: var(--t-m); }
.seg-opt { position: relative; }
.seg-opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg-opt label { display: grid; place-items: center; gap: 0; min-height: 84px; border: 2px solid var(--line-strong); border-radius: var(--r-m); background: var(--surface); cursor: pointer; text-align: center; padding: 8px 4px; transition: background-color 0.15s ease; }
.seg-opt label:hover { background: var(--wash); }
.seg-opt .big { font-family: var(--f-display); font-weight: 900; font-stretch: 120%; font-size: 2rem; line-height: 1; }
.seg-opt .sub { font-size: var(--t-xs); color: var(--ink-2); }
.seg-opt input:checked + label { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.seg-opt input:checked + label .sub { color: var(--on-ink); }
.seg-opt input:focus-visible + label { outline: 3px solid var(--ink); outline-offset: 3px; }

.people { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.person { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.person-head { display: flex; gap: 12px; align-items: center; }
.pnum { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--on-ink); font-family: var(--f-display); font-weight: 900; font-size: 1.15rem; }
.field { display: grid; gap: 6px; min-width: 0; flex: 1; }
.field label { font-weight: 700; font-size: var(--t-s); }
.input { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: var(--r-s); border: 2px solid var(--line-strong); background: var(--surface); font-size: var(--t-m); }
.input:focus-visible { outline-offset: 1px; }

.lvl { display: grid; gap: 8px; }
.lvl-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; align-items: baseline; }
.lvl-top label { font-weight: 700; font-size: var(--t-s); }
.lvl-name { font-family: var(--f-display); font-weight: 800; font-stretch: 108%; font-size: var(--t-l); line-height: 1.1; }
.lvl-ages { font-size: var(--t-s); color: var(--ink-2); }
.range { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; cursor: pointer; margin: 0; }
.range::-webkit-slider-runnable-track { height: 10px; border-radius: 999px; background: linear-gradient(to right, var(--ink) 0 var(--fill, 50%), var(--track) var(--fill, 50%) 100%); }
.range::-moz-range-track { height: 10px; border-radius: 999px; background: var(--track); }
.range::-moz-range-progress { height: 10px; border-radius: 999px; background: var(--ink); }
.range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 32px; height: 32px; border-radius: 50%; background: var(--surface); border: 4px solid var(--ink); margin-top: -11px; box-shadow: var(--shadow); }
.range::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 4px solid var(--ink); }
.range:focus-visible { outline: none; }
.range:focus-visible::-webkit-slider-thumb { outline: 3px solid var(--ink); outline-offset: 3px; }
.range:focus-visible::-moz-range-thumb { outline: 3px solid var(--ink); outline-offset: 3px; }
.ticks { display: flex; justify-content: space-between; padding-inline: 12px; font-family: var(--f-mono); font-size: var(--t-xs); color: var(--ink-2); margin-top: -6px; }
.ticks span { width: 8px; text-align: center; display: flex; justify-content: center; }
.sample { background: var(--surface-2); border: 1px dashed var(--line-strong); border-radius: var(--r-m); padding: 12px 14px; display: grid; gap: 4px; }
.sample-q { font-weight: 700; }
/* Riding picker (setup) */
.riding-box { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; min-width: 0; }
.riding-h { font-weight: 700; font-size: var(--t-m); padding: 0; margin: 0 0 2px; }
.riding-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.riding-row .field { flex: 0 1 220px; min-width: 150px; }
.riding-box > .field { max-width: 460px; }
.riding-go { min-height: 48px; }
.pc { text-transform: uppercase; font-family: var(--f-mono); letter-spacing: 0.06em; }
.pc::placeholder { letter-spacing: 0.06em; }
select.input { cursor: pointer; max-width: 100%; }
.riding-found { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 12px 16px; border: 2px solid var(--ink); border-radius: var(--r-m); background: var(--surface); }
.riding-found > div { min-width: 0; }
.riding-name { font-family: var(--f-display); font-weight: 800; font-stretch: 106%; font-size: var(--t-l); line-height: 1.15; overflow-wrap: anywhere; }
.riding-box .status:empty { display: none; }
.linkbtn { background: none; border: 0; padding: 0; min-height: 32px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.lvl-exp { font-family: var(--f-body); font-weight: 500; font-stretch: 100%; color: var(--ink-2); margin-inline-start: 6px; font-size: var(--t-xs); }

/* Quiz */
.quiz-top { display: grid; gap: 12px; margin-bottom: 18px; }
.wholine { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.wholine > * { min-width: 0; }
.who { font-family: var(--f-display); font-weight: 800; font-stretch: 110%; font-size: var(--t-l); overflow-wrap: anywhere; }
.pcard-name, .res-title, .big-name, .hl-name, .pick-who, .cand-name, .drv-who, .who-strip li, .agree th, .close-tbl thead th { overflow-wrap: anywhere; }
.ticks16 { display: grid; grid-template-columns: repeat(var(--n, 16), minmax(0, 1fr)); gap: 4px; }
.ticks16 span { height: 8px; border-radius: 999px; background: var(--track); }
.ticks16 span.done { background: var(--ink); }
.ticks16 span.skip { background: var(--line-strong); }
.ticks16 span.now { background: var(--sea); outline: 2px solid var(--sea); outline-offset: 1px; }
.qcount { font-family: var(--f-mono); font-size: var(--t-s); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.lvl-inline { display: grid; grid-template-columns: auto minmax(120px, 220px); gap: 4px 12px; align-items: center; justify-content: end; }
.lvl-inline label { font-size: var(--t-s); font-weight: 700; }
.lvl-inline .range { height: 44px; }
.lvl-inline .lvl-now { grid-column: 1 / -1; text-align: end; font-size: var(--t-xs); color: var(--ink-2); }

/* Family list: all-members bar and number, with the adults-only mean as a second number column */

}

.history { display: grid; gap: 14px; }

.hist-year { font-family: var(--f-mono); font-weight: 700; font-size: var(--t-m); padding-top: 2px; }
.stackbar { display: flex; height: 26px; border-radius: 8px; overflow: hidden; background: var(--track); }
.stackbar span { display: block; height: 100%; background: var(--pf); box-shadow: inset -1px 0 0 var(--surface); }
.hist-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--t-xs); margin-top: 6px; }
.hist-legend span { display: inline-flex; align-items: center; gap: 6px; }
.hist-legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--pf); display: block; }

.cands { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.cand { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 16px 18px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.cand-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; }
.cand-name { font-size: var(--t-l); font-stretch: 106%; }
.cand-other { background: var(--surface-2); border-style: dashed; }
.hl-empty { border-style: dashed; background: var(--surface-2); }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; margin: 0; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.fact dt { font-family: var(--f-mono); font-size: var(--t-xs); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.fact dd { margin: 0; }
.prose { display: grid; gap: 12px; max-width: 72ch; }
.links { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: var(--t-s); }
.srclist { margin: 0; padding-inline-start: 1.4em; display: grid; gap: 6px; font-size: var(--t-s); }
.srclist .muted { font-size: var(--t-xs); }
.notice { padding: 12px 14px; border-radius: var(--r-s); background: var(--surface-2); border: 1px solid var(--line-strong); font-size: var(--t-s); }
.share { display: grid; gap: 12px; }
.status { min-height: 1.5em; font-size: var(--t-s); font-weight: 700; }
.party-list { display: grid; gap: 12px; }
.party-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 14px 16px; display: grid; gap: 8px; }
.party-item-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
details.more > summary { cursor: pointer; font-weight: 700; min-height: 40px; display: inline-flex; align-items: center; }
/* Long reference sections fold on phones (open by default on wider screens) */
details.fold { display: block; }
details.fold > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; border-radius: var(--r-m); }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > .fold-body { display: grid; gap: 18px; margin-top: 18px; }
details.fold[open] .sum-toggle .plus { display: none; }
details.fold:not([open]) .sum-toggle .minus { display: none; }
details.fold:not([open]) > summary { padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.copybox { width: 100%; min-height: 160px; font-family: var(--f-mono); font-size: var(--t-xs); border-radius: var(--r-s); border: 1.5px solid var(--line-strong); background: var(--surface); padding: 10px; }

footer.foot { border-top: 1px solid var(--line); padding-block: 22px 40px; color: var(--ink-2); font-size: var(--t-s); }
.foot-in { display: flex; flex-wrap: wrap; gap: 10px 20px; justify-content: space-between; align-items: center; }
.foot-links { flex-basis: 100%; margin: 0; }
.foot-links a { color: var(--ink-2); }

/* Confirm dialog */
.overlay { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 50; }
.dialog { background: var(--surface); border-radius: var(--r-l); padding: 24px; max-width: 460px; width: 100%; display: grid; gap: 14px; box-shadow: var(--shadow); border: 1px solid var(--line); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }

      '<p class="qcount">' + esc(tn("tg_count", S.count)) + "</p>" +
      '<div class="ticks16" style="--n:' + N + '" aria-hidden="true">' + ticks + "</div>" +
      '<div class="lvl-c tg-lvl"><label for="tg-level">' + esc(t("reading_level")) + "</label>" +
      '<input class="range" type="range" id="tg-level" min="1" max="5" step="1" value="' + L + '" aria-valuetext="' + esc(levelLong(lvl)) + '">' +
      '<span class="lvl-now" id="tg-level-now">' + lvlNow(lvl) + "</span></div>" +
      "</div>" +
      '<div class="qcard tg-q">' +
      '<p class="eyebrow"><span id="tg-issue">' + esc(issueLabel(q, L)) + "</span>" + localTag(q) + "</p>" +
      '<h2 class="prompt' + (longPrompt(pick(q.prompt, L)) ? " long" : "") + '" id="q-title" tabindex="-1">' + esc(pick(q.prompt, L)) + "</h2>" +
      (ctx ? '<details class="bg" id="tg-bg"' + (tgCtxOpen ? " open" : "") + "><summary>" + esc(t("background")) + '</summary><p class="context" id="tg-ctx">' + esc(ctx) + "</p></details>" : "") +
      '<ol class="tg-opts" aria-label="' + esc(t("tg_answers_label")) + '">' + opts + "</ol>" +
      "</div>" +
      '<div class="tg-people"><p class="tg-people-h" id="tg-people-h">' + esc(peopleHead(kid)) + "</p>" + rows + "</div>" +
      '<div class="quiz-nav"><button type="button" class="btn" id="back-btn">' + esc(t("back")) + "</button>" +
      '<button type="button" class="btn btn-primary" id="next-btn">' + esc(t(isLast ? "see_results" : "next")) + "</button></div>" +
      "</section>";

    /* Show who picked each answer, right under it */
    function paintPicks() {
      order.forEach(function (oid) {
        var who = [];
        ppl.forEach(function (p, i) { var a = p.answers[q.id]; if (a && a.choice === oid) who.push(nameOf(S, i)); });
        el("tg-who-" + oid).innerHTML = who.map(function (n) { return '<span class="tg-chip">' + esc(n) + "</span>"; }).join("");
        el("tg-opt-" + oid).classList.toggle("picked", who.length > 0);
      });
    }
    /* Reword the question in place, so the slider keeps focus while it moves */
    function paintText(lv) {
      var k2 = isKid(lv);
      var pr = el("q-title");
      pr.textContent = pick(q.prompt, lv);
      pr.classList.toggle("long", longPrompt(pick(q.prompt, lv)));
      el("tg-issue").textContent = issueLabel(q, lv);
      var c = el("tg-ctx");
      if (c) c.textContent = pick(q.context, lv);
      order.forEach(function (oid) { el("tg-txt-" + oid).textContent = pick(optionOf(q, oid).text, lv); });
      var labs = impLabels(lv);
      app.querySelectorAll(".tg-imp-t").forEach(function (s2) { s2.textContent = labs[s2.getAttribute("data-k")]; });
      app.querySelectorAll(".tg-skip-l").forEach(function (s2) { s2.textContent = t(k2 ? "tg_skip_kid" : "skip"); });
      app.querySelectorAll(".tg-imp-l").forEach(function (s2) { s2.textContent = t(k2 ? "tg_imp_short_kid" : "tg_imp_short"); });
      el("tg-people-h").textContent = peopleHead(k2);
      app.querySelector("section.tg").setAttribute("data-level", lv);
    }
    paintPicks();
    var bg = el("tg-bg");
    if (bg) bg.addEventListener("toggle", function () { tgCtxOpen = bg.open; });
    var rg = el("tg-level");
    rangeFill(rg);
    fitLvlNow("tg-level-now");
    rg.addEventListener("input", function () {
      var lv = Number(rg.value);
      var info = levelInfo(lv);
      S.groupLevel = lv;
      el("tg-level-now").innerHTML = lvlNow(info);
      rg.setAttribute("aria-valuetext", levelLong(info));
      rangeFill(rg);
      paintText(lv);
      save();
    });
    app.querySelectorAll('.tg-pick input[type="radio"]').forEach(function (r) {
      r.addEventListener("change", function () {
        var p = S.people[Number(r.getAttribute("data-i"))];
        setAnswer(p, q, { choice: r.value }, order);
        save(); paintPicks();
      });
    });
    app.querySelectorAll('.tg-imp input[type="radio"]').forEach(function (r) {
      r.addEventListener("change", function () {
        var p = S.people[Number(r.getAttribute("data-i"))];
        var cur = p.answers[q.id];
        setAnswer(p, q, { importance: r.value, choice: cur ? cur.choice : null }, order);
        save();
      });
    });
    el("back-btn").addEventListener("click", function () {
      if (S.qi > 0) { S.qi -= 1; save(); render("q-title"); return; }
      S.phase = "setup"; save(); render("setup-title");
    });
    el("next-btn").addEventListener("click", function () {
      /* Anyone who did not pick counts as a skip, same as one at a time */
      ppl.forEach(function (p) { if (!p.answers[q.id] || !p.answers[q.id].choice) setAnswer(p, q, { choice: "skip" }, order); });
      if (!isLast) { S.qi += 1; save(); render("q-title"); return; }
      ppl.forEach(function (p) { p.done = true; });
      S.phase = "results"; S.finishedAt = new Date().toISOString(); S.resultsLevel = null; save(); render("res-title");
      submitResponses();
    });
  }

  /* ------------------------------------------------------------------ */
  /* Rendering: hand-off                                                 */
  /* ------------------------------------------------------------------ */
  function renderHandoff() {
    var i = S.cur, p = S.people[i], prev = nameOf(S, i - 1), name = nameOf(S, i);
    var L = levelInfo(p.level);
    var prevAnswered = answeredCount(S.people[i - 1]);
    app.className = "narrow";
    app.innerHTML =
      '<section class="card handoff" aria-labelledby="handoff-title">' +
      '<p class="eyebrow">' + esc(t("handoff_person_of", { n: i + 1, total: S.count })) + "</p>" +
      '<h2 class="handoff-title" id="handoff-title" tabindex="-1"><span class="handoff-pass">' + esc(t("handoff_pass")) + '</span> <span class="big-name">' + esc(name) + "</span></h2>" +
      '<p class="done-row"><svg viewBox="0 0 26 26" aria-hidden="true"><rect x="1.5" y="1.5" width="23" height="23" rx="6" fill="currentColor"></rect><path d="M7 13.5 L11 17.5 L19 8.5" fill="none" stroke="var(--on-ink)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>' + esc(t("handoff_done", { name: prev, n: prevAnswered, total: QUESTIONS.length })) + "</span></p>" +
      '<div class="shield"><svg viewBox="0 0 56 56" aria-hidden="true"><rect x="6" y="10" width="44" height="36" rx="6" fill="none" stroke="currentColor" stroke-width="3"></rect><path d="M6 20 H50" stroke="currentColor" stroke-width="3"></path><path d="M18 33 L38 33" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path></svg>' +
      "<p>" + esc(t("handoff_hidden", { name: prev })) + "</p></div>" +
      '<div class="lvl"><div class="lvl-top"><label for="handoff-level">' + esc(t("handoff_level", { name: name })) + "</label></div>" +
      '<p class="lvl-name" id="handoff-level-name">' + esc(L.label) + ' <span class="lvl-ages">' + esc(expText(L)) + "</span></p>" +
      '<input class="range" type="range" id="handoff-level" min="1" max="5" step="1" value="' + p.level + '" aria-valuetext="' + esc(levelLong(L)) + '">' +
      '<div class="ticks" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div></div>' +
      '<div class="row"><button type="button" class="btn btn-primary" id="handoff-go">' + esc(t("handoff_start", { name: name })) + "</button></div>" +
      "</section>";
    var r = el("handoff-level");
    rangeFill(r);
    r.addEventListener("input", function () {
      p.level = Number(r.value);
      var info = levelInfo(p.level);
      el("handoff-level-name").innerHTML = esc(info.label) + ' <span class="lvl-ages">' + esc(expText(info)) + "</span>";
      r.setAttribute("aria-valuetext", levelLong(info));
      rangeFill(r);
      save();
    });
    el("handoff-go").addEventListener("click", function () { S.phase = "quiz"; S.qi = 0; save(); render("q-title"); });
  }

  /* ------------------------------------------------------------------ */
  /* Rendering: results                                                  */
  /* ------------------------------------------------------------------ */
  /** scoredNote(n, answered, kid): "scored on 13 of your 16 answers" when a party has no published position on some. */
  function scoredNote(n, answered, kid, sentence) {
    if (n == null || !answered || n >= answered) return "";
    var v = { n: n, total: answered };
    if (sentence) return t(kid ? "hl_scored_kid" : "hl_scored", v);
    return t(kid ? "scored_note_kid" : "scored_note", v);
  }
  function barLabel(id, isCand) {
    var pid = isCand ? CBY[id].party_id : id;
    var p = PBY[pid];
    return isCand ? esc(CBY[id].name) + ' <span class="muted">' + esc(CBY[id].incumbent ? t("party_incumbent", { party: p.short_name }) : p.short_name) + "</span>" : esc(p.short_name) + ' <span class="muted">' + esc(p.leader) + "</span>";
  }
  function barRow(id, pct, isCand, note) {
    var pid = isCand ? CBY[id].party_id : id;
    var p = PBY[pid];
    var w = pct == null ? 0 : Math.max(0, Math.min(100, pct));
    return '<div class="bar-row' + (pct == null ? " na" : "") + '" style="' + partyVars(pid) + '">' + plate(pid, "s") +
      '<div class="bar-main"><span class="bar-label">' + barLabel(id, isCand) + "</span>" +
      '<div class="bar-track" role="img" aria-label="' + esc(pct == null ? t("bar_aria_none", { name: isCand ? CBY[id].name : p.short_name }) : t("bar_aria", { name: isCand ? CBY[id].name : p.short_name, pct: Math.round(pct) })) + '"><div class="bar-fill" style="width:' + w.toFixed(1) + '%"></div></div>' +
      (note ? '<span class="bar-note">' + esc(note) + "</span>" : "") + "</div>" +
      '<span class="bar-pct">' + (pct == null ? esc(t("no_score")) : fmtPct(pct) + PCT()) + "</span></div>";
  }
  /** bars(ranked, isCand, member?, kid?): with a member, each row notes when a party was scored on fewer of their answers. */
  function bars(ranked, isCand, m, kid) {
    return '<div class="bars">' + ranked.map(function (r) {
      var pid = isCand ? CBY[r.id].party_id : r.id;
      return barRow(r.id, r.pct, isCand, m ? scoredNote(m.n[pid], m.answered, kid) : "");
    }).join("") + "</div>";
  }
  /** Family list: ordered by the all-members mean, with the adults-only mean beside it as a second labelled column. */
  function famBars(ranked, adultsMap, isCand, adultsCount) {
    var head = '<div class="bars-head" aria-hidden="true"><span></span><span>' + esc(t("fam_col_all")) + "</span><span>" + esc(t("fam_col_adults")) + "</span></div>";
    return '<div class="bars fam">' + head + ranked.map(function (r) {
      var pid = isCand ? CBY[r.id].party_id : r.id;
      var p = PBY[pid];
      var a = adultsMap ? adultsMap[r.id] : null;
      var w = r.pct == null ? 0 : Math.max(0, Math.min(100, r.pct));
      var nm = isCand ? CBY[r.id].name : p.short_name;
      return '<div class="bar-row' + (r.pct == null ? " na" : "") + '" style="' + partyVars(pid) + '">' + plate(pid, "s") +
        '<div class="bar-main"><span class="bar-label">' + barLabel(r.id, isCand) + "</span>" +
        '<div class="bar-track" role="img" aria-label="' + esc(r.pct == null ? t("fam_bar_aria_none", { name: nm }) : t("fam_bar_aria", { name: nm, pct: Math.round(r.pct) })) + '"><div class="bar-fill" style="width:' + w.toFixed(1) + '%"></div></div></div>' +
        '<span class="bar-pct"><span class="sr">' + esc(t("fam_sr_all")) + " </span>" + (r.pct == null ? "-" : fmtPct(r.pct) + PCT()) + "</span>" +
        '<span class="bar-pct2"><span class="sr">' + esc(t("fam_sr_adults")) + " </span>" + (!adultsCount || a == null ? "-" : fmtPct(a) + PCT()) + "</span></div>";
    }).join("") + "</div>";
  }

  /** "A and B", "A, B and C" (English as before; other languages use their own list style). */
  function joinAnd(list) {
    if (LANG !== "en") return listFmt(list);
    return list.length <= 2 ? list.join(" and ") : list.slice(0, -1).join(", ") + " and " + list[list.length - 1];
  }
  /** "A and B and C" (English as before). */
  function joinAndAll(list) { return LANG === "en" ? list.join(" and ") : listFmt(list); }
  function headlineCard(entry, isCand, group, level, place, next, opts) {
    opts = opts || {};
    var multi = group.length > 1;
    var pid = isCand ? CBY[entry.id].party_id : entry.id;
    var p = PBY[pid];
    var kid = isKid(level);
    var name = isCand ? CBY[entry.id].name : p.name;
    var sub = isCand ? (CBY[entry.id].incumbent ? t("party_incumbent_mla", { party: p.short_name }) : p.short_name) : t("leader_line", { leader: p.leader });
    var tied = multi && group.filter(function (g) { return Math.round(g.pct) === Math.round(entry.pct); }).length > 1 && Math.round(entry.pct) === Math.round(group[0].pct);
    var eyebrow = tied ? t(kid ? "hl_tied_kid" : "hl_tied") : multi ? t((kid ? "hl_close_kid_" : "hl_close_") + (place + 1)) : isCand ? t(kid ? "hl_closest_cand_kid" : "hl_closest_cand") : t(kid ? "hl_closest_party_kid" : "hl_closest_party");
    var nextLine = !multi && next && next.pct != null ? '<p class="hl-next">' + esc(t("hl_next", { name: isCand ? t("name_party", { name: CBY[next.id].name, party: PBY[CBY[next.id].party_id].short_name }) : PBY[next.id].short_name, pct: fmtPct(next.pct) })) + "</p>" : "";
    var note = opts.member ? scoredNote(opts.member.n[pid], opts.member.answered, kid, true) : "";
    var noteLine = note ? '<p class="hl-next">' + esc(note) + "</p>" : "";
    return '<article class="hl-card' + (isCand ? " hl-local" : "") + (opts.soft ? " soft" : "") + '" style="' + partyVars(pid) + '">' +
      '<div class="hl-band">' + plate(pid, isCand || multi || opts.soft ? "m" : "") + '<p class="hl-pct">' + fmtPct(entry.pct) + '<small>' + PCT() + '</small><span class="hl-unit">' + esc(t("hl_match")) + "</span></p></div>" +
      '<div class="hl-body"><p class="eyebrow">' + esc(eyebrow) + "</p>" +
      '<h3 class="hl-name">' + esc(name) + "</h3><p class=\"hl-sub\">" + esc(sub) + "</p>" + nextLine + noteLine + "</div></article>";
  }
  function headlineSet(group, isCand, level, who, ranked, opts) {
    var multi = group.length > 1;
    var kid = isKid(level);
    var names = group.map(function (g) { return isCand ? CBY[g.id].name : PBY[g.id].short_name; });
    var banner = multi ? '<div class="close-banner"><span class="tag tag-solid">' + esc(t("close_result")) + "</span><span>" +
      esc(t(kid ? "close_banner_kid" : "close_banner", { names: joinAnd(names), points: CLOSE_POINTS })) + "</span></div>" : "";
    return '<div class="hl-set"><p class="eyebrow">' + esc(who) + "</p>" + banner + '<div class="hl-cards' + (multi ? " multi" : "") + '">' +
      group.map(function (g, k) { return headlineCard(g, isCand, group, level, k, ranked && ranked[1], opts); }).join("") + "</div></div>";
  }
  /** One line per person: their own closest party (or close group), plus how often the family gave the same answer. */
  function whoStrip(R) {
    var items = R.members.map(function (m) {
      if (!m.answered) return '<li><span class="who-n">' + esc(m.name) + '</span><span class="muted">' + esc(t("skipped_every_lc")) + "</span></li>";
      return '<li><span class="who-n">' + esc(m.name) + "</span>" + m.close.map(function (c) {
        return plate(c.id, "xs") + "<bdi>" + esc(PBY[c.id].short_name) + " " + fmtPct(c.pct) + PCT() + "</bdi>";
      }).join('<span class="muted">' + esc(t("and_word")) + "</span>") + (m.close.length > 1 ? '<span class="tag">' + esc(t("close_tag")) + "</span>" : "") + "</li>";
    }).join("");
    var same = R.agreeCounts.agree;
    items += '<li class="who-agree">' + esc(t("who_same", { n: same, total: QUESTIONS.length })) + "</li>";
    return '<ul class="who-strip" aria-label="' + esc(t("who_strip_label")) + '">' + items + "</ul>";
  }

  function pickText(q, oid, level) {
    if (!oid || oid === "skip") return null;
    var o = optionOf(q, oid);
    return o ? pick(o.text, level) : null;
  }
  function chipFor(q, m, level, isFamily) {
    var a = m.answers[q.id];
    if (!a || !a.choice || a.choice === "skip") return '<span class="pick-chip skip">' + esc(isFamily ? t("chip_fam_skipped", { name: m.name }) : t("chip_skipped")) + "</span>";
    var al = alignedParties(q, a.choice);
    var dots = '<span class="pick-dots">' + al.map(function (pid) { return '<span class="dot" style="' + partyVars(pid) + '"></span>'; }).join("") + "</span>";
    var names = al.map(function (pid) { return PBY[pid].short_name; }).join(" / ");
    return '<span class="pick-chip" title="' + esc(pickText(q, a.choice, level)) + '">' + dots + esc(isFamily ? t("chip_fam_closest", { name: m.name, parties: names }) : t("chip_closest", { parties: names })) + "</span>";
  }

  function issueDetails(q, R, order, level, openSet) {
    var kid = isKid(level);
    var il = impLabels(level);
    var ms = R.members;
    var picks = ms.map(function (m) {
      var a = m.answers[q.id];
      var txt = a ? pickText(q, a.choice, level) : null;
      return '<div class="pick"><p class="pick-who">' + esc(m.name) + (txt && a.importance !== "medium" ? ' <span class="tag">' + esc(kid ? il[a.importance] : t("imp_tag", { level: il[a.importance] })) + "</span>" : "") + "</p>" +
        "<p>" + (txt ? esc(txt) : '<span class="muted">' + esc(t(kid ? "not_sure" : "not_sure_skipped")) + "</span>") + "</p></div>";
    }).join("");
    var head = '<tr><th scope="col">' + esc(t("col_party")) + "</th>" + ms.map(function (m) { return '<th scope="col">' + esc(R.isFamily ? m.name : t("col_your_answer")) + "</th>"; }).join("") + "</tr>";
    var rows = order.map(function (pid) {
      var p = PBY[pid];
      var np = noPos(q, pid);
      var cells = ms.map(function (m) {
        if (np) return "";
        var a = m.answers[q.id];
        if (!a || !a.choice || a.choice === "skip") return '<td class="muted xs">' + esc(t("skipped_lc")) + "</td>";
        var s = Number(optionOf(q, a.choice).scores[pid]);
        var pips = '<span class="pips" role="img" aria-label="' + esc(t("pips_aria", { n: s })) + '">' + [1, 2, 3, 4].map(function (k) { return "<i" + (k <= s ? ' class="on"' : "") + "></i>"; }).join("") + "</span>";
        return "<td>" + pips + '<span class="pips-n">' + s + "/4</span></td>";
      }).join("");
      if (np) cells = '<td colspan="' + ms.length + '"><span class="tag tag-dash">' + esc(t("no_position")) + '</span> <span class="xs muted">' + esc(t("no_position_left_out")) + "</span></td>";
      return '<tr style="' + partyVars(pid) + '"><th scope="row"><span class="th-party">' + plate(pid, "xs") + '<span class="th-name">' + esc(p.short_name) + "</span></span></th>" + cells + "</tr>";
    }).join("");
    var positions = order.map(function (pid) {
      var p = PBY[pid];
      var pp = q.party_positions[pid] || {};
      var np = pp.no_position === true;
      var tags = "";
      if (np) tags += '<span class="tag tag-dash">' + esc(t("no_position")) + "</span>";
      if (!np && pp.basis === "inferred") tags += '<span class="tag tag-dash">' + esc(basisLabel("inferred")) + "</span>";
      if (!np && pp.basis && pp.basis !== "inferred") tags += '<span class="tag">' + esc(basisLabel(pp.basis)) + "</span>";
      if (!np && pp.confidence) tags += '<span class="tag">' + esc(confLabel(pp.confidence)) + "</span>";
      var src = (pp.sources || []).map(function (s) { return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.label) + "</a>"; }).join("");
      return '<div class="pos' + (np ? " nopos" : "") + '">' +
        '<div class="pos-head">' + plate(pid, "xs") + '<span class="pos-name">' + esc(p.short_name) + "</span>" + tags + "</div>" +
        "<p>" + esc(pick(pp.text, level)) + "</p>" +
        (src ? '<div class="pos-src"><span class="muted">' + esc(t("sources_label")) + "</span>" + src + "</div>" : "") + "</div>";
    }).join("");
    var chips = ms.map(function (m) { return chipFor(q, m, level, R.isFamily); }).join("");
    var npList = order.filter(function (pid) { return noPos(q, pid); }).map(function (pid) { return PBY[pid].short_name; });
    var infList = order.filter(function (pid) { var pp = q.party_positions[pid]; return pp && !pp.no_position && pp.basis === "inferred"; }).map(function (pid) { return PBY[pid].short_name; });
    var sumTags = (npList.length ? '<span class="tag tag-dash">' + esc(t("no_position_list", { parties: commaList(npList) })) + "</span>" : "") +
      (infList.length ? '<span class="tag tag-dash">' + esc(t("inferred_list", { parties: commaList(infList) })) + "</span>" : "");
    var ag = R.isFamily ? agreement(q, ms.map(function (m) { return m.answers[q.id] || {}; })) : null;
    return '<details class="issue" id="issue-' + q.id + '"' + (openSet[q.id] ? " open" : "") + ">" +
      '<summary><span class="sum-main"><span class="sum-title">' + esc(issueLabel(q, level)) + localTag(q) +
      (ag ? '<span class="agree-label' + (ag.kind === "na" ? " na" : "") + '">' + esc(agreeLabel(ag, level)) + "</span>" : "") + "</span>" +
      '<span class="sum-picks">' + chips + sumTags + "</span></span>" +
      '<span class="sum-toggle" aria-hidden="true"><span class="plus">+</span><span class="minus">-</span></span></summary>' +
      '<div class="issue-body">' +
      '<div class="stack-s"><p class="eyebrow">' + esc(t("issue_the_question")) + "</p><p><strong>" + esc(pick(q.prompt, level)) + "</strong></p></div>" +
      '<div class="stack-s"><p class="eyebrow">' + esc(t(R.isFamily ? "issue_each_chose" : "issue_you_chose")) + '</p><div class="picks">' + picks + "</div></div>" +
      '<div class="stack-s"><p class="eyebrow">' + esc(t("issue_how_close")) + '</p><div class="close-tbl"><table><thead>' + head + "</thead><tbody>" + rows + "</tbody></table></div></div>" +
      '<div class="stack-s"><p class="eyebrow">' + esc(t("issue_positions")) + '</p><div class="positions">' + positions + "</div></div>" +
      "</div></details>";
  }

  /** Agreement label at the reader's level. Every label is outlined, so no outcome gets more visual weight. */
  function agreeLabel(ag, level) {
    if (["agree", "close", "mostly", "split", "na"].indexOf(ag.kind) < 0) return ag.label;
    return t((isKid(level) ? "agree_kid_" : "agree_") + ag.kind);
  }

  }
  var foldState = {};
  /* ------------------------------------------------------------------ */
  /* Left-to-right line                                                  */
  /* ------------------------------------------------------------------ */
  /*
   * Built from the 13 province-wide questions only, so the line is the same in every riding.
   * 1. Party axis: the first principal component of the party x answer-option score matrix (no_position cells take
   *    the mean of the parties that have a position, so they pull no party either way). Oriented with the NDP on the left.
   * 2. Each answer option sits at the score-weighted mean axis position of the parties that back it.
   * 3. A person's mark is the importance-weighted mean position of their answered options. A party's mark is where a
   *    person who picks that party's top-scored option on every question it has a position on would land, so someone
   *    who agrees with a party on everything sits on that party's mark.
   * The ends are the furthest a person can reach (the left-most or right-most option on every question) or the
   * outermost party mark, whichever is further out. Positions are 0 (left end) to 100 (right end).
   */
  var SPECTRUM = null;
  function spectrumModel() {
    if (SPECTRUM) return SPECTRUM;
    var qs = SPEC.questions.filter(function (q) { return q.scope === "provincial"; });
    var P = PARTY_IDS, n = P.length;
    var cols = [];
    qs.forEach(function (q) {
      q.options.forEach(function (o) {
        var have = P.filter(function (pid) { return !noPos(q, pid); }).map(function (pid) { return Number(o.scores[pid]); });
        var m = have.length ? have.reduce(function (a, b) { return a + b; }, 0) / have.length : 0;
        var col = P.map(function (pid) { return noPos(q, pid) ? m : Number(o.scores[pid]); });
        var mu = col.reduce(function (a, b) { return a + b; }, 0) / n;
        cols.push(col.map(function (v) { return v - mu; }));
      });
    });
    var K = P.map(function (_, i) { return P.map(function (_, j) { return cols.reduce(function (s, c) { return s + c[i] * c[j]; }, 0); }); });
    var v = P.map(function (_, i) { return i + 1; });
    for (var it = 0; it < 500; it++) {
      var w = K.map(function (row) { return row.reduce(function (s, k, j) { return s + k * v[j]; }, 0); });
      var norm = Math.sqrt(w.reduce(function (s, x) { return s + x * x; }, 0)) || 1;
      v = w.map(function (x) { return x / norm; });
    }
    if (v[P.indexOf("ndp")] > 0) v = v.map(function (x) { return -x; });
    var ax = {};
    P.forEach(function (pid, i) { ax[pid] = v[i]; });
    var pos = {};
    var lo = 0, hi = 0;
    qs.forEach(function (q) {
      pos[q.id] = {};
      var vals = [];
      q.options.forEach(function (o) {
        var num = 0, den = 0;
        P.forEach(function (pid) { if (noPos(q, pid)) return; var s = Number(o.scores[pid]); num += s * ax[pid]; den += s; });
        var x = den > 0 ? num / den : null;
        pos[q.id][o.id] = x;
        if (x != null) vals.push(x);
      });
      lo += Math.min.apply(null, vals) / qs.length;
      hi += Math.max.apply(null, vals) / qs.length;
    });
    var dots = {};
    P.forEach(function (pid) {
      var xs = [];
      qs.forEach(function (q) {
        if (noPos(q, pid)) return;
        var top = Math.max.apply(null, q.options.map(function (o) { return Number(o.scores[pid]); }));
        var tied = q.options.filter(function (o) { return Number(o.scores[pid]) === top && pos[q.id][o.id] != null; });
        if (tied.length) xs.push(tied.reduce(function (s, o) { return s + pos[q.id][o.id]; }, 0) / tied.length);
      });
      dots[pid] = mean(xs);
    });
    P.forEach(function (pid) { if (dots[pid] != null) { lo = Math.min(lo, dots[pid]); hi = Math.max(hi, dots[pid]); } });
    var span = hi - lo || 1;

  /**
   * Places the labels of the line: each label is centred on its mark, kept inside the line's width, and moved to the
   * next lane (further from the rule) when it would touch a label already placed. Party lanes grow upward, people downward.
   */
  function layoutSpectrum() {
    var box = el("spec");
    if (!box || !box.getClientRects().length) return;
    var W = box.querySelector(".spec-rule").getBoundingClientRect().width;
    if (!W) return;
    var GAP = 6;
    box.querySelectorAll(".spec-lanes").forEach(function (lanesEl) {
      var up = lanesEl.classList.contains("spec-up");
      var marks = Array.prototype.slice.call(lanesEl.querySelectorAll(".spec-mark"));
      var items = marks.map(function (mk) {
        var lab = mk.querySelector(".spec-lab");
        return { mk: mk, x: (Number(mk.getAttribute("data-x")) / 100) * W, w: lab.getBoundingClientRect().width, h: lab.getBoundingClientRect().height };
      }).sort(function (a, b) { return a.x - b.x; });
      var lanes = [];
      items.forEach(function (it) {
        var left = Math.max(0, Math.min(W - it.w, it.x - it.w / 2));
        var k = 0;
        while (lanes[k] != null && lanes[k] + GAP > left) k++;
        lanes[k] = left + it.w;
        it.left = left; it.lane = k;
      });
      var labH = items.reduce(function (m, it) { return Math.max(m, it.h); }, 0);
      var STEP = labH + 4, BASE = 14; /* clears the rotated person marker, which reaches about 11px past the rule */
      var total = BASE + (lanes.length || 1) * STEP;
      lanesEl.style.height = total + "px";
      items.forEach(function (it) {
        var stemH = BASE + it.lane * STEP;
        var stem = it.mk.querySelector(".spec-stem");
        it.mk.style.width = it.w + "px";
        it.mk.style.left = it.left + "px";
        it.mk.style.top = (up ? total - stemH - labH : 0) + "px";
        it.mk.style.height = stemH + labH + "px";
        /* Stem runs from the rule to the label, at the mark's true position even when the label was shifted inward */
        stem.style.alignSelf = "flex-start";
        stem.style.marginLeft = Math.max(0, Math.min(it.w - 2, it.x - it.left - 1)) + "px";
      });
    });
  }

        barList(R.rankedC, true, M, CW);
      } else {
        para(RIDING ? t("list_pending") : t("pick_riding_cands"), 10, "normal", INK);
      }
      var others = RIDING ? (SPEC.local.others || []) : [];
      if (others.length) {
        y += 4;
        para(t("pdf_others", { list: commaList(others.map(function (o) { return t("name_party", { name: o.name, party: o.party_label || t("independent") }); })) }), 9, "normal", MUTED);
      }

      if (R.isFamily) {
        ensure(R.members.length * 31 + 60);
        heading(t("each_person"), 14);
        var colX = [M, M + 150];
        var colw = (CW - 150) / PARTY_IDS.length;
        font("bold", 7.5); color(MUTED);
        TX.text(t("pdf_col_person"), colX[0], y + 8);
        PARTY_IDS.forEach(function (pid, k) {
          var lab = PBY[pid].short_name.replace(/^BC /, "").toUpperCase();
          fitFont("bold", 7.5, 5.5, lab, colw - 6);
          if (TX.width(lab) > colw - 6) lab = lab.slice(0, Math.max(4, Math.floor(lab.length * (colw - 6) / TX.width(lab)) - 1)) + ".";
          TX.text(lab, colX[1] + k * colw, y + 8);
        });
        y += 14;
        R.members.forEach(function (m) {
          ensure(31);
          draw(LINE); doc.setLineWidth(0.5); doc.line(M, y, M + CW, y);
          font("bold", 10); color(INK);
          var nmLines = TX.split(m.pname, 76);
          TX.text(nmLines[0], colX[0], y + 14);
          font("normal", 8); color(MUTED);
          TX.text(levelInfo(m.level).label, colX[0] + 80, y + 14);
          /* A cell that does not fit its column at 8pt (a longer "(top)" mark) wraps to two lines in a taller row */
          var rowH = 22;
          var cells = PARTY_IDS.map(function (pid) {
            var v = m.parties[pid];
            var isTop = m.answered && m.close.some(function (c) { return c.id === pid; });
            var cell = !m.answered ? "-" : v == null ? t("pdf_na") : isTop ? t(m.close.length > 1 ? "pdf_close_mark" : "pdf_top_mark", { pct: fmtPct(v) + PCT() }) : fmtPct(v) + PCT();
            var st = isTop ? "bold" : "normal";
            fitFont(st, 10, 8, cell, colw - 4);
            var lines = TX.width(cell) > colw - 4 ? TX.split(cell, colw - 4).slice(0, 2) : [cell];
            if (lines.length > 1) rowH = 31;
            return { st: st, cell: cell, lines: lines };
          });
          cells.forEach(function (c, k) {
            if (c.lines.length > 1) { font(c.st, 8); color(INK); c.lines.forEach(function (ln, j) { TX.text(ln, colX[1] + k * colw, y + 12 + j * 10); }); }
            else { fitFont(c.st, 10, 8, c.cell, colw - 4); color(INK); TX.text(c.cell, colX[1] + k * colw, y + 14); }
          });
          y += rowH;
        });
      }

      if (R.drivers.length) {
        var pTop = PBY[R.rankedP[0].id].short_name, pSec = PBY[R.rankedP[1].id].short_name;
        var fam = R.isFamily ? "_family" : "";
        if (R.closeP.length > 1) {
          heading(t("drv_title_close"), 14);
          para(t("pdf_drv_close" + fam, { top: pTop, second: pSec, points: CLOSE_POINTS }), 9.5, "normal", MUTED);
        } else {
          heading(t("pdf_drv_title"), 14);
          para(t("drv_intro" + fam, { top: pTop, second: pSec, _poss: true }), 9.5, "normal", MUTED);
        }
        y += 2;
        R.drivers.forEach(function (d, k) {
          para((k + 1) + ". " + t("pdf_drv_line", { issue: issueLabel(QBY[d.qid], lv), lead: fmt1(d.lead) }), 11, "bold");
        });
      }

      /* Per-issue summary */
      ensure(160);
      y += 10;
      heading(t("issue_by_issue"), 16);
      para(t("pdf_issue_note"), 9.5, "normal", MUTED);
      y += 6;
      var il = impLabels(lv);
      /* Answer lines are indented on the side where the party dots sit (the right in Farsi) */
      var IX = isRtl() ? M : M + 12;
      QUESTIONS.forEach(function (q) {
        ensure(48);
        draw(LINE); doc.setLineWidth(0.5); doc.line(M, y, M + CW, y); y += 6;
        para(q.scope !== "provincial" ? t("pdf_issue_local", { issue: issueLabel(q, lv), region: regionName() || t("local_tag") }) : issueLabel(q, lv), 11.5, "bold");
        R.members.forEach(function (m) {
          var a = m.answers[q.id];
          var tx = a ? pickText(q, a.choice, lv) : null;
          var al = tx ? alignedParties(q, a.choice) : [];
          function pre(s) { return R.isFamily ? t("colon", { a: m.pname, b: s }) : s; }
          if (!tx) { para(pre(t("text_not_sure")), 9.5, "italic", MUTED, CW - 12, IX); return; }
          ensure(9.5 * LH * 2 + 12);
          var startY = y;
          para(pre(a.importance !== "medium" ? t("pdf_imp", { text: tx, level: il[a.importance] }) : tx), 9.5, "normal", INK, CW - 12, IX);
          var dotY = startY + 6;
          var dotX = isRtl() ? M + CW - 3 : M + 3, dir = isRtl() ? -1 : 1;
          al.slice(0, 2).forEach(function (pid, k) { fill(hexRgb(PBY[pid].color)); doc.circle(dotX + dir * k * 5, dotY, 2.6, "F"); });
          para(t("chip_closest", { parties: al.map(function (pid) { return PBY[pid].short_name; }).join(" / ") }), 8.5, "bold", MUTED, CW - 12, IX);
        });
        var np = PARTY_IDS.filter(function (pid) { return noPos(q, pid); }).map(function (pid) { return PBY[pid].short_name; });
        if (np.length) para(t("no_position_list", { parties: commaList(np) }), 8.5, "normal", MUTED, CW - 12, IX);
        y += 4;
      });
    }

    newPage();
    heading(t("method"), 14);
    para(pick(SPEC.meta.method_summary, Math.max(3, lv)), 9.5, "normal", INK);
    y += 6;
    heading(t("pdf_disclaimer"), 14);
    para(pick(SPEC.meta.disclaimer, Math.max(3, lv)), 9.5, "normal", INK);
    y += 6;
    heading(t("how_to_vote"), 14);
    var h = SPEC.how_to_vote;
    [[t("htv_voting_day"), h.voting_day], [t("htv_advance"), h.advance_voting], [t("htv_mail"), h.mail_in], [t("htv_who"), h.eligibility], [t("pdf_htv_id"), h.id_rules]].forEach(function (it) {
      para(t("colon", { a: it[0], b: it[1] }), 9.5, "normal", INK);
      y += 2;
    });
    para(t("pdf_sources_note"), 9, "normal", MUTED);

    var pages = doc.getNumberOfPages();
    for (var i = 1; i <= pages; i++) {
      doc.setPage(i);
      draw(LINE); doc.setLineWidth(0.5); doc.line(M, PH - FOOT + 6, PW - M, PH - FOOT + 6);
      font("normal", 7.5); color(MUTED);
      var foot = TX.split(t("pdf_footer", { date: dateLong(SPEC.meta.data_as_of) }), CW - 60);
      foot.slice(0, 3).forEach(function (ln, k) { TX.text(ln, M, PH - FOOT + 18 + k * 9, { box: CW - 60 }); });
      TX.text(t("pdf_page", { n: i, total: pages }), PW - M, PH - FOOT + 18, { align: "right" });
    }
    return doc.output("blob");
  }

  var downloads = null;
  var downloadsState = "pending";
  function updatePdfUi() {
    var b = el("pdf-btn"), note = el("pdf-note");
    if (!b) return;
    b.hidden = downloadsState !== "ready";
    if (note) note.textContent = pdfNoteText();
  }
  function pdfNoteText() { return downloadsState === "none" ? t("pdf_unavailable") : downloadsState === "pending" ? t("pdf_checking") : ""; }
  (function initDownloads() {
    if (SITE) {
      /* Plain browser: hand the Blob to a temporary download link */
      downloads = {
        save: function (o) {
          var url = URL.createObjectURL(o.data);
          var a = document.createElement("a");
          a.href = url; a.download = o.filename; a.rel = "noopener";
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
          return Promise.resolve({ status: "delivered" });
        }
      };
      downloadsState = "ready";
      return;
    }
    var c = window.claude;
    var p;
    try { p = c && typeof c.use === "function" ? c.use("downloads") : Promise.resolve(null); } catch (e) { p = Promise.resolve(null); }
    Promise.resolve(p).then(function (d) {
      downloads = d || null;
      downloadsState = downloads ? "ready" : "none";
      updatePdfUi();
    }, function () { downloadsState = "none"; updatePdfUi(); });
  })();
  var saving = false;
  function savePdf() {
    if (saving || !downloads) return;
    var b = el("pdf-btn");
    var blob;
    try { blob = buildResultsPdf(S); } catch (e) {
      setStatus(t(window.jspdf ? "pdf_build_failed" : "pdf_tool_missing"));
      return;
    }
    saving = true;
    if (b) b.disabled = true;
    setStatus(SITE ? "" : t("pdf_confirm"));
    var d = new Date();
    var stamp = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    downloads.save({ filename: "bc-vote-helper-results-" + stamp + ".pdf", data: blob }).then(function (res) {
      setStatus(res && res.status === "delivered" ? "" : t("pdf_saved"));
    }, function (err) {
      var code = err && err.code;
      if (code === "declined") setStatus(t("pdf_declined"));
      else if (code === "rate_limited") setStatus(t("pdf_rate_limited"));
      else if (code === "too_large") setStatus(t("pdf_too_large"));
      else if (code === "bad_request" || code === "transform_error" || code === "rejected_extension") setStatus(t("pdf_page_problem"));
      else if (code === "extension_not_enabled") setStatus(t("pdf_not_enabled"));
      else { downloadsState = "none"; setStatus(t("pdf_files_unavailable")); updatePdfUi(); }
    }).then(function () { saving = false; var bb = el("pdf-btn"); if (bb) bb.disabled = false; });
  }

  /* ------------------------------------------------------------------ */
  /* Anonymous totals (website only, opt-out on the start screen)        */
  /* ------------------------------------------------------------------ */
  function submitResponses() {
    if (!COLLECT || !S.share) return;
    var people = [];
    for (var i = 0; i < S.count; i++) {
      var p = S.people[i], ans = {};
      QUESTIONS.forEach(function (q) {
        var a = p.answers[q.id];
        if (a && a.choice) ans[q.id] = { c: a.choice, w: a.importance || "medium" };
      });
      people.push({ level: p.level, answers: ans });
    }
    var body = JSON.stringify({ v: 1, sid: S.sid, data_as_of: SPEC.meta.data_as_of, count: S.count, riding: S.riding || null, lang: LANG, people: people });
    var key = String(hashStr(body));
    if (S.sentKey === key) return;
    try {
      fetch("/api/response", { method: "POST", headers: { "Content-Type": "application/json" }, body: body, keepalive: true })
        .then(function (r) { if (r.ok) { S.sentKey = key; save(); } }, function () { /* offline: totals are optional */ });
    } catch (e) { /* fetch unavailable */ }
  }

  /* ------------------------------------------------------------------ */
  /* Start over (in-page confirmation)                                   */
  /* ------------------------------------------------------------------ */
  function confirmReset() {
    var root = el("overlay-root");
    var opener = document.activeElement;
    root.innerHTML = '<div class="overlay" id="reset-overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="reset-title" aria-describedby="reset-desc">' +
      '<h2 class="h3" id="reset-title">' + esc(t("reset_title")) + "</h2>" +
      '<p id="reset-desc">' + esc(t("reset_desc")) + "</p>" +
      '<div class="row"><button type="button" class="btn btn-primary" id="reset-yes">' + esc(t("reset_all")) + '</button><button type="button" class="btn" id="reset-no">' + esc(t("reset_keep")) + "</button></div></div></div>";
    var yes = el("reset-yes"), no = el("reset-no"), ov = el("reset-overlay");
    function close() { root.innerHTML = ""; document.removeEventListener("keydown", onKey, true); if (opener && opener.focus && document.body.contains(opener)) opener.focus(); }
    function onKey(e) {
      if (e.key === "Escape") { e.preventDefault(); close(); }
      if (e.key === "Tab") {
        var f = [yes, no];
        var idx = f.indexOf(document.activeElement);
        e.preventDefault();
        f[(idx + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
      }
    }
    document.addEventListener("keydown", onKey, true);
    ov.addEventListener("click", function (e) { if (e.target === ov) close(); });
    no.addEventListener("click", close);
    yes.addEventListener("click", function () {
      root.innerHTML = "";
      document.removeEventListener("keydown", onKey, true);
      lsClear();
      S = freshState();
      applyRiding(null);
      ridingUi = { open: false, alts: [], choices: [], busy: false, status: "" };
      foldState = {};
      lvlFoldOpen = false;
      lvlLayout = null;
      tgCtxOpen = false;
      render("setup-title");
      scrollTop();
    });
    no.focus();
  }
  el("foot-reset").addEventListener("click", confirmReset);
  el("mast-reset").addEventListener("click", confirmReset);

  /* ------------------------------------------------------------------ */
  /* Router                                                              */
  /* ------------------------------------------------------------------ */
  function render(focusId) {
    var mast = el("top");
    if (mast) mast.classList.toggle("compact", S.phase !== "setup");
    document.documentElement.classList.toggle("quiz-mode", S.phase === "quiz" || S.phase === "together");
    var mr = el("mast-reset");
    if (mr) mr.hidden = S.phase === "setup";
    el("foot-reset").hidden = S.phase === "results";
    if (S.phase === "quiz") renderQuiz();
    else if (S.phase === "handoff") renderHandoff();
    else if (S.phase === "together") renderTogether();
    else if (S.phase === "results") renderResults();
    else renderSetup();
    if (focusId) { scrollTop(); focusHeading(focusId); }
  }

  /* ------------------------------------------------------------------ */
  /* Language switching                                                  */
  /* ------------------------------------------------------------------ */
  /** Masthead, footer, notice and title in the current language. */
  function paintStatic() {
    document.querySelectorAll("[data-t]").forEach(function (n) { n.textContent = t(n.getAttribute("data-t")); });
    paintCountdown();
    var ft = el("foot-text");
    if (ft) ft.innerHTML = th("foot_text", { date: '<span id="asof">' + esc(dateLong(SPEC.meta.data_as_of)) + "</span>" });
    document.title = t("doc_title");
    var chip = el("lang-chip"), sel = el("lang-select"), lab = el("lang-label");
    if (chip) chip.hidden = AVAIL.length < 2;
    if (lab) lab.textContent = LANG === "en" ? t("lang_label") : t("lang_label") + " (Language)";
    if (sel && !sel.options.length) {
      sel.innerHTML = AVAIL.map(function (c) { var l = LANG_BY[c]; return '<option value="' + esc(c) + '" lang="' + esc(l.html) + '"' + (l.rtl ? ' dir="rtl"' : "") + ">" + esc(l.name) + "</option>"; }).join("");
      sel.addEventListener("change", function () { switchLang(sel.value); });
    }
    if (sel) sel.value = LANG;
    var note = el("lang-note");
    if (note) {
      var offer = LANG === "en" ? offerLang() : null, btn = el("lang-note-en");
      note.hidden = LANG === "en" && !offer;
      el("lang-note-text").textContent = LANG === "en" ? "" : t("ai_notice");
      btn.setAttribute("data-go", offer || "en");
      if (offer) {
        /* English page, reader's browser prefers a language we have: one button in that language's own name */
        var ol = LANG_BY[offer];
        btn.innerHTML = '<span class="lang-offer"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M1.6 8h12.8M8 1.4c2 2.1 2.9 4.3 2.9 6.6S10 12.5 8 14.6M8 1.4C6 3.5 5.1 5.7 5.1 8S6 12.5 8 14.6" fill="none" stroke="currentColor" stroke-width="1.3"></path></svg>' +
          '<span lang="' + esc(ol.html) + '"' + (ol.rtl ? ' dir="rtl"' : "") + ">" + esc(ol.name) + "</span></span>";
      } else btn.textContent = LANG === "en" ? "" : t("ai_notice_switch");
    }
  }
  /** On an English page that the reader did not choose: the first language in the browser's list, when we have it and it is not English. */
  function offerLang() {
    if (lsLangGet()) return null;
    var navs = [];
    try { navs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language]) || []; } catch (e) { navs = []; }
    for (var i = 0; i < navs.length; i++) {
      var c = normLang(navs[i]);
      if (c === "en") return null;
      if (c && isAvail(c)) return c;
    }
    return null;
  }
  /** Applies a loaded language: UI strings, spec text in place, riding write-up, <html lang/dir>, static text. */
  function setLangNow(code) {
    var b = BUNDLES[code] || { ui: {}, spec: {} };
    LANG = code;
    UI = code === "en" ? {} : b.ui || {};
    LOC = LANG_BY[code].locale;
    if (code !== "en" || Object.keys(SPEC_EN).length) overlaySpec(code === "en" ? null : b.spec || {});
    var de = document.documentElement;
    de.setAttribute("lang", LANG_BY[code].html);
    if (LANG_BY[code].rtl) de.setAttribute("dir", "rtl"); else de.removeAttribute("dir");
    applyRiding(S.riding);
    paintStatic();
  }
  /** Keeps a ?lang= link in step with the choice, so a reload shows the same language. */
  function syncUrlLang(code) {
    try {
      var u = new URL(window.location.href);
      if (!u.searchParams.has("lang")) return;
      if (code === "en") u.searchParams.delete("lang"); else u.searchParams.set("lang", code);
      window.history.replaceState(window.history.state, "", u.toString());
    } catch (e) { /* sandboxed view */ }
  }
  var langPending = null;
  /** User choice: load the bundle if needed, then re-render the current screen with every answer kept. */
  function switchLang(code) {
    if (!isAvail(code)) return Promise.resolve(false);
    langPending = code;
    return loadBundle(code).then(function () {
      if (langPending !== code) return false;
      lsLangSet(code);
      if (code === LANG) return true;
      setLangNow(code);
      syncUrlLang(code);
      render(null);
      return true;
    }, function () { paintStatic(); return false; });
  }
  el("lang-note-en").addEventListener("click", function () {
    switchLang(el("lang-note-en").getAttribute("data-go") || "en").then(function () { var s = el("lang-select"); if (s) s.focus(); });
  });

  /* Start: English at once; another language once its strings are loaded (website: up to 4 seconds, then English) */
  (function boot() {
    var want = initialLang();
    var started = false;
    function go(code) {
      if (started) return;
      started = true;
      setLangNow(code);
      render(null);
      document.documentElement.classList.remove("lang-wait");
    }
    if (want === "en") { go("en"); return; }
    loadBundle(want).then(function () { go(want); }, function () { go("en"); });
    setTimeout(function () { go("en"); }, 4000);
  })();

  /* Public, testable surface */
  window.BCVH = {
    spec: SPEC,
    weights: WEIGHTS,
    pick: pick,
    scoreParties: scoreParties,
    scoreLocal: scoreLocal,
    contributions: contributions,
    familyScores: familyScores,
    rankMap: rankMap,
    closeGroup: closeGroup,
    logoFit: logoFit,
    expText: expText,
    applyRiding: function (code) { applyRiding(code); },
    questionsFor: function (code) { return questionsFor(code).map(function (q) { return q.id; }); },
    parseRepresent: parseRepresent,
    normPostal: normPostal,
    drivers: drivers,
    alignedParties: alignedParties,
    agreement: agreement,
    shuffleOrder: shuffleOrder,
    computeResults: function (st) { return computeResults(st || S); },
    resultsText: function (st) { return resultsText(st || S); },
    buildResultsPdf: buildResultsPdf,
    getState: function () { return JSON.parse(JSON.stringify(S)); },
    setState: function (st) { var s = sanitizeState(st); if (s) { S = s; applyRiding(S.riding); save(); render(null); } return !!s; },
    render: function () { render(null); },
    setLang: function (code) { return switchLang(code); },
    lang: function () { return LANG; },
    langs: function () { return AVAIL.slice(); },
    t: function (key, vars) { return t(key, vars); },
    itemKey: itemKey
  };
})();
</script>
